<title>Trout Trot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* One-screen top-down river bank: world scaled to fit, river down one side, slim HUD on top, centered cards for start / pause / game over. Single autumn-daylight look by design. */
:root {
  --grass: #7c9c52;
  --river: #2c6f74;
  --trout: #e3798c;
  --leaf: #d9822b;
  --ink: #1f2b22;
  --muted: #55634f;
  --card: rgba(250, 249, 243, 0.95);
  --line: rgba(31, 43, 34, 0.15);
  --danger: #c8412f;
  --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--grass);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { touch-action: manipulation; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(rgba(250, 249, 243, 0.85), rgba(250, 249, 243, 0));
  pointer-events: none;
}
.stat { display: grid; }
.label { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.value { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.meter { display: grid; gap: 4px; min-width: 0; max-width: 260px; justify-self: center; width: 100%; }
.end { gap: 10px; }
.stats { width: 100%; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 4px 10px; text-align: left; font-size: 15px; color: var(--ink); }
.stats b { font-family: var(--display); font-weight: 600; color: var(--river); text-align: right; white-space: nowrap; }
.card .stats-note, .card .credits { font-size: 12px; max-width: none; line-height: 1.4; }
.card .credits { padding-top: 6px; border-top: 1px solid var(--line); }
.feathers { display: flex; gap: 4px; }
.feathers svg { width: 18px; height: 18px; stroke-width: 1.6; }
.feathers .on { fill: #e2a93b; stroke: #6b4a14; }
.feathers .off { fill: none; stroke: #8a8a8a; opacity: 0.6; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; }
.meter .row .label { white-space: nowrap; }
.label.power { color: var(--river); }
.bar { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.7); border: 2px solid rgba(31, 43, 34, 0.25); overflow: hidden; }
.fill { height: 100%; width: 100%; background: linear-gradient(90deg, #6fb3ad, var(--river)); border-radius: 999px; }
.meter.low .fill { background: var(--danger); animation: blink 0.5s steps(2) infinite; }
.meter.low .label:first-child { color: var(--danger); }
@keyframes blink { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .meter.low .fill { animation: none; } }
.icon-btn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--line); background: rgba(255, 255, 255, 0.8); color: var(--ink);
  font: 700 14px var(--body); cursor: pointer; display: grid; place-items: center;
}
.icon-btn:focus-visible, .play:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* Cards center when they fit and scroll when the screen is too short (small phones, landscape). */
.overlay {
  position: fixed; inset: 0; display: flex;
  overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: rgba(31, 43, 34, 0.25);
}
.card {
  margin: auto; flex-shrink: 0; box-sizing: border-box; /* padding inside the width, so it fits the screen */
  width: min(370px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center;
  padding: 26px 22px 24px; background: var(--card); border: 2px solid var(--line); border-radius: 24px;
  box-shadow: 0 18px 50px rgba(31, 43, 34, 0.3);
}
.card h1, .card h2 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 0.95; text-wrap: balance; color: var(--ink); }
.card h1 { font-size: 46px; }
.card h1 span { color: var(--trout); }
.card h2 { font-size: 34px; }
.card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 32ch; }
/* Start card: title, the two controls as tiles, and the start button. Nothing else. */
.controls { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.control {
  display: grid; gap: 2px; align-content: start; min-width: 0; text-align: left;
  padding: 10px 12px; border-radius: 14px; background: rgba(44, 111, 116, 0.09);
}
.control b { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.1; color: var(--river); }
.control span { font-size: 13px; line-height: 1.35; color: var(--muted); }
.card .over-round { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--ink); }
.play {
  margin-top: 4px; min-width: 180px; padding: 13px 28px; border: 0; border-radius: 999px;
  background: var(--trout); color: #3a0d16; font: 700 22px var(--display); cursor: pointer;
  box-shadow: 0 5px 0 #b45468;
}
.play:active { transform: translateY(3px); box-shadow: 0 2px 0 #b45468; }
/* Pause menu: jump to any round. */
.goto { width: 100%; display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); text-align: left; }
.goto-row { display: flex; gap: 8px; }
.goto input {
  flex: 1; min-width: 0; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink); font: 700 18px var(--body); font-variant-numeric: tabular-nums;
  user-select: text; -webkit-user-select: text; touch-action: manipulation;
}
.go-btn {
  padding: 10px 20px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--river); color: #fff; font: 700 18px var(--display);
}
.goto input:focus-visible, .go-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.card .goto-error { color: var(--danger); font-size: 14px; font-weight: 700; }
.text-btn {
  border: 0; background: none; padding: 8px 12px; cursor: pointer;
  font: 700 15px var(--body); color: var(--muted); text-decoration: underline; text-underline-offset: 3px;
}
.text-btn.armed { color: var(--danger); }
.card .version { font-size: 11px; line-height: 1; color: var(--muted); }
.text-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
</style>

<canvas id="game" role="img" aria-label="Trout Trot game area: a trout on the bank of a river"></canvas>
<div class="sr-only" id="announcer" aria-live="polite"></div>

<div class="hud" id="hud" hidden>
  <div class="stat">
    <span class="label">Round</span>
    <span class="value" id="roundValue">1</span>
  </div>
  <div class="meter" id="meter">
    <div class="row"><span class="label">Moisture</span><span class="label power" id="powerLabel" hidden>Invisible</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="feathers" id="feathers" hidden></div>
  </div>
  <button class="icon-btn" id="pauseBtn" aria-label="Pause">II</button>
</div>

<div class="overlay" id="startScreen" role="dialog" aria-modal="true" aria-labelledby="startTitle">
  <div class="card">
    <h1 id="startTitle">Trout <span>Trot</span></h1>
    <div class="controls">
      <div class="control"><b>Swipe</b><span>to flop. A longer swipe flops farther.</span></div>
      <div class="control"><b>Tap</b><span>beside the trout for a short hop.</span></div>
    </div>
    <button class="play" id="startBtn">Flop!</button>
    <button class="text-btn" id="restartBtn" hidden>Start over</button>
    <div class="version" id="versionLabel"></div>
  </div>
</div>

<div class="overlay" id="pauseScreen" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
  <div class="card">
    <h2 id="pauseTitle">Paused</h2>
    <button class="play" id="resumeBtn">Resume</button>
    <form class="goto" id="gotoForm" novalidate>
      <label class="label" for="gotoInput">Go to round</label>
      <div class="goto-row">
        <input id="gotoInput" type="number" inputmode="numeric" min="1" step="1" aria-describedby="gotoError">
        <button type="submit" class="go-btn">Go</button>
      </div>
      <p class="goto-error" id="gotoError" role="alert" hidden></p>
    </form>
  </div>
</div>

<div class="overlay" id="overScreen" role="dialog" aria-modal="true" aria-labelledby="overTitle" hidden>
  <div class="card">
    <h2 id="overTitle">Dried out</h2>
    <p class="over-round" id="overRound">Round 1</p>
    <button class="play" id="againBtn">Try again</button>
  </div>
</div>

<div class="overlay" id="leaveScreen" role="dialog" aria-modal="true" aria-labelledby="leaveTitle" hidden>
  <div class="card">
    <h2 id="leaveTitle">Leave Trout Trot?</h2>
    <button class="play" id="stayBtn">Stay</button>
    <button class="text-btn" id="leaveBtn">Leave</button>
  </div>
</div>

<div class="overlay" id="endScreen" role="dialog" aria-modal="true" aria-labelledby="endTitle" hidden>
  <div class="card end">
    <h2 id="endTitle">You made it home</h2>
    <p id="endSub">The Great Eagle is beaten, and the river is yours.</p>
    <div class="stats" id="endStats"></div>
    <p class="stats-note" id="endNote"></p>
    <button class="play" id="fightBtn">Fight again</button>
    <form class="goto" id="endGoto" novalidate>
      <label class="label" for="endGotoInput">Go to round</label>
      <div class="goto-row">
        <input id="endGotoInput" type="number" inputmode="numeric" min="1" step="1" aria-describedby="endGotoError">
        <button type="submit" class="go-btn">Go</button>
      </div>
      <p class="goto-error" id="endGotoError" role="alert" hidden></p>
    </form>
    <button class="text-btn" id="endRestartBtn">Start over</button>
    <p class="credits" id="endCredits"></p>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const APP_VERSION = '1.1.004'; // shown on the start screen; keep in step with `npm run version:set`
  $('versionLabel').textContent = 'v' + APP_VERSION;
  const ui = {
    hud: $('hud'), round: $('roundValue'), fill: $('fill'), meter: $('meter'), power: $('powerLabel'),
    start: $('startScreen'), pause: $('pauseScreen'), over: $('overScreen'), overTitle: $('overTitle'),
    overRound: $('overRound'), feathers: $('feathers'), end: $('endScreen'), leave: $('leaveScreen')
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Screen reader announcements. Clearing first makes a repeated message (another +1) read again.
  const announcer = $('announcer');
  function announce(msg) {
    announcer.textContent = '';
    setTimeout(() => { announcer.textContent = msg; }, 50);
  }

  // Top-down world, 860 tall; the bank widens every round (WW) and the camera scrolls sideways
  // to follow the trout, showing VIEW_W units at a time on a phone. All game logic keeps the
  // river on the left; when `flip` is set, drawing and input are mirrored so it shows on the right.
  const VIEW_W = 600, WH = 860, FR = 12, GRAV = 1500, TOP = 95, BOTTOM = WH - 35;
  let WW = 600, TREES = WW - 52, cam = 0;
  let W = 0, H = 0, view = { s: 1, oy: 0, w: VIEW_W };

  let mode = 'title'; // title | play | paused | saved | dying | over
  let level = 1, moisture = 100, stateTimer = 0, bannerTimer = 0, seasonTimer = 0, hintOn = true, clock = 0, deathBy = 'dry';
  // Rounds keep getting harder up to MAX_ROUND, then stay at that difficulty.
  const MAX_ROUND = 100;
  const SEASON_TIME = 2.4; // seconds a season's title ("Autumn", "Winter") shows before the round banner

  // Seasons. Rounds 1–99 are autumn, with the trees turning as the rounds go on. Rounds 100–199 are
  // winter: dead grass, bare trees and a frozen river, with snow building to round 190 and melting by 199.
  // Rounds 200–299 are spring, 300–399 summer, and round 400 is the finale, The Eagle's Nest.
  // `fall` runs from 0 to 1 across autumn; snowAt() below gives winter's snow. makeLevel sets them per round.
  const WINTER_FROM = 100, WINTER_FULL = 199, SPRING_FROM = 200, SUMMER_FROM = 300, FINALE_FROM = 400;
  const seasonOf = n => (n < WINTER_FROM ? 'autumn' : n < SPRING_FROM ? 'winter' : n < SUMMER_FROM ? 'spring' : n < FINALE_FROM ? 'summer' : 'finale');
  const clamp01 = v => Math.max(0, Math.min(1, v));
  // `season` is the current round's season; `winter` is the same fact as a flag, for the many winter-only checks.
  let season = 'autumn', winter = false, fall = 0, snow = 0, cover = 0, snowfall = 0, seasonName = '';
  // Spring (round 200 on), each value 0 to 1, from springAt() below:
  //   melt    leftover patches of snow: thin at round 200, gone by 205.
  //   green   the ground: brown and muddy at 200, full green by 240.
  //   leafOut the hardwoods: bare at 200, each leafing out on its own schedule, all in full leaf by 250.
  //   flood   the river: high and brown at 200, running clear by 240.
  //   blossom the wild plums: in flower from about 230 to 250, at their best at 240.
  const noSpring = { melt: 0, green: 0, leafOut: 0, flood: 0, blossom: 0 };
  let spring = noSpring;
  function springAt(n) {
    if (seasonOf(n) !== 'spring') return noSpring;
    const t = n - SPRING_FROM;
    return { melt: clamp01(1 - t / 5), green: clamp01(t / 40), leafOut: clamp01(t / 50), flood: clamp01(1 - t / 40), blossom: clamp01(1 - Math.abs(n - 240) / 10) };
  }
  let springGround = '#7c9c52'; // the ground's colour this round, in spring
  // Summer (round 300 on): the sun dries the trout 15% faster than at full strength, rising to 25% by 399.
  const summerHeat = () => (season === 'summer' ? 1.15 + 0.1 * clamp01((level - SUMMER_FROM) / 99) : 1);
  // Winter snow, by round (each 0 to 1):
  //   cover    how much of the ground is white: 10% → 100% over rounds 100–110, 100% through 190,
  //            then melting back to 10% by 199, where it stays.
  //   snow     how deep it is: a dusting through 110, deepening steadily to full depth at 190,
  //            then melting down with the coverage.
  //   snowfall how hard it's snowing: building through 190, tapering to nothing by 199.
  function snowAt(n) {
    if (seasonOf(n) !== 'winter') return { cover: 0, depth: 0, falling: 0 };
    const c = Math.min(n, WINTER_FULL);
    const cover = c <= 110 ? 0.1 + 0.9 * (c - WINTER_FROM) / 10 : c <= 190 ? 1 : 1 - 0.9 * (c - 190) / 9;
    const depth = c <= 110 ? 0.1 : c <= 190 ? 0.1 + 0.9 * (c - 110) / 80 : cover;
    const falling = c <= 190 ? 0.2 + 0.8 * (c - WINTER_FROM) / 90 : (WINTER_FULL - c) / 9;
    return { cover, depth, falling };
  }

  // Progress: the round the player is on is saved on the device each time they clear a round,
  // and play always starts from it. There is no score.
  const SAVE_KEY = 'trout-trot-round';
  let savedRound = 1;
  try {
    savedRound = Math.max(1, parseInt(localStorage.getItem(SAVE_KEY) || '1', 10) || 1);
    localStorage.removeItem('flop-home-trout-best'); // the old best-score save, no longer used
  } catch (e) {}
  function saveRound(n) {
    savedRound = n;
    try { localStorage.setItem(SAVE_KEY, String(n)); } catch (e) {}
  }
  // Run stats, shown on the ending card: rounds cleared by playing (a jump with Go to round adds none),
  // flops, times lost (caught, or dried out) and time played. They count from the version that added them,
  // so a player with saved progress starts at 0 (`hadProgress` lets the card say so). Start over resets them.
  const STATS_KEY = 'trout-trot-stats';
  const freshStats = () => ({ rounds: 0, flops: 0, lost: 0, ms: 0, since: APP_VERSION, hadProgress: savedRound > 1 });
  let stats = freshStats(), statsSaveT = 0;
  try {
    const s = JSON.parse(localStorage.getItem(STATS_KEY) || 'null');
    if (s && typeof s === 'object') {
      const num = v => typeof v === 'number' && isFinite(v) && v >= 0 ? v : 0;
      stats = { rounds: num(s.rounds), flops: num(s.flops), lost: num(s.lost), ms: num(s.ms),
        since: typeof s.since === 'string' && s.since ? s.since : APP_VERSION, hadProgress: s.hadProgress === true };
    }
  } catch (e) {}
  function saveStats() { try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {} }
  function resetStats() { stats = freshStats(); saveStats(); }
  const fmtTime = ms => {
    const s = Math.floor(ms / 1000), hr = Math.floor(s / 3600), mn = Math.floor(s % 3600 / 60);
    return hr ? hr + ' h ' + mn + ' min' : mn ? mn + ' min ' + (s % 60) + ' s' : (s % 60) + ' s';
  };

  const fish = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, angle: Math.PI, cooldown: 0, alpha: 1, lift: 0 };
  let flip = false, river = { base: 185, amp: 0, phase: 0, far: 60 };
  let boulders = [], logs = [], springs = [], leaves = [], pebbles = [], trees = [], parts = [];
  let anglers = [], talus = [], cedars = [], ripples = [], drifts = [], holes = [], cracks = [], flakes = [], place = '';
  let grass = {}; // grass blades, grouped by color so each color draws as one path
  let snowGrain = null; // repeating speckle texture for winter snow, made once per round
  let flowers = []; // spring wildflowers: { kind, x, y, a }
  // Spring ground and river (rounds 200+).
  //  floes    ice floes, rounds 200–215, drifting downstream along the near bank. They all drift together,
  //           so the pattern repeats every FLOE_PERIOD units, and every third slot is left empty: there is
  //           always an open stretch of bank to enter the water by. A floe is solid footing, not water.
  //  mud      patches that cut a flop's length by 30% when the trout takes off from one.
  //  puddles  on rainy rounds, a few shallow ones; landing in one gives back some moisture.
  let floes = [], floeT = 0, mud = [], puddles = [];
  const FLOE_LAST = 215, FLOE_PERIOD = 1350, FLOE_SLOTS = 9, FLOE_SPEED = 32;
  const MUD_SLOW = 0.7, PUDDLE_GAIN = 15;
  const floeY = f => ((f.y0 + FLOE_SPEED * floeT) % FLOE_PERIOD + FLOE_PERIOD) % FLOE_PERIOD - 170;
  const floeX = (f, y) => shoreAt(y) - f.off; // sits against the near bank, wherever the bank bends
  function floeAt(x, y) {
    for (const f of floes) {
      const fy = floeY(f), dx = (x - floeX(f, fy)) / f.rx, dy = (y - fy) / f.ry;
      if (dx * dx + dy * dy < 1) return f;
    }
    return null;
  }
  const mudAt = (x, y) => mud.some(m => ((x - m.x) / m.rx) ** 2 + ((y - m.y) / m.ry) ** 2 < 1);
  // Summer shade and wind.
  //  shadeTrees  lone shade trees scattered all along the bank (a canopy sprite each); the ground under
  //              one is dark, and a trout standing there dries 40% slower.
  //  wind        on windy rounds gusts push a trout that is in the air sideways (along the river, one way
  //              for the whole round); the grass leans and leaves blow the same way.
  let shadeTrees = [], shadePool = [], windDir = 1;
  // More summer: tall grass, gravel bars, drifting canoes and tubers, dusk and the raccoon.
  //  tall      patches of tall prairie grass: a trout in one is hidden from the birds (one that has not yet
  //            dropped its ring loses track; a ring already down still strikes) but flops out of it are x0.8.
  //  bars      gravel bars: pale shoals that push the water's edge out into the river in places. edgeAt()
  //            is where the water really starts, and inRiver and the drawing both use it.
  //  floaters  canoes and tubers drifting down the river; landing in one bumps the trout back onto the bank.
  //  dusk      about one summer round in five (more later) is dusk: dark, warm light, fireflies, a shorter
  //            sight, one eagle and no osprey; and a raccoon that stalks the trout along the bank.
  let tall = [], tallBlades = {}, bars = [], floaters = [], dusk = false, raccoon = null, flies = [];
  // The finale (round 400, "The Eagle's Nest") is a boss fight; boss is null in every other round.
  //  bossLook  the arena's look in the current phase: '' (not the finale), 'autumn', 'snow' or 'storm'. The
  //            checks that were winter-only (snow, bare trees, ice) also answer to bossLook 'snow', and
  //            wind also answers to 'storm'.
  let boss = null, bossLook = '', bossGround = '#7c9c52', bossFlash = 0, bossFlashColor = '255,255,255', bossCrown = null;
  const FINALE_WW = 1100;
  // Storm rounds (the winter snowstorm, rounds 100–199, and the spring thunderstorm, 260–299): the birds
  // shelter, and the storm is the problem. `squall` is null on every other round (and in the finale).
  //  wind       gusts, clearly stronger than summer's: a calm spell, then a one-second warning (the rain and
  //             snow swing to the new direction, the grass flattens, a whoosh), then the gust, which shoves a
  //             trout in the air and, on winter ice, pushes it along the ground. Each gust has its own direction,
  //             including headwinds from the river. In the snowstorm a flop into the wind is weaker.
  //  whiteout   snowstorm only: now and then the sight radius closes in, then recovers.
  //  strike     thunderstorm only: a yellow-white warning ring, then a lightning strike; the trout is safe if it
  //             has left the ring (or is high in a hop) by then.
  // Everything gets worse later in the season (`sev`, 0 to 1): stronger, more frequent gusts and strikes.
  let squall = null;
  const stormRound = () => (weather === 'storm' || weather === 'thunder') && season !== 'finale';
  const STRIKE_R = 70;
  const GUST_DIRS = [[0, 1], [0, -1], [1, 0], [1, 0], [0.707, 0.707], [0.707, -0.707], [-1, 0]]; // [along the bank..., toward the trees]
  function newSquall(n) {
    const sev = n >= SPRING_FROM ? clamp01((n - 260) / 39) : clamp01((n - WINTER_FROM) / 99);

    snow: { label: 'Snowing', sight: 260, haze: 0.85, circle: 0.5, aimError: 25, abort: 0, drain: 1 },
    storm: { label: 'Snowstorm', sight: 150, haze: 0.95, circle: 1, aimError: 50, abort: 0.25, drain: 1 },
    rain: { label: 'Raining', sight: 340, haze: 0.45, circle: 0, aimError: 0, abort: 0, drain: 0.9, tint: '168,182,192', dim: 0.06 },
    thunder: { label: 'Thunderstorm', sight: 260, haze: 0.6, circle: 0, aimError: 0, abort: 0, drain: 0.9, tint: '120,134,148', dim: 0.2 },
    // Summer: a heat wave (no haze, a bright warm tint, drying 15% faster), a downpour (heavy rain that
    // refills the trout, `refill` moisture per second, while it falls) and a wind (see gustNow).
    heat: { label: 'Heat wave', sight: 0, haze: 0, circle: 0, aimError: 0, abort: 0, drain: 1.15 },
    downpour: { label: 'Downpour', sight: 300, haze: 0.5, circle: 0, aimError: 0, abort: 0, drain: 0.9, tint: '150,166,178', dim: 0.12, refill: 2 },
    wind: { label: 'Windy', sight: 0, haze: 0, circle: 0, aimError: 0, abort: 0, drain: 1 }
  };
  let weather = 'clear';
  const sky = () => SKY[weather];
  const rollWeather = () => (Math.random() >= 0.25 ? 'clear' : Math.random() < 0.5 ? 'snow' : 'storm');
  // Spring rounds: mostly clear, one in five rainy, and from round 260 one in seven a thunderstorm.
  const STORM_FROM = 260;
  const rollSpringWeather = n => {
    const r = Math.random(), storm = n >= STORM_FROM ? 1 / 7 : 0;
    return r < storm ? 'thunder' : r < storm + 0.2 ? 'rain' : 'clear';
  };
  // Summer rounds: mostly clear; 15% heat wave, 10% downpour, 10% wind.
  const rollSummerWeather = () => { const r = Math.random(); return r < 0.15 ? 'heat' : r < 0.25 ? 'downpour' : r < 0.35 ? 'wind' : 'clear'; };
  // The round banner's second line: the place, plus the weather when it's snowing.
  const placeLine = () => place + (sky().label ? ' · ' + sky().label : '') + (dusk ? ' · Dusk' : '') + (squall ? ' · Eagles sheltering' : '');

  // The one place predators check whether they can see the trout. The eagle and the heron
  // only ever aim at what this returns, so invisibility hides the trout from both.
  // Tall grass hides the trout from the birds, like a weaker invisibility bubble (see updateEagle).
  const visibleTrout = () => (invisible > 0 || (tall.length && inTallGrass(fish.x, fish.y)) ? null : fish);

  // Before diving, the eagle circles the trout (for dive().circle seconds), spiralling in from 150 to 55 units.
  const EAGLE_CIRCLE = { from: 150, to: 55, spin: 3.2 };
  function eagleAim(lead) {
    // `lead` of the way from the trout to where it's heading: its landing spot mid-flop, or the
    // end of its slide.
    let tLeft = 1 / 7;
    if (fish.z > 0 || fish.vz > 0) tLeft = (fish.vz + Math.sqrt(fish.vz * fish.vz + 2 * GRAV * fish.z)) / GRAV;
    return { x: fish.x + fish.vx * tLeft * lead, y: fish.y + fish.vy * tLeft * lead };
  }
  function moveEagle(e, to, spd, dt) {
    const dx = to.x - e.x, dy = to.y - e.y, d = Math.hypot(dx, dy) || 1;
    const step = Math.min(spd * dt, d);
    e.x += dx / d * step; e.y += dy / d * step;
    return d;
  }
  function eagleLeave(e) {
    e.phase = 'leave'; e.t = 1;
    const a = rnd(0, Math.PI * 2); e.vx = Math.cos(a) * 600; e.vy = Math.sin(a) * 600;
  }
  // On the ground, or landed within the last 0.1 s: a buffered flop relaunches the trout in the
  // same frame it lands, and without the grace a player who keeps a flop queued is never seen
  // landing, so no eagle would ever dive.
  const LANDED_GRACE = 0.1;
  // Off-screen height to fly in from: past the world edge farther from the trout, so the eagle crosses the bank.
  const spawnY = margin => fish.y < WH / 2 ? WH + margin : -margin;
  const troutLanded = () => (fish.z === 0 && fish.vz === 0) || clock - fish.landedAt < LANDED_GRACE;
  // Drop a red ring at `aim` (blurred by the weather) and start the dive.
  // `quiet` skips the alarm and announcement, for the second ring of a pincer that drops with the first.
  function startDive(e, aim, quiet) {
    const err = sky().aimError;
    // If the trout is already mid-hop (a buffered flop relaunched it), the warning starts when it
    // lands, and the ring holds still until then, so the player always gets the full warning
    // from the moment they can next flop.
    const air = fish.z > 0 || fish.vz > 0;
    const tLand = air ? (fish.vz + Math.sqrt(fish.vz * fish.vz + 2 * GRAV * fish.z)) / GRAV : 0;
    e.phase = 'lock'; e.hold = tLand; e.t = e.lockDur = diveWarn() + tLand;
    e.tx = aim.x + rnd(-err, err); e.ty = aim.y + rnd(-err, err);
    if (!quiet) { tone(1200, 0.25, 'square', 0.04, 0.8); announce('Eagle diving!'); }
  }
  function updateEagle(e, dt) {
    if (e.phase === 'off' || mode !== 'play') return;
    if (e.boss) return; // the finale's birds are run by updateBoss
    if (e.kind === 'osprey') { updateOsprey(e, dt); return; }
    e.t -= dt;
    const sk = EAGLE, fast = eagleSpeedUp();
    // When the eagle can't see the trout it flies off, and doesn't return until it can.
    if (!visibleTrout()) {
      if (e.phase === 'track' || e.phase === 'circle' || (e.phase === 'lock' && invisible > 0)) eagleLeave(e); // grass doesn't call off a ring already down
      if (e.phase === 'idle' && e.t <= 0) e.t = 0.5;
    }
    const px = e.x, py = e.y;
    if (e.phase === 'idle' && e.t <= 0 && !e.team) {
      e.phase = 'track';
      e.x = fish.x + rnd(-200, 200); e.y = spawnY(80);
    } else if (e.phase === 'track') {
      // Close in only as far as the circling distance, then start circling from there, so the
      // shadow never passes over the trout before the dive.
      const dx = fish.x - e.x, dy = fish.y - e.y, d = Math.hypot(dx, dy) || 1;
      const step = Math.min(sk.speed * fast * dt, Math.max(0, d - EAGLE_CIRCLE.from));
      e.x += dx / d * step; e.y += dy / d * step;
      if (d - step <= EAGLE_CIRCLE.from + 1) {
        e.phase = 'circle'; e.t = e.circleDur = dive().circle + sky().circle;
        e.ang = Math.atan2(e.y - fish.y, e.x - fish.x);
        e.dir = Math.random() < 0.5 ? -1 : 1;
      }
    } else if (e.phase === 'circle') {
      // Circle the trout, spiralling in from EAGLE_CIRCLE.from to .to, then dive.
      const k = 1 - Math.max(0, e.t) / e.circleDur;
      const r = EAGLE_CIRCLE.from + (EAGLE_CIRCLE.to - EAGLE_CIRCLE.from) * k;
      e.ang += e.dir * EAGLE_CIRCLE.spin * fast * dt;
      const tx = fish.x + Math.cos(e.ang) * r, ty = fish.y + Math.sin(e.ang) * r;
      e.x += (tx - e.x) * Math.min(1, dt * 8);
      e.y += (ty - e.y) * Math.min(1, dt * 8);
      // Dive, but only once the trout is on the ground, so it can always flop away when the ring
      // appears; mid-hop, the eagle keeps circling until it lands.
      // (Paired eagles keep circling at the inner radius until their pair calls the dive.)
      if (!e.team && e.t <= 0 && troutLanded() && !ospreyBusy()) startDive(e, eagleAim(dive().lead));
    } else if (e.phase === 'lock') {
      // The ring drifts after the trout, slowly; the eagle's shadow swoops onto the ring.
      const dx = fish.x - e.tx, dy = fish.y - e.ty, d = Math.hypot(dx, dy) || 1;
      const step = e.hold > 0 ? 0 : Math.min(diveSteer() * dt, d);
      if (e.hold > 0) e.hold -= dt;
      e.tx += dx / d * step; e.ty += dy / d * step;
      e.x += (e.tx - e.x) * Math.min(1, dt * 14);
      e.y += (e.ty - e.y) * Math.min(1, dt * 14);
      if (e.t <= 0) {
        lastEagleEnd = clock; // an osprey waits a moment after any eagle strike
        if (Math.hypot(fish.x - e.tx, fish.y - e.ty) < dive().radius && fish.z < sk.reachZ) {
          e.x = e.tx; e.y = e.ty; e.phase = 'carry'; eagleCatcher = e; lose('eagle'); return;
        }
        eagleLeave(e);
      }
    } else if (e.phase === 'wait') {
      // A waiting pair circles high and wide, as faint shadows, until it's their turn.
      e.ang += 0.5 * dt;
      const tx = fish.x + Math.cos(e.ang) * 260, ty = fish.y + Math.sin(e.ang) * 260;
      e.x += (tx - e.x) * Math.min(1, dt * 1.5); e.y += (ty - e.y) * Math.min(1, dt * 1.5);
    } else if (e.phase === 'leave') {
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.t <= 0) { e.phase = 'idle'; const [r0, r1] = dive().rest; e.t = r0 + rnd(0, r1); }
    }
    // Turn the silhouette to face where it's flying (its head points up when unrotated).
    const mx = e.x - px, my = e.y - py;
    if (Math.hypot(mx, my) > 0.5 && Math.hypot(mx, my) < 150) {
      e.heading = (e.heading || 0) + angleDiff(Math.atan2(my, mx) + Math.PI / 2, e.heading || 0) * Math.min(1, dt * 10);
    }
  }

  // ---------- osprey (spring) ----------
  // From round 210 an osprey flies in, hovers over the trout (following it loosely), then drops a ring
  // at the hover point and plunges straight down once the warning ends. The ring is fixed: it never
  // drifts after the trout, so moving off it always escapes. The warning is OSPREY.warn / flopScale(),
  // so early spring is gentler. One osprey from 210, two from 270 (taking turns). Only one strike
  // warning is live at a time across every bird: an osprey waits for eagle rings and the other
  // osprey (and a short gap, OSPREY.gap), and the eagles wait for the osprey the same way.
  const OSPREY_FROM = 210, OSPREY_TWO = 270;
  const OSPREY = { speed: 340, hover: [1.0, 1.8], warn: 0.55, radius: 56, rest: [3, 4.5], gap: 0.6 };
  const ospreyCount = n => ((seasonOf(n) !== 'spring' && seasonOf(n) !== 'summer') || n < OSPREY_FROM ? 0 : n < OSPREY_TWO ? 1 : 2);
  let lastEagleEnd = -Infinity, lastOspreyEnd = -Infinity; // when the last ring of each kind ended
  const ospreyLive = () => eagles.some(o => o.kind === 'osprey' && o.phase === 'lock');
  const eagleLive = () => eagles.some(o => o.kind !== 'osprey' && o.phase === 'lock');
  const ospreyBusy = () => ospreyLive() || clock - lastOspreyEnd < OSPREY.gap;
  function updateOsprey(o, dt) {
    o.t -= dt;
    if (!visibleTrout() && (o.phase === 'track' || o.phase === 'hover' || (o.phase === 'lock' && invisible > 0))) eagleLeave(o);
    const px = o.x, py = o.y;
    if (o.phase === 'idle') {
      if (o.t <= 0 && visibleTrout()) { o.phase = 'track'; o.x = fish.x + rnd(-200, 200); o.y = spawnY(100); }
    } else if (o.phase === 'track') {
      if (moveEagle(o, fish, OSPREY.speed, dt) < 30) { o.phase = 'hover'; o.t = rnd(OSPREY.hover[0], OSPREY.hover[1]); }
    } else if (o.phase === 'hover') {
      o.x += (fish.x - o.x) * Math.min(1, dt * 2.5); o.y += (fish.y - o.y) * Math.min(1, dt * 2.5);
      if (o.t <= 0 && troutLanded() && !eagleLive() && !ospreyBusy() && clock - lastEagleEnd > OSPREY.gap) {
        o.phase = 'lock'; o.tx = o.x; o.ty = o.y; o.radius = OSPREY.radius;
        // If a buffered flop has the trout mid-hop, the warning starts when it lands (as for the eagles).
        const air = fish.z > 0 || fish.vz > 0;
        const tLand = air ? (fish.vz + Math.sqrt(fish.vz * fish.vz + 2 * GRAV * fish.z)) / GRAV : 0;
        o.t = o.lockDur = OSPREY.warn / flopScale() + tLand;
        tone(1500, 0.16, 'sine', 0.05, 0.7); announce('Osprey diving!');
      }
    } else if (o.phase === 'lock') {
      o.x += (o.tx - o.x) * Math.min(1, dt * 14); o.y += (o.ty - o.y) * Math.min(1, dt * 14);
      if (o.t <= 0) {
        lastOspreyEnd = clock;
        if (Math.hypot(fish.x - o.tx, fish.y - o.ty) < o.radius && fish.z < EAGLE.reachZ) {
          o.x = o.tx; o.y = o.ty; o.phase = 'carry'; eagleCatcher = o; lose('osprey'); return;
        }
        eagleLeave(o);
      }
    } else if (o.phase === 'leave') {
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.t <= 0) { o.phase = 'idle'; o.t = rnd(OSPREY.rest[0], OSPREY.rest[1]); }
    }
    const mx = o.x - px, my = o.y - py;
    if (Math.hypot(mx, my) > 0.5 && Math.hypot(mx, my) < 150) {
      o.heading = (o.heading || 0) + angleDiff(Math.atan2(my, mx) + Math.PI / 2, o.heading || 0) * Math.min(1, dt * 10);
    }
  }

  // ---------- eagle pairs (winter) ----------
  // Winter eagles hunt in pairs. A pair flies in, circles the trout on opposite sides, then dives as
  // a team, picking by coin flip:
  //   one-two  one eagle drops its ring; when that dive is over, its partner drops a ring where
  //            the trout has landed, so the trout has to dodge twice;
  //   pincer   both rings drop at once, either side of the trout's path, leaving the way forward
  //            or back open.
  // With two pairs they take turns; the other pair waits high above as faint shadows. Every ring
  // still waits for the trout to be on the ground, so each dive can be escaped.
  let teams = [], activeTeam = 0;
  function makeTeams() {
    teams = []; activeTeam = 0;
    const birds = eagles.filter(e => e.kind !== 'osprey'); // ospreys hunt alone
    if (birds.length < 2) return;
    for (let i = 0; i + 1 < birds.length; i += 2) {
      birds[i].team = birds[i + 1].team = true;
      teams.push({ a: birds[i], b: birds[i + 1], phase: 'rest', t: rnd(2.5, 4), tactic: '', synced: false });
    }
  }
  const huntingNow = e => e.phase === 'track' || e.phase === 'circle' || e.phase === 'lock';
  function updateTeams(dt) {
    if (!teams.length || mode !== 'play') return;
    teams.forEach((p, i) => {
      if (i === activeTeam) return;
      for (const e of [p.a, p.b]) {
        if (e.phase !== 'idle') continue;
        e.phase = 'wait'; e.ang = rnd(0, Math.PI * 2);
        e.x = fish.x + rnd(-300, 300); e.y = spawnY(120);
      }
    });
    const p = teams[activeTeam], { a, b } = p;
    const nextTeam = () => {
      p.phase = 'rest'; p.synced = false;
      const [r0, r1] = dive().rest; p.t = r0 + rnd(0, r1);
      activeTeam = (activeTeam + 1) % teams.length;
    };
    if (p.phase === 'rest') {
      p.t -= dt;
      if (p.t > 0 || !visibleTrout()) return;
      // Fly in from opposite sides (or swoop down from the waiting circle).
      for (const [e, side] of [[a, -1], [b, 1]]) {
        if (e.phase !== 'wait') { e.x = fish.x + side * rnd(150, 300); e.y = spawnY(80); }
        e.phase = 'track';
      }
      p.phase = 'hunt';
    } else if (p.phase === 'hunt') {
      if (!huntingNow(a) && !huntingNow(b)) { nextTeam(); return; } // they lost the trout
      if (a.phase !== 'circle' || b.phase !== 'circle') return;
      if (!p.synced) { b.ang = a.ang + Math.PI; b.dir = a.dir; b.t = a.t; b.circleDur = a.circleDur; p.synced = true; }
      if (a.t > 0 || !troutLanded() || ospreyBusy()) return;
      if (Math.random() < sky().abort) {
        eagleLeave(a); eagleLeave(b); announce('The eagles lost you in the storm.'); nextTeam(); return;
      }
      const aim = eagleAim(dive().lead);
      p.tactic = Math.random() < 0.5 ? 'pincer' : 'onetwo';
      if (p.tactic === 'pincer') {
        // Across the trout's heading, 0.9 ring-widths each side.
        const h = Math.hypot(fish.vx, fish.vy) > 5 ? Math.atan2(fish.vy, fish.vx) : rnd(0, Math.PI * 2);
        const off = dive().radius * 0.9, ox = -Math.sin(h) * off, oy = Math.cos(h) * off;
        startDive(a, { x: aim.x + ox, y: aim.y + oy });
        startDive(b, { x: aim.x - ox, y: aim.y - oy }, true);
      } else startDive(a, aim);
      p.phase = 'strike';
    } else if (p.phase === 'strike') {
      // One-two: once the first dive is over, the partner strikes where the trout has landed.
      if (p.tactic === 'onetwo' && b.phase === 'circle' && a.phase !== 'lock' && troutLanded() && visibleTrout() && !ospreyBusy()) {
        startDive(b, eagleAim(dive().lead));
      }
      if (!huntingNow(a) && !huntingNow(b)) nextTeam();
    }
  }

  // ---------- herons ----------
  // Great blue herons stand on fallen logs, one heron per log: none before round 10, then one
  // more every 10 rounds (1 in rounds 10–19, 2 in 20–29, … 9 in 90–99; none in winter). Each heron walks
  // along its log to keep level with the trout. When the trout comes within reach it draws its
  // neck back (the warning), then spears the spot it aimed at. Herons have the same skill every round.
  const HERON = { speed: 45, reach: 160, hit: 26, cock: 0.45, strike: 0.16, recover: 1.1, rest: 18 };
  // Herons fly south for the winter, so none from WINTER_FROM on.
  // In spring they come back from round 210: one, then another every 20 rounds, up to 5.
  const HERON_BACK = 210, ANGLERS_BACK = 205, CANOE_BACK = 240;
  const heronCount = n => {
    const s = seasonOf(n);
    if (s === 'finale') return 0;
    if (s === 'spring' || s === 'summer') return n < HERON_BACK ? 0 : Math.min(5, 1 + Math.floor((n - HERON_BACK) / 20));
    return n < 10 || s === 'winter' ? 0 : Math.floor(n / 10);
  };
  let herons = [], heronCatcher = null;
  const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
  const makeHeron = log => ({ log, x: log.x + log.w / 2, y: log.y + log.h / 2, angle: 0, state: 'wade', t: 0, tx: 0, ty: 0, neck: HERON.rest });
  // The stretch of a log a heron can walk along, and how close a point comes to that stretch.
  const logWalk = l => [l.y + 12, l.y + l.h - 12];
  function distToLog(l, x, y) {
    const [a, b] = logWalk(l);
    return Math.hypot(x - (l.x + l.w / 2), y - Math.max(a, Math.min(b, y)));
  }
  function updateHeron(h, dt) {
    if (mode !== 'play') {
      // Round over (splash, or caught by something else): stand down instead of freezing mid-strike.
      // The heron that made a catch holds its neck out through the dying animation instead.
      if (!(mode === 'dying' && deathBy === 'heron' && h === heronCatcher)) {
        h.state = 'wade';
        h.neck += (HERON.rest - h.neck) * Math.min(1, dt * 4);
      }
      return;
    }
    const prey = visibleTrout();
    if (h.state === 'wade') {
      // Walk along the log to stay level with the trout; with no trout in sight, stand still.
      if (prey) {
        const [a, b] = logWalk(h.log);
        const step = Math.max(-HERON.speed * dt, Math.min(HERON.speed * dt, prey.y - h.y));
        h.y = Math.max(a, Math.min(b, h.y + step));
      }
      const d = prey ? Math.hypot(prey.x - h.x, prey.y - h.y) : Infinity;
      const want = d < HERON.reach + 140 ? Math.atan2(prey.y - h.y, prey.x - h.x) : 0;
      h.angle += angleDiff(want, h.angle) * Math.min(1, dt * 4);
      h.neck += (HERON.rest - h.neck) * Math.min(1, dt * 6);
      if (d < HERON.reach && prey.z < 20) {
        h.state = 'cock'; h.t = HERON.cock;
        h.tx = prey.x; h.ty = prey.y; h.angle = want;
        tone(170, 0.3, 'sawtooth', 0.06, 0.7);
        announce('Heron striking!');
      }
    } else if (h.state === 'cock') {
      h.t -= dt;
      h.neck += (6 - h.neck) * Math.min(1, dt * 14);
      if (h.t <= 0) {
        h.state = 'strike'; h.t = HERON.strike;
        tone(950, 0.08, 'square', 0.05, 0.5);
        if (prey && Math.hypot(prey.x - h.tx, prey.y - h.ty) < HERON.hit && prey.z < 25) { heronCatcher = h; lose('heron'); }
      }
    } else if (h.state === 'strike') {
      h.t -= dt;
      h.neck += (heronStrikeNeck(h) - h.neck) * Math.min(1, dt * 30);
      if (h.t <= 0) { h.state = 'recover'; h.t = HERON.recover; }
    } else if (h.state === 'recover') {
      h.t -= dt;
      h.neck += (HERON.rest - h.neck) * Math.min(1, dt * 4);
      if (h.t <= 0) h.state = 'wade';
    }
  }
  const updateHerons = dt => { for (const h of herons) updateHeron(h, dt); };
  // Neck length that puts the bill tip (44 units past the neck) on the spot it aimed at.
  const heronStrikeNeck = h => Math.max(6, Math.hypot(h.tx - h.x, h.ty - h.y) - 44);

  // ---------- invisibility power-up ----------
  // From round 9 a shimmering river-mist bubble sits on the bank between the trout and the river.
  // Flopping into it hides the trout from the eagle and the heron for INVIS_TIME seconds.
  const INVIS_FROM = 9, INVIS_TIME = 6;
  const BUBBLE_R = 36, BUBBLE_GRAB = BUBBLE_R + 10; // drawn radius; trout picks it up within BUBBLE_GRAB
  let invisible = 0;
  const powerup = { active: false, x: 0, y: 0 };
  function updatePowerup(dt) {
    if (invisible > 0) {
      invisible = Math.max(0, invisible - dt);
      if (invisible === 0) { announce('Visible again.'); tone(520, 0.2, 'triangle', 0.06, 0.6); }
    }
    if (powerup.active && fish.z < 30 && Math.hypot(fish.x - powerup.x, fish.y - powerup.y) < BUBBLE_GRAB) {
      powerup.active = false; invisible = INVIS_TIME;
      burst(powerup.x, powerup.y, 24, '#e6f4ff', 180);
      [660, 880, 1175].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'sine', 0.08), i * 70));
      announce('Invisible for ' + INVIS_TIME + ' seconds.');
    }
  }

  // Falling snow in winter, in screen space. The weather sets how much falls: a storm and snowing
  // use fixed counts, and a clear round gets a few flurries that follow snowAt()'s snowfall
  // (heavier toward round 190, none by 199). With reduced motion the flakes hold still.
  function updateSnowfall(dt) {
    // Clear rounds get a few flurries; snowing fills the air; a storm drives it sideways.
    const base = !winter ? 0 : weather === 'storm' ? 420 : weather === 'snow' ? 220 : 40 * snowfall;
    const want = Math.min(480, Math.round(base * (W * H) / (412 * 915)));
    const storm = weather === 'storm';
    while (flakes.length < want) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(1, 2.8), vy: rnd(30, 70), ph: rnd(0, 6) });
    if (flakes.length > want) flakes.length = want;
    if (reduced) return;
    for (const f of flakes) {
      if (squall) { f.y += (f.vy * 2.2 + squall.vsy * 560) * dt; f.x += (Math.sin(clock * 0.8 + f.ph) * 14 + squall.vsx * 560) * dt; } // the snowstorm follows the gusts
      else { f.y += f.vy * (storm ? 2.2 : 1) * dt; f.x += (Math.sin(clock * 0.8 + f.ph) * 14 + (storm ? 260 : 0)) * dt; }
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      if (f.x < 0) f.x += W; else if (f.x > W) f.x -= W;
    }
  }
  function drawSnowfall() {
    if (!flakes.length) return;
    if (weather === 'storm') { // wind-driven streaks
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath();
      let sx = 11, sy = 5;
      if (squall) { const vx = squall.vsx * 560, vy = 110 + squall.vsy * 560, L = 13 / (Math.hypot(vx, vy) || 1); sx = vx * L; sy = vy * L; }
      for (const f of flakes) { ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - sx, f.y - sy); }
      ctx.stroke();
      return;
    }
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    for (const f of flakes) { ctx.moveTo(f.x + f.r, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); }
    ctx.fill();
  }

  // Spring rain, in screen space: slanting streaks, 200 in rain and 320 in a thunderstorm (scaled to
  // the screen, never more than 360). In a thunderstorm the sky flashes every few seconds: a quick
  // double flash, drawn under the red dive rings. With reduced motion the rain holds still and there
  // is no lightning.
  let drops = [];
  const lightning = { next: 4, glow: 0, echo: 0 };
  function updateRain(dt) {
    const base = weather === 'thunder' ? 320 : weather === 'downpour' ? 360 : weather === 'rain' ? 200 : 0;
    const want = Math.min(360, Math.round(base * (W * H) / (412 * 915)));
    while (drops.length < want) drops.push({ x: Math.random() * W, y: Math.random() * H, vy: rnd(620, 900), len: rnd(10, 18) });
    if (drops.length > want) drops.length = want;
    if (reduced) return;
    for (const d of drops) {
      if (squall) { d.y += (d.vy + squall.vsy * 500) * dt; d.x += (squall.vsx * 520 - d.vy * 0.16) * dt; } // the rain swings with the gusts
      else { d.y += d.vy * dt; d.x -= d.vy * 0.16 * dt; }
      if (d.y > H + 20) { d.y = -20; d.x = Math.random() * (W + 120); }
      if (d.x < -20) d.x += W + 40; else if (squall && d.x > W + 20) d.x -= W + 40;
    }
    if (weather !== 'thunder' || mode !== 'play') { lightning.glow = 0; return; }
    lightning.glow = Math.max(0, lightning.glow - dt * 5);
    if (lightning.echo > 0 && (lightning.echo -= dt) <= 0) lightning.glow = 0.7;
    if ((lightning.next -= dt) <= 0) { lightning.glow = 1; lightning.echo = 0.16; lightning.next = rnd(4, 9); }
  }
  function drawRain() {
    if (!drops.length) return;
    const storm = weather === 'thunder' || weather === 'downpour';
    ctx.strokeStyle = storm ? 'rgba(210,224,238,0.6)' : 'rgba(205,222,235,0.5)'; ctx.lineWidth = storm ? 1.5 : 1.2; ctx.lineCap = 'round';
    ctx.beginPath();
    for (const d of drops) {
      ctx.moveTo(d.x, d.y);
      if (squall) { const vx = squall.vsx * 520 - 122, vy = 760 + squall.vsy * 500, L = d.len / (Math.hypot(vx, vy) || 1); ctx.lineTo(d.x - vx * L, d.y - vy * L); }
      else ctx.lineTo(d.x + d.len * 0.16, d.y - d.len);
    }
    ctx.stroke();
  }
  // Windy rounds: leaves blow along the river in the gust's direction (screen space, at most 40).
  let gustLeaves = [];
  function updateGust(dt) {
    const want = windy() ? Math.min(40, Math.round(36 * (W * H) / (412 * 915))) : 0;
    while (gustLeaves.length < want) gustLeaves.push({ x: Math.random() * W, y: Math.random() * H, ph: rnd(0, 6), c: Math.random() < 0.5 ? '#5f8a3e' : '#8a7a4a' });
    if (gustLeaves.length > want) gustLeaves.length = want;
    if (reduced) return;
    const push = windDir * (50 + 260 * gustNow());
    for (const f of gustLeaves) {
      f.y += push * dt; f.x += Math.sin(clock * 2 + f.ph) * 25 * dt; f.ph += dt * 2;
      if (f.y > H + 10) f.y = -10; else if (f.y < -10) f.y = H + 10;
      if (f.x < -10) f.x = W + 10; else if (f.x > W + 10) f.x = -10;
    }
  }
  function drawGust() {
    for (const f of gustLeaves) { ctx.fillStyle = f.c; ctx.beginPath(); ctx.ellipse(f.x, f.y, 5, 2.4, f.ph, 0, 7); ctx.fill(); }
  }
  // A heat wave: a bright warm wash and a few slow bands of shimmer drifting up the screen.
  function drawHeat(sec) {
    if (weather !== 'heat' || mode === 'title') return;
    ctx.fillStyle = 'rgba(255,228,150,0.12)'; ctx.fillRect(0, 0, W, H);
    if (reduced) return;
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let i = 0; i < 6; i++) { const y = H - ((sec * 22 + i * H / 6) % (H + 60)) + 30; ctx.fillRect(0, y, W, 22 + 10 * Math.sin(sec * 1.3 + i)); }
  }
  function drawLightning() {
    if (lightning.glow <= 0.02 || weather !== 'thunder' || mode !== 'play') return; // never frozen behind the pause card
    ctx.fillStyle = 'rgba(236,242,255,' + (0.55 * lightning.glow * lightning.glow) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  function updateCanoe(dt) {
    // No paddling on a frozen river, nor on the spring flood until it clears (round 240).
    if (winter || season === 'summer' || season === 'finale' || (season === 'spring' && level < CANOE_BACK)) { canoe.active = false; return; } // summer has its own floaters
    if (!canoe.active) {
      canoe.t -= dt;
      if (canoe.t <= 0) {
        canoe.active = true; canoe.y = -90; canoe.off = rnd(-10, 10); canoe.vy = rnd(40, 55);
        canoe.color = CANOE_COLORS[Math.floor(Math.random() * CANOE_COLORS.length)];
      }
      return;
    }
    canoe.y += canoe.vy * dt;
    canoe.x = (farAt(canoe.y) + shoreAt(canoe.y)) / 2 + canoe.off;
    if (canoe.y > WH + 100) { canoe.active = false; canoe.t = rnd(9, 15); }
  }

  function update(dt) {
    clock += dt;
    if (mode === 'play' || mode === 'saved' || mode === 'dying') { // time played
      stats.ms += dt * 1000;
      if ((statsSaveT += dt) > 15) { statsSaveT = 0; saveStats(); }
    }
    // Banners only count down in play, so a bank built behind the start card still shows them.
    if (mode === 'play') {
      if (seasonTimer > 0) seasonTimer -= dt;
      else if (bannerTimer > 0) bannerTimer -= dt;
    }
    updateCanoe(dt);
    if (floaters.length) updateFloaters(dt);
    cam += (camTarget() - cam) * Math.min(1, dt * 5);

    if (mode === 'play') {
      fish.cooldown -= dt;
      fish.x += fish.vx * dt; fish.y += fish.vy * dt;
      if (windy() && (fish.z > 0 || fish.vz > 0)) fish.y += windDir * WIND_PUSH * gustNow() * dt; // gusts shove it sideways in the air
      if (fish.z > 0 || fish.vz > 0) {
        fish.vz -= GRAV * dt; fish.z += fish.vz * dt;
        if (fish.z <= 0) {
          fish.z = 0; fish.vz = 0; fish.landedAt = clock;
          burst(fish.x, fish.y, 6, '#b9cf8a', 110);
          tone(120, 0.08, 'sine', 0.12);
        }
      } else {
        const k = Math.max(0, 1 - (onIce() ? 1.8 : 7) * dt); // the trout slides much farther on ice
        fish.vx *= k; fish.vy *= k;
        if (Math.hypot(fish.vx, fish.vy) < 4) fish.vx = fish.vy = 0;
      }
      collide();
      runQueuedFlop(dt);

      if (troutMoved) moisture -= drainRate() * dt;
      const refill = sky().refill; // a downpour tops the trout up while it falls
      if (refill) moisture = Math.min(100, moisture + refill * dt);
      for (const s of springs) {
        if (fish.z === 0 && s.water > 0 && Math.hypot(fish.x - s.x, fish.y - s.y) < s.r + 4) {
          const take = Math.min(s.water, 45 * dt, 100 - moisture);
          s.water -= take; moisture += take;
          if (!reduced && Math.random() < 0.3) burst(fish.x, fish.y, 1, '#d6f1ee', 80);
        }
      }
      for (const p of puddles) { // landing in a puddle refreshes the trout, once per visit
        const inside = Math.hypot(fish.x - p.x, fish.y - p.y) < p.r;
        if (inside && fish.z === 0 && p.armed) {
          p.armed = false; moisture = Math.min(100, moisture + PUDDLE_GAIN);
          burst(fish.x, fish.y, 8, '#cfe4ee', 120); tone(520, 0.1, 'sine', 0.08, 0.5);
        } else if (!inside) p.armed = true;
      }
      if (floes.length) floeT += dt;
      updatePowerup(dt);
      if (troutMoved) { for (const e of eagles) updateEagle(e, dt); updateTeams(dt); }
      if (raccoon && troutMoved) updateRaccoon(raccoon, dt);
      if (boss && troutMoved) updateBoss(dt);
      if (squall && troutMoved) updateSquall(dt);
      updateHerons(dt);
      if (mode === 'play') {
        if (inRiver()) { if (floaters.length && floaterAt(fish.x, fish.y)) bumpFish(); else reachRiver(); }
        else if (moisture <= 0) lose('dry');
      }
      updateHud();
    } else if (mode === 'saved') {
      if (savedHole) {
        // Slip down into the ice hole.
        fish.z = 0; fish.vx = fish.vy = 0;
        fish.x += (savedHole.x - fish.x) * Math.min(1, dt * 8);
        fish.y += (savedHole.y - fish.y) * Math.min(1, dt * 8);
      } else {
        // Swim off downstream.
        const target = (farAt(fish.y) + shoreAt(fish.y)) / 2;
        fish.z = Math.max(0, fish.z - 300 * dt);
        fish.x += (target - fish.x) * Math.min(1, dt * 2);
        fish.y += 160 * dt;
        fish.angle += (Math.PI / 2 - fish.angle) * Math.min(1, dt * 4);
      }
      updateHerons(dt);
      fish.alpha = Math.max(0, stateTimer / 1.4);
      stateTimer -= dt;
      if (stateTimer <= 0) {
        if (season === 'finale') startEnding();
        else {
          level++; makeLevel(level); mode = 'play'; updateHud();
          announce((seasonName ? seasonName + '. ' : '') + 'Round ' + level + ', ' + placeLine() + '.');
        }
      }
    } else if (mode === 'ending') {
      endScene.t += dt;
      for (let i = 0; i < 3; i++) if (!endScene.sq[i] && endScene.t > 3.2 + i * 0.6 && !reduced) { endScene.sq[i] = 1; tone(1900 - i * 150, 0.1, 'square', 0.04, 0.4); } // the eaglets complain
      if (endScene.t >= endLength()) showEndCard();
    } else if (mode === 'dying') {
      updateHerons(dt);
      if ((deathBy === 'eagle' || deathBy === 'osprey' || deathBy === 'great') && eagleCatcher) { fish.lift += dt * 1.5; eagleCatcher.y -= 260 * dt; fish.y -= 260 * dt; }
      if (deathBy === 'heron' && heronCatcher) {
        // Held up in the heron's bill.
        const h = heronCatcher;
        h.neck = heronStrikeNeck(h);
        const reach = 44 + h.neck;
        fish.x += (h.x + Math.cos(h.angle) * reach - fish.x) * Math.min(1, dt * 10);
        fish.y += (h.y + Math.sin(h.angle) * reach - fish.y) * Math.min(1, dt * 10);
        fish.lift = Math.min(0.3, fish.lift + dt);
      }
      stateTimer -= dt;
      if (stateTimer <= 0) showOver();
    }

    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const r of ripples) { r.age += dt; r.y += (winter ? 0 : 50) * dt; } // still water in an ice hole
    updateSnowfall(dt);
    updateRain(dt);
    updateGust(dt);
    updateFlies(dt);
    if (bossFlash > 0) bossFlash = Math.max(0, bossFlash - dt * 1.6);
    ripples = ripples.filter(r => r.age < 1.4);
  }

  // ---------- draw ----------
  const hex = c => c.match(/\w\w/g).map(h => parseInt(h, 16));
  function mix(c1, c2, k) {
    const a = hex(c1), b = hex(c2);
    return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',') + ')';
  }

  // Autumn grass, winter's dead brown grass, or spring's mud greening over.
  const groundColor = () => (winter ? '#a2946a' : season === 'spring' ? springGround : season === 'summer' ? '#668f42' : season === 'finale' ? bossGround : '#7c9c52');
  const onScreen = (x, pad) => x > cam - pad && x < cam + view.w + pad;
  const snowColor = a => 'rgba(246,249,251,' + a + ')';
  const SNOW = snowColor(0.92);
  function drawGround(sec) {
    ctx.fillStyle = groundColor(); ctx.fillRect(-2000, -2000, WW + 4000, WH + 4000);
    // mown-grass stripes (autumn only)
    if (season === 'autumn') {
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      for (let y = -200; y < WH + 200; y += 60) ctx.fillRect(-2000, y, WW + 4000, 30);
    }
    drawMud();
    drawGrass(sec);
    drawFlowers();
    drawPuddles(sec);
    drawShade();
    for (const p of tall) { // the ground under tall grass is darker and damper
      if (!onScreen(p.x, p.rx + 6)) continue;
      ctx.fillStyle = 'rgba(28,66,22,0.3)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, 7); ctx.fill();
    }
    for (const l of leaves) {
      if (!onScreen(l.x, 20)) continue; // only the leaves on screen
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.a);
      ctx.fillStyle = l.c; ctx.beginPath(); ctx.ellipse(0, 0, 6, 3.5, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    if (coldNow() && cover > 0) drawGroundSnow(sec);
    else if (drifts.length) drawDrifts(); // spring's last patches of snow
  }

  // Summer shade: a dark, soft patch under each shade tree (the canopy itself is drawn over the trout, see
  // drawShadeCanopies), so players can see where the cool ground is.
  function drawShade() {
    for (const t of shadeTrees) {
      const R = t.r * 1.2;
      if (!onScreen(t.x, R + 6)) continue;
      const g = ctx.createRadialGradient(t.x, t.y, R * 0.2, t.x, t.y, R);
      g.addColorStop(0, 'rgba(14,32,12,0.5)'); g.addColorStop(0.75, 'rgba(14,32,12,0.4)'); g.addColorStop(1, 'rgba(14,32,12,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(t.x, t.y, R, 0, 7); ctx.fill();
    }
  }
  function drawShadeCanopies() {
    if (!shadeTrees.length) return;
    ctx.globalAlpha = 0.6; // see-through, so the trout under a tree stays visible
    for (const t of shadeTrees) {
      if (!onScreen(t.x, t.r * 1.4 + 6)) continue;
      const sp = shadePool[t.pool], k = t.r / sp.r;
      ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.rot); ctx.scale(t.flip * k, k);
      ctx.drawImage(sp.canvas, -sp.side / 2, -sp.side / 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  // Mud: dark wet-brown patches with a faint sheen. Puddles: still, shallow water with a slow ripple.
  function drawMud() {
    for (const m of mud) {
      if (!onScreen(m.x, m.rx + 6)) continue;
      ctx.fillStyle = 'rgba(78,56,34,0.5)'; ctx.beginPath(); ctx.ellipse(m.x, m.y, m.rx, m.ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(52,36,22,0.45)'; ctx.beginPath(); ctx.ellipse(m.x, m.y, m.rx * 0.72, m.ry * 0.7, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.ellipse(m.x - m.rx * 0.2, m.y - m.ry * 0.25, m.rx * 0.3, m.ry * 0.16, 0, 0, 7); ctx.fill();
    }
  }
  function drawPuddles(sec) {
    for (const p of puddles) {
      if (!onScreen(p.x, p.r + 6)) continue;
      ctx.fillStyle = 'rgba(96,126,146,0.8)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(176,202,218,0.55)'; ctx.beginPath(); ctx.arc(p.x - p.r * 0.15, p.y - p.r * 0.15, p.r * 0.72, 0, 7); ctx.fill();
      const k = reduced ? 0.4 : (sec * 0.7 + p.x * 0.013) % 1;
      ctx.strokeStyle = 'rgba(255,255,255,' + 0.55 * (1 - k) + ')'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3 + k * p.r * 0.6, 0, 7); ctx.stroke();
    }
  }

  // Spring wildflowers, small enough to cost a few calls each: bluebells (a nodding spray of blue
  // bells on a curved stem), trillium (three white petals over a yellow heart) and dandelions.
  function drawFlowers() {
    for (const f of flowers) {
      if (!onScreen(f.x, 14)) continue;
      if (f.kind === 'bluebell') {
        ctx.strokeStyle = '#4f7a34'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.quadraticCurveTo(f.x + 1, f.y - 8, f.x + 5, f.y - 11); ctx.stroke();
        ctx.fillStyle = '#6f80d8';
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(f.x + 2 + k * 1.6, f.y - 8 - k * 1.2, 2.1, 0, 7); ctx.fill(); }
      } else if (f.kind === 'trillium') {
        ctx.fillStyle = '#4f7a34';
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(f.x, f.y, 6, 2.8, f.a + k * 2.094 + 1.05, 0, 7); ctx.fill(); }
        ctx.fillStyle = '#fbf8f2';
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(f.x, f.y, 5, 2.6, f.a + k * 2.094, 0, 7); ctx.fill(); }
        ctx.fillStyle = '#e6c54a'; ctx.beginPath(); ctx.arc(f.x, f.y, 1.5, 0, 7); ctx.fill();
      } else if (f.kind === 'susan') { // black-eyed Susan: yellow petals round a dark brown eye
        ctx.fillStyle = '#f2b81c';
        for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.ellipse(f.x + Math.cos(f.a + k * 1.047) * 3.6, f.y + Math.sin(f.a + k * 1.047) * 3.6, 3.2, 1.5, f.a + k * 1.047, 0, 7); ctx.fill(); }
        ctx.fillStyle = '#3d2a1a'; ctx.beginPath(); ctx.arc(f.x, f.y, 2.2, 0, 7); ctx.fill();
      } else if (f.kind === 'coneflower') { // purple coneflower: drooping pink-purple petals, a rusty cone
        ctx.fillStyle = '#c45f9e';
        for (let k = 0; k < 7; k++) { ctx.beginPath(); ctx.ellipse(f.x + Math.cos(f.a + k * 0.898) * 4.2, f.y + Math.sin(f.a + k * 0.898) * 4.2, 3.6, 1.3, f.a + k * 0.898, 0, 7); ctx.fill(); }
        ctx.fillStyle = '#8a4a22'; ctx.beginPath(); ctx.arc(f.x, f.y, 2.4, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = '#f0c419'; ctx.beginPath(); ctx.arc(f.x, f.y, 3.6, 0, 7); ctx.fill();
        ctx.fillStyle = '#f9e06a'; ctx.beginPath(); ctx.arc(f.x - 0.6, f.y - 0.6, 1.9, 0, 7); ctx.fill();
      }
    }
  }

  // A 96-unit tile of fine snow grain (white and blue-grey specks), denser as coverage grows.
  // Made once per round and repeated across the ground, so the texture costs one fill per frame.
  function makeSnowGrain() {
    const c = document.createElement('canvas');
    c.width = c.height = 96;
    const g = c.getContext('2d');
    const specks = Math.round(60 + 220 * cover);
    for (let i = 0; i < specks; i++) {
      g.fillStyle = Math.random() < 0.35 ? 'rgba(170,190,212,0.7)' : 'rgba(255,255,255,0.85)';
      g.fillRect(Math.random() * 96, Math.random() * 96, 1.5, 1.5);
    }
    return ctx.createPattern(c, 'repeat');
  }

  // Winter ground snow: a white blanket that's absent at 10% coverage and solid at 100%; crisp,
  // rounded drifts with a blue-grey shadow, white body and bright crest (shadows and crests grow
  // with depth, so full-cover snow still shows its ridges); fine grain; and a few twinkling glints.
  // A drift's rounded outline: 12 wobbly points joined by smooth curves, offset by (dx, dy).
  function blobPath(d, grow, dx, dy) {
    const N = 12, pts = [];
    for (let k = 0; k < N; k++) {
      const a = k / N * Math.PI * 2;
      const wob = 1 + 0.12 * Math.sin(a * 3 + d.a * 7) + 0.05 * Math.sin(a * 5 + d.x);
      const px = Math.cos(a) * d.rx * grow * wob, py = Math.sin(a) * d.ry * grow * wob;
      pts.push([d.x + px * Math.cos(d.a) - py * Math.sin(d.a) + dx, d.y + px * Math.sin(d.a) + py * Math.cos(d.a) + dy]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const path = new Path2D();
    let m = mid(pts[N - 1], pts[0]); path.moveTo(m[0], m[1]);
    for (let k = 0; k < N; k++) { m = mid(pts[k], pts[(k + 1) % N]); path.quadraticCurveTo(pts[k][0], pts[k][1], m[0], m[1]); }
    path.closePath();
    return path;
  }
  // Each drift's three outlines are built once per round (snow depth is fixed within a round).
  function buildDriftPaths(d) {
    const lift = 2 + 5 * snow;
    d.shadow = blobPath(d, 1, lift, lift * 1.2);
    d.body = blobPath(d, 1, 0, 0);
    d.crest = blobPath(d, 0.6 + 0.1 * snow, -lift * 0.5, -lift * 0.6);
  }
  const shownDrifts = []; // reused each frame

  function drawGroundSnow(sec) {

  // Tall prairie grass: long, dense, swaying blades, drawn over the trout (a little see-through) so a trout

  // ---------- the finale: The Eagle's Nest ----------
  // Round 400 is one boss fight in a short, wide arena under a giant cottonwood whose crown holds a big
  // stick nest with two eaglets. The Great Eagle hunts the trout with the usual dive: a ring drops on
  // it, then the eagle strikes. When its dive lands with the ring over a lure (a boulder, stump or log),
  // it slams into it and is stunned and loses a feather; three feathers beat it. Each lure changes the
  // arena: autumn (the Watch), then winter (the Pair), then the storm. Being caught restarts the whole
  // fight. The river stays shut until the Great Eagle is beaten.
  const BOSS_PHASE = [null,

    { look: 'snow', name: 'Winter', title: 'The Pair', warn: 0.9, steer: 0, circle: 2.8, rest: 4.5, radius: 92, mate: true, harrier: false },
    { look: 'storm', name: 'The Storm', title: '', warn: 0.85, steer: 90, circle: 2.4, rest: 4.0, radius: 90, mate: false, harrier: true }
  ];

    for (const l of logs) {

      const cx = Math.max(l.x, Math.min(x, l.x + l.w)), cy = Math.max(l.y, Math.min(y, l.y + l.h));

  function setupFinale() {
    boulders = []; logs = []; springs = []; herons = []; heronCatcher = null; anglers = []; floaters = []; floes = []; mud = []; puddles = [];
    tall = []; tallBlades = {}; bars = []; shadeTrees = []; shadePool = []; raccoon = null; powerup.active = false; invisible = 0;
    teams = []; eagleCatcher = null;

    const x0 = river.base + 150, x1 = TREES - 30, cw = (x1 - x0) / 5, ch = (BOTTOM - TOP - 40) / 3;
    for (let i = 0; i < 5; i++) for (let j = 0; j < 3; j++) {

        const cx = x0 + (i + 0.5) * cw + rnd(-cw * 0.15, cw * 0.15), cy = TOP + 20 + (j + 0.5) * ch + rnd(-ch * 0.15, ch * 0.15), t = (i * 3 + j) % 4;

        } else {

      const ok = Math.hypot(x - fish.x, y - fish.y) > r + 80 && boulders.every(b => Math.hypot(x - b.x, y - b.y) > r + b.r + 24) &&
        springs.every(s => Math.hypot(x - s.x, y - s.y) > r + s.r + 20) &&
        logs.every(l => x + r < l.x - 20 || x - r > l.x + l.w + 20 || y + r < l.y - 20 || y - r > l.y + l.h + 20);

    boss = { feathers: 3, phase: 1, beaten: false, anger: 0, squabble: 0, blockT: 0, hintT: 0, hinted: false, squawkT: rnd(4, 8), nest,
      great: bird('great', 'perch'), mate: bird('mate', 'idle'), harrier: bird('harrier', 'idle') };

  // The arena's look for a phase: ground, grass, leaves, snow and trees (and the weather) are rebuilt.
  function buildFinaleScenery(look) {
    bossLook = look;
    const snowy = look === 'snow', stormy = look === 'storm';
    fall = snowy ? 1 : stormy ? 0.55 : 0.8;
    cover = snowy ? 1 : 0; snow = snowy ? 0.7 : 0; snowfall = 0;
    bossGround = snowy ? '#a2946a' : stormy ? '#5f7a46' : '#7c9c52';
    const LEAFS = snowy ? ['#7a6448', '#6a553c', '#8a7255'] : LEAF_COLORS;
    leaves = Array.from({ length: Math.round(70 * WW / 600 * (snowy ? 0.15 : stormy ? 0.8 : 0.5)) }, () => {
      const y = rnd(-100, WH + 100);
      return { x: rnd(shoreAt(y) + 14, WW + 300), y, a: rnd(0, 6), c: pickOne(LEAFS) };
    });
    const GREENS = ['#4a7530', '#3f6a2a', '#5a8a38', '#9cbd5c'], STRAWS = ['#c2a654', '#d4b862', '#a88c3e'];
    const DEADS = ['#7a6a44', '#8a7a50', '#6a5a3a'], DEEPS = ['#3c6a2a', '#32602a', '#477a30', '#6a9a3e'];
    grass = {};
    const tufts = Math.round(WW / 600 * 520 * (snowy ? 0.12 : 1));
    for (let i = 0; i < tufts; i++) {
      const y = rnd(-60, WH + 60), x = rnd(shoreAt(y) + 12, WW + 300), straw = look === 'autumn' && Math.random() < 0.55;
      for (let b = 3 + Math.floor(Math.random() * 4); b > 0; b--) {
        const c = pickOne(snowy ? DEADS : stormy ? DEEPS : straw ? STRAWS : GREENS);
        (grass[c] = grass[c] || []).push({ x: x + rnd(-3, 3), y: y + rnd(-2, 2), a: rnd(-0.55, 0.55), len: rnd(9, 17) * (snowy ? 0.45 : 1) });
      }
    }
    for (const c in grass) grass[c].sort((p, q) => p.x - q.x);
    drifts = snowy ? Array.from({ length: Math.round(WW / 600 * 44) }, () => {
      const y = rnd(-100, WH + 100);
      return { x: rnd(shoreAt(y) + 10, WW + 300), y, rx: rnd(26, 60) * 1.8, ry: rnd(16, 34) * 1.8, a: rnd(0, 3) };
    }) : [];

  }
  // The cottonwood's crown as one sprite (bare in the winter phase).
  function buildCrown() {
    const r = 140, side = Math.ceil(r * 2.7), c = document.createElement('canvas');
    c.width = c.height = side;
    const g = c.getContext('2d');
    g.translate(side / 2, side / 2);
    const t = makeTree(0, 0, r, 0, true);
    (t.bare ? paintBareTree : paintTree)(g, t);

  }
  function updateFeathers() {
    const n = boss ? boss.feathers : -1;
    if (n === shownFeathers) return;
    shownFeathers = n;
    ui.feathers.hidden = n < 0;
    if (n < 0) return;
    let html = '';
    for (let i = 0; i < 3; i++) html += '<svg viewBox="0 0 24 24" class="' + (i < n ? 'on' : 'off') + '"><path d="M21 3C11 3 5 9 5 17l-2 4 3.4-1.6C15 19 21 14 21 3z"/></svg>';

  function faceMove(e, px, py, dt) {
