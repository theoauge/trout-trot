      for (let i = 0; i < 16; i++) { const x = (i * 71 + 30) % W, y = ((move ? sec * 70 : 0) + i * 97) % (H + 80) - 40; ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(i) * 6, y + 56); }
      ctx.stroke();
      ctx.fillStyle = 'rgba(8,34,30,0.4)'; // shade from the willows overhead
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse((i * 137 + 60) % W, ((move ? sec * 18 : 0) + i * 210) % (H + 300) - 150, 130, 85, 0, 0, 7); ctx.fill(); }
      const q = clamp01((t - cut) / (L - cut));
      drawFishAt(W / 2 + (move ? Math.sin(sec * 1.8) * 16 : 0), H * 0.78 - q * H * 0.28, 2.1, -Math.PI / 2 + (move ? Math.sin(sec * 1.8) * 0.12 : 0));
      if (!card && k2 > 0.5) screenCaption('Upstream, the water is cool and shaded.', H * 0.86, 22 * fs); // one caption at a time during the crossfade
    }
    ctx.globalAlpha = 1;
  }

  // ---------- storm rounds: gusts, whiteouts, lightning ----------
  function updateSquall(dt) {
    const Q = squall, sev = Q.sev, peak = 240 + 140 * sev; // peak push, units/s (summer's wind is 110)
    // --- gusts: calm, then a 1 s warning, then 1.6 s of gust
    Q.st -= dt;
    if (Q.state === 'calm' && Q.st <= 0) {
      const d = GUST_DIRS[Math.floor(Math.random() * GUST_DIRS.length)];
      Q.nx = d[0]; Q.ny = d[1]; Q.state = 'warn'; Q.st = 1.0;
      tone(190, 0.8, 'sawtooth', 0.035, 0.55); // the whoosh
    } else if (Q.state === 'warn' && Q.st <= 0) { Q.state = 'gust'; Q.st = 1.6; Q.wx = Q.nx; Q.wy = Q.ny; }
    else if (Q.state === 'gust' && Q.st <= 0) { Q.state = 'calm'; Q.st = rnd(3.4, 5.2) - 1.7 * sev; }
    const prog = Q.state === 'gust' ? 1 - Q.st / 1.6 : 0;
    Q.env = Q.state === 'gust' ? clamp01(Math.min(prog / 0.15, (1 - prog) / 0.3)) : 0;
    // what the weather shows: the wind vector the rain, snow and grass follow, easing toward the next gust's
    // direction during the warning, then the gust, then back to nothing
    const tx = Q.state === 'warn' ? Q.nx * (0.35 + 0.65 * (1 - Q.st)) : Q.state === 'gust' ? Q.wx * (0.6 + 0.4 * Q.env) : 0;
    const ty = Q.state === 'warn' ? Q.ny * (0.35 + 0.65 * (1 - Q.st)) : Q.state === 'gust' ? Q.wy * (0.6 + 0.4 * Q.env) : 0;
    const k = Math.min(1, dt * 5);
    Q.vx += (tx - Q.vx) * k; Q.vy += (ty - Q.vy) * k;
    Q.vsx = flip ? -Q.vx : Q.vx; Q.vsy = Q.vy;
    // --- what a gust does to the trout
    if (Q.env > 0) {
      if (fish.z > 0 || fish.vz > 0) { // in the air: shoved
        fish.x += Q.wx * peak * Q.env * dt; fish.y += Q.wy * peak * Q.env * dt;
      } else if (onIce()) { // on winter ice: pushed along the ground, so it slides
        const acc = (150 + 90 * sev) * Q.env;
        fish.vx += Q.wx * acc * dt; fish.vy += Q.wy * acc * dt;
      }
      fish.x = Math.min(fish.x, TREES - FR); fish.y = Math.max(TOP, Math.min(fish.y, BOTTOM)); // never out of bounds
    }
    // --- snowstorm: whiteout surges
    if (Q.ice) {
      Q.whiteT -= dt;
      if (Q.whiteT <= 0) { Q.whiteAge = 0; Q.whiteT = rnd(10, 15) - 4 * sev; }
      Q.whiteAge += dt;
      const a = Q.whiteAge; // rise 0.7 s, hold 1.0 s, fall 1.3 s
      Q.whiteEnv = a < 0.7 ? a / 0.7 : a < 1.7 ? 1 : a < 3.0 ? 1 - (a - 1.7) / 1.3 : 0;
    }
    // --- thunderstorm: lightning strikes with a warning ring
    if (!Q.ice) {
      const S = Q.strike;
      if (S.bolt > 0) S.bolt -= dt;
      if (S.phase === 'idle') {
        S.next -= dt;
        if (S.next <= 0 && troutLanded()) { // like every ring in the game: only once the trout is on the ground
          const aim = eagleAim(0.3);
          const air = fish.z > 0 || fish.vz > 0;
          const tLand = air ? (fish.vz + Math.sqrt(fish.vz * fish.vz + 2 * GRAV * fish.z)) / GRAV : 0;
          S.tx = aim.x; S.ty = aim.y; S.hold = tLand; S.phase = 'warn'; S.t = S.lockDur = 1.0 - 0.1 * sev + tLand;
          tone(1500, 0.18, 'triangle', 0.04, 0.7); announce('Lightning!');
        }
      } else {
        S.t -= dt;
        if (S.t <= 0) { // the strike
          S.phase = 'idle'; S.next = Math.max(2.5, rnd(5.5, 8) - 3 * sev); S.bolt = 0.3;
          lightning.glow = 1; lightning.echo = 0.14;
          burst(S.tx, S.ty, 14, '#fff3a8', 260); tone(70, 0.6, 'sawtooth', 0.08, 0.5);
          if (Math.hypot(fish.x - S.tx, fish.y - S.ty) < STRIKE_R && fish.z < EAGLE.reachZ) lose('lightning');
        }
      }
    }
  }
  // The lightning warning ring (yellow-white with a dark underlay, unlike the red bird rings) and the bolt itself.
  function drawStrike() {
    if (!squall || squall.ice || mode !== 'play') return;
    const S = squall.strike;
    ctx.save(); worldTransform();
    if (S.phase === 'warn') {
      const k = Math.min(1, 1 - S.t / S.lockDur);
      ctx.fillStyle = 'rgba(255,244,150,' + (0.1 + 0.14 * k) + ')'; ctx.beginPath(); ctx.arc(S.tx, S.ty, STRIKE_R, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(30,38,80,0.55)'; ctx.lineWidth = 6; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(S.tx, S.ty, STRIKE_R, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,232,90,' + (0.55 + 0.4 * k) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(S.tx, S.ty, STRIKE_R, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
    if (S.bolt > 0) { // a jagged bolt from the sky to where the strike landed
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const [w, c] of [[9, 'rgba(255,244,170,0.55)'], [3, '#ffffff']]) {
        ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(S.tx + 30, S.ty - 520);
        for (let i = 1; i <= 10; i++) ctx.lineTo(S.tx + 30 - i * 3 + Math.sin(i * 2.7 + S.tx) * 22 * (1 - i / 11), S.ty - 520 + i * 52);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---------- dusk and the raccoon ----------
  // A dusk round is dark and warm, with a short sight around the trout and fireflies blinking over the grass
  // (none with reduced motion). The raccoon walks in from the far end of the bank, straight toward the
  // trout, at RACCOON.speed (a good deal slower than a full flop), slower still in tall grass. It cannot go
  // into the river, and it catches a trout it reaches on the ground. A trout that keeps flopping to the
  // water gets away; the invisibility bubble stops it in its tracks.
  const RACCOON = { speed: 170, catchR: 26 };
  function updateRaccoon(r, dt) {
    if (!r.active) {
      r.t -= dt;
      if (r.t > 0) return;
      r.active = true; r.x = Math.max(edgeAt(fish.y) + 40, Math.min(TREES - 10, fish.x + rnd(-40, 40)));
      r.y = fish.y < WH / 2 ? BOTTOM + 30 : TOP - 30; // from whichever end of the bank is farther away
      tone(1700, 0.12, 'square', 0.05, 0.5); tone(2300, 0.1, 'square', 0.04, 0.5); announce('A raccoon!');
      return;
    }
    if (invisible > 0) return;
    const dx = fish.x - r.x, dy = fish.y - r.y, d = Math.hypot(dx, dy) || 1;
    const step = Math.min(d, RACCOON.speed * (inTallGrass(r.x, r.y) ? 0.55 : 1) * dt);
    r.x += dx / d * step; r.y += dy / d * step; r.step += step;
    r.x = Math.max(edgeAt(r.y) + 14, Math.min(TREES - 10, r.x)); // not into the river, not out of the bank
    if (Math.hypot(fish.x - r.x, fish.y - r.y) < RACCOON.catchR && fish.z < 12) lose('raccoon');
  }
  function drawRaccoon() {
    const r = raccoon;
    if (!r || !r.active) return;
    const ang = Math.atan2(fish.y - r.y, fish.x - r.x), bob = Math.sin(r.step * 0.25) * 1.5;
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(ang);
    ctx.fillStyle = '#5b5750'; ctx.beginPath(); ctx.ellipse(-3, 0, 15, 8.5 + bob * 0.2, 0, 0, 7); ctx.fill(); // body
    ctx.fillStyle = '#3a3733'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(-2, s * 8, 4.5, 2.4 + bob * 0.1, 0, 0, 7); ctx.fill(); } // legs
    for (let k = 0; k < 4; k++) { ctx.fillStyle = k % 2 ? '#2e2c29' : '#8b867b'; ctx.beginPath(); ctx.ellipse(-18 - k * 4.5, 0, 4.2, 4, 0, 0, 7); ctx.fill(); } // ringed tail
    ctx.fillStyle = '#6a665e'; ctx.beginPath(); ctx.ellipse(11, 0, 7, 6, 0, 0, 7); ctx.fill(); // head
    ctx.fillStyle = '#1f1e1c'; ctx.beginPath(); ctx.ellipse(12, 0, 4, 5.2, 0, 0, 7); ctx.fill(); // the mask
    ctx.fillStyle = '#6a665e'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(8, s * 5.5, 2.2, 0, 7); ctx.fill(); } // ears
    ctx.restore();
  }
  // Eyeshine: two yellow-green glints, drawn above the dusk so the raccoon is always findable.
  function drawRaccoonEyes(sec) {
    const r = raccoon;
    if (!r || !r.active || mode === 'title') return;
    const ang = Math.atan2(fish.y - r.y, fish.x - r.x), ex = r.x + Math.cos(ang) * 17, ey = r.y + Math.sin(ang) * 17;
    const px = -Math.sin(ang) * 3.2, py = Math.cos(ang) * 3.2, a = reduced ? 0.9 : 0.65 + 0.35 * Math.sin(sec * 7);
    for (const s of [-1, 1]) {
      ctx.fillStyle = 'rgba(210,255,120,' + 0.25 * a + ')'; ctx.beginPath(); ctx.arc(ex + px * s, ey + py * s, 6, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(235,255,150,' + a + ')'; ctx.beginPath(); ctx.arc(ex + px * s, ey + py * s, 2, 0, 7); ctx.fill();
    }
  }
  function updateFlies(dt) {
    const want = dusk && !reduced ? Math.min(40, Math.round(30 * (W * H) / (412 * 915))) : 0;
    while (flies.length < want) flies.push({ x: Math.random() * W, y: Math.random() * H, ph: rnd(0, 6), sp: rnd(0.6, 1.4) });
    if (flies.length > want) flies.length = want;
    for (const f of flies) {
      f.x += Math.sin(clock * 0.7 * f.sp + f.ph) * 14 * dt; f.y += Math.cos(clock * 0.5 * f.sp + f.ph * 2) * 10 * dt;
      if (f.x < -10) f.x = W + 10; else if (f.x > W + 10) f.x = -10;
      if (f.y < -10) f.y = H + 10; else if (f.y > H + 10) f.y = -10;
    }
  }
  function drawDusk() {
    if (!dusk || mode === 'title') return;
    ctx.fillStyle = 'rgba(255,150,70,0.09)'; ctx.fillRect(0, 0, W, H); // warm, low light
    const p = toScreen(fish.x, fish.y), r = 340 * view.s;
    const g = ctx.createRadialGradient(p.x, p.y, r * 0.3, p.x, p.y, r);
    g.addColorStop(0, 'rgba(14,10,38,0.25)'); g.addColorStop(1, 'rgba(14,10,38,0.82)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const f of flies) {
      const a = Math.pow(Math.max(0, Math.sin(clock * 1.7 * f.sp + f.ph)), 3);
      if (a < 0.05) continue;
      ctx.fillStyle = 'rgba(220,255,120,' + 0.22 * a + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(245,255,170,' + a + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, 1.8, 0, 7); ctx.fill();
    }
  }

  // A few dragonflies darting along the water's edge in summer: a thin body and four glassy wings.
  function drawDragonflies(sec) {
    if (reduced) return;
    for (let i = 0; i < 5; i++) {
      const y = (((sec * 0.2 + i * 0.37) % 1) * (WH + 200)) - 100 + Math.sin(sec * 3 + i) * 10;
      const x = shoreAt(y) - 14 - (i % 3) * 22 - 18 * Math.abs(Math.sin(sec * 2.3 + i));
      if (!onScreen(x, 20)) continue;
      ctx.strokeStyle = i % 2 ? '#2d7fb3' : '#3a9a5a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6); ctx.stroke();
      ctx.fillStyle = 'rgba(232,246,250,' + (0.45 + 0.25 * Math.sin(sec * 40 + i)) + ')';
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(x + s * 5, y - 2.5, 5, 1.6, s * 0.25, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + s * 4, y + 0.5, 4, 1.4, s * 0.2, 0, 7); ctx.fill();
      }
    }
  }

  // Ice floes drifting down the near bank (rounds 200–215): pale slabs with a shadow on the water.
  // Their footprint is the same ellipse the game uses to decide whether the trout is standing on one.
  function drawFloes(sec) {
    for (const f of floes) {
      const y = floeY(f), x = floeX(f, y);
      if (!onScreen(x, f.rx + 12)) continue;
      const bob = reduced ? 0 : Math.sin(sec * 1.2 + f.seed) * 1.5;
      ctx.fillStyle = 'rgba(16,44,52,0.28)'; ctx.beginPath(); ctx.ellipse(x + 4, y + 5, f.rx, f.ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#d4e4eb'; ctx.beginPath(); ctx.ellipse(x, y + bob, f.rx, f.ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#f0f6f9'; ctx.beginPath(); ctx.ellipse(x - f.rx * 0.1, y + bob - f.ry * 0.1, f.rx * 0.76, f.ry * 0.78, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(140,172,188,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x, y + bob, f.rx, f.ry, 0, 0, 7); ctx.stroke();
    }
  }

  // Frozen river: snow-dusted ice with cracks, and ice-fishing holes, the only way back in.
  function drawIce(sec) {
    const icePath = () => {
      ctx.beginPath();
      ctx.moveTo(farAt(-400), -400);
      for (let y = -400; y <= WH + 400; y += 10) ctx.lineTo(farAt(y), y);
      for (let y = WH + 400; y >= -400; y -= 10) ctx.lineTo(shoreAt(y), y);
      ctx.closePath();
    };
    icePath();
    const g = ctx.createLinearGradient(river.far, 0, river.base + 30, 0);
    g.addColorStop(0, '#b5cfd9'); g.addColorStop(1, '#dbe9ef');
    ctx.fillStyle = g; ctx.fill();
    if (cover > 0) { icePath(); ctx.fillStyle = snowColor(0.7 * cover); ctx.fill(); }
    // Cracks, stored as a fraction of the way across the ice so they follow the banks.
    ctx.strokeStyle = 'rgba(110,150,170,0.5)'; ctx.lineWidth = 1.2;
    for (const c of cracks) {
      ctx.beginPath();
      c.forEach(([lane, y], i) => { const fx = farAt(y), x = fx + (shoreAt(y) - fx) * lane; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
    }
    for (const p of pebbles) {
      ctx.fillStyle = shadeHex(p.c, '#f4f7fa', 0.3 + 0.6 * cover);
      ctx.beginPath(); ctx.arc(shoreAt(p.y) + p.dx, p.y, p.r, 0, 7); ctx.fill();
    }
    for (const h of holes) {
      ctx.fillStyle = '#eef5f8';
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r + 6, h.r + 4, 0, 0, 7); ctx.fill();
      const w = ctx.createRadialGradient(h.x - 4, h.y - 4, 2, h.x, h.y, h.r);
      w.addColorStop(0, '#2a6a72'); w.addColorStop(1, '#0f3640');
      ctx.fillStyle = w; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.85, 0, 0, 7); ctx.fill();
      if (!reduced) {
        const k = (sec * 0.6 + h.seed) % 1;
        ctx.strokeStyle = 'rgba(220,240,245,' + 0.5 * (1 - k) + ')'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r * k, h.r * 0.85 * k, 0, 0, 7); ctx.stroke();
      }
    }
  }

  // Ice fisher from above: seated on an overturned bucket in a parka and knit hat, jigging a
  // short rod into the hole, with a tip-up flag on the other side.
  function drawIceFisher(h, sec) {
    const bx = h.x - 32, by = h.y + 4, fx = h.x + 28, fy = h.y - 12;
    const wave = reduced ? 0 : Math.sin(sec * 4 + h.seed) * 2;
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fx, fy + 8); ctx.lineTo(fx, fy - 8); ctx.stroke();
    ctx.fillStyle = '#e8622c';
    ctx.beginPath(); ctx.moveTo(fx, fy - 8); ctx.lineTo(fx + 12, fy - 5 + wave); ctx.lineTo(fx, fy - 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(40,60,70,0.22)'; ctx.beginPath(); ctx.ellipse(bx + 4, by + 5, 15, 12, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#d9dde0'; ctx.beginPath(); ctx.arc(bx, by, 11, 0, 7); ctx.fill();
    ctx.fillStyle = h.coat; ctx.beginPath(); ctx.ellipse(bx, by, 10, 12, 0, 0, 7); ctx.fill();
    const jig = reduced ? 0 : Math.sin(sec * 2.2 + h.seed) * 1.5;
    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx + 7, by - 2); ctx.lineTo(h.x - 12, h.y - 4 + jig); ctx.stroke();
    ctx.strokeStyle = 'rgba(240,240,240,0.9)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(h.x - 12, h.y - 4 + jig); ctx.lineTo(h.x - 4, h.y); ctx.stroke();
    ctx.fillStyle = '#e8c040'; ctx.beginPath(); ctx.arc(bx, by, 6.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#f7f7f2'; ctx.beginPath(); ctx.arc(bx - 2, by - 2, 2.5, 0, 7); ctx.fill();
  }

  // Limestone bluff across the river: ledges step back from the water, cedars cling to the rim.
  // In winter the ledges whiten as snow builds up.
  function drawBluff() {
    const edge = off => { ctx.beginPath(); for (let y = -400; y <= WH + 400; y += 10) ctx.lineTo(farAt(y) + off, y); };
    const snowy = c => (winter ? shadeHex(c, '#eef2f4', 0.2 + 0.65 * cover) : c);
    ctx.beginPath(); ctx.moveTo(-2000, -400);
    for (let y = -400; y <= WH + 400; y += 10) ctx.lineTo(farAt(y), y);
    ctx.lineTo(-2000, WH + 400); ctx.closePath();
    ctx.fillStyle = snowy('#b9b09b'); ctx.fill();
    const bands = [['#d6cdb8', 10, -6], ['#a59b86', 4, -14], ['#cbc2ac', 9, -22], ['#9a907b', 3, -31], ['#c4bba5', 8, -40]];
    for (const [c, w, off] of bands) { edge(off); ctx.strokeStyle = snowy(c); ctx.lineWidth = w; ctx.stroke(); }
    edge(9); ctx.strokeStyle = 'rgba(10,30,30,0.22)'; ctx.lineWidth = 14; ctx.stroke();
    for (const t of talus) { ctx.fillStyle = t.c; ctx.beginPath(); ctx.arc(farAt(t.y) + t.dx, t.y, t.r, 0, 7); ctx.fill(); }
    ctx.strokeStyle = 'rgba(90,80,65,0.45)'; ctx.lineWidth = 1.5;
    for (let y = -380; y < WH + 400; y += 47) {
      const x = farAt(y);
      ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x - 18, y + 6); ctx.lineTo(x - 30, y + 3); ctx.stroke();
    }
    for (const c of cedars) {
      const x = farAt(c.y) + c.dx - 30;
      ctx.fillStyle = 'rgba(30,40,20,0.3)'; ctx.beginPath(); ctx.arc(x + 5, c.y + 6, c.r, 0, 7); ctx.fill();
      ctx.fillStyle = c.c; ctx.beginPath(); ctx.arc(x, c.y, c.r, 0, 7); ctx.fill();
      if (coldNow() && snow > 0.05) { ctx.fillStyle = SNOW; ctx.beginPath(); ctx.arc(x - c.r * 0.25, c.y - c.r * 0.25, c.r * (0.3 + 0.45 * snow), 0, 7); ctx.fill(); }
    }
  }

  // Fly angler in waders, seen from above: wide-brim hat, vest, rod and a chartreuse fly line.
  function drawAngler(a, sec) {
    ctx.save();
    ctx.translate(a.x, a.y);
    if (!reduced) {
      for (const k of [0, 0.5]) {
        const r = (sec * 0.5 + k + a.seed) % 1;
        ctx.strokeStyle = 'rgba(230,245,240,' + 0.5 * (1 - r) + ')'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, 13 + r * 16, 0, 7); ctx.stroke();
      }
    }
    ctx.rotate(a.facing);
    const sw = reduced ? 0 : Math.sin(sec * 1.6 + a.seed);
    const rodA = 0.35 * sw, tx = 8 + Math.cos(rodA) * 34, ty = 8 + Math.sin(rodA) * 34;
    ctx.strokeStyle = '#e4dc5c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + 26, ty - 22 * Math.cos(sec * 1.6 + a.seed), tx + 46 + 10 * sw, ty + 18 * Math.sin(sec * 0.8 + a.seed));
    ctx.stroke();
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = 'rgba(15,40,40,0.25)'; ctx.beginPath(); ctx.ellipse(3, 3, 11, 16, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#55603f'; ctx.beginPath(); ctx.ellipse(0, 0, 10, 15, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#b59f6a'; ctx.beginPath(); ctx.ellipse(-1, 0, 7, 11, 0, 0, 7); ctx.fill();

    for (const [t, off] of SPOTS) {
      const i = Math.min(N, Math.round(t * N)), p = spine[i];
      ctx.beginPath(); ctx.arc(L / 2 - t * L, p.y + off * p.w, 1.3, 0, 7); ctx.fill();
    }
    const head = spine[1];
    for (const sgn of [-1, 1]) {
      const ex = head.x - 1, ey = head.y + sgn * (head.w - 1);
      ctx.fillStyle = '#f1efe6'; ctx.beginPath(); ctx.arc(ex, ey, 2.6, 0, 7); ctx.fill();
      if (dead) {
        ctx.strokeStyle = '#1f2b22'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(ex - 1.8, ey - 1.8); ctx.lineTo(ex + 1.8, ey + 1.8); ctx.moveTo(ex + 1.8, ey - 1.8); ctx.lineTo(ex - 1.8, ey + 1.8); ctx.stroke();
      } else { ctx.fillStyle = '#1f2b22'; ctx.beginPath(); ctx.arc(ex + 0.4, ey, 1.4, 0, 7); ctx.fill(); }
    }
  }

  function drawFish() {
    const dry = 1 - Math.max(0, moisture) / 100;
    const dead = mode === 'dying' || mode === 'over';
    const z = fish.z + fish.lift * 120;
    ctx.save();
    // Invisible: see-through. In the last 1.5 seconds it flickers as a warning, or with
    // reduced motion turned on, steps up to a steady, less see-through look instead.
    const ending = invisible > 0 && invisible < 1.5;
    const ghost = invisible <= 0 ? 1 : !ending ? 0.3 : reduced ? 0.55 : Math.floor(clock * 8) % 2 ? 0.75 : 0.3;
    ctx.globalAlpha = fish.alpha * ghost;
    // shadow on the ground
    ctx.fillStyle = 'rgba(25,35,15,' + (0.3 - Math.min(0.2, z / 300)) + ')';
    // Clamp: once the eagle lifts the trout high, these radii would go negative, which canvas rejects.
    ctx.beginPath(); ctx.ellipse(fish.x + 3, fish.y + 4, Math.max(2, 24 - z / 10), Math.max(1, 10 - z / 25), fish.angle, 0, 7); ctx.fill();
    ctx.translate(fish.x, fish.y - z * 0.45);
    const sc = 1 + z / 160;
    ctx.scale(sc, sc);
    ctx.rotate(fish.angle);
    drawTrout(dry, dead);
    ctx.restore();
    if (mode === 'play' && moisture < 40 && !reduced) {
      const k = (clock * 1.5) % 1;
      ctx.fillStyle = 'rgba(150,215,225,' + (1 - k) + ')';
      ctx.beginPath(); ctx.arc(fish.x + 14, fish.y - 18 + k * 12, 3, 0, 7); ctx.fill();
    }
  }

  // Great blue heron from above: grey-blue body and folded wings, pale neck, white head with a
  // black crest plume, and a long yellow bill. A dashed ring shows its reach as the trout nears;
  // it turns red, with a small ring on the aimed spot, while the heron is about to strike.
  function drawHeron(h) {
    const near = Math.hypot(fish.x - h.x, fish.y - h.y);
    const cocked = h.state === 'cock' && mode === 'play';
    ctx.save();
    ctx.translate(h.x, h.y);
    if (mode === 'play' && visibleTrout() && (cocked || near < HERON.reach + 90)) {
      const k = cocked ? 1 : Math.min(1, 1 - (near - HERON.reach) / 90);
      ctx.strokeStyle = cocked ? 'rgba(200,65,47,0.85)' : 'rgba(250,249,243,' + 0.55 * k + ')';
      ctx.lineWidth = 2.5; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.arc(0, 0, HERON.reach, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = 'rgba(25,35,15,0.25)';
    ctx.beginPath(); ctx.ellipse(7, 9, 26, 14, h.angle, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(h.angle);
    const hx = 14 + h.neck;
    ctx.fillStyle = '#5d6e82';
    ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-37, -6); ctx.lineTo(-37, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7f91a5';
    ctx.beginPath(); ctx.ellipse(-4, 0, 24, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#62748a';
    ctx.beginPath(); ctx.ellipse(-8, -6, 19, 7, -0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-8, 6, 19, 7, 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#a9b6c4'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.quadraticCurveTo(14 + h.neck * 0.5, cocked ? 7 : 3, hx, 0); ctx.stroke();
    ctx.fillStyle = '#e2a43a';
    ctx.beginPath(); ctx.moveTo(hx + 4, -2.6); ctx.lineTo(hx + 30, 0); ctx.lineTo(hx + 4, 2.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f1f3f5';
    ctx.beginPath(); ctx.ellipse(hx, 0, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1f2b22'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx - 1, -2.5); ctx.lineTo(hx - 15, -5); ctx.stroke();
    ctx.fillStyle = '#e8c040';
    ctx.beginPath(); ctx.arc(hx + 2, -2.6, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (cocked) {
      ctx.strokeStyle = 'rgba(200,65,47,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(h.tx, h.ty, HERON.hit, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Invisibility bubble: a bobbing, shimmering ball of river mist with sparkles circling it.
  function drawPowerup() {
    if (!powerup.active) return;
    const r = BUBBLE_R, x = powerup.x, y = powerup.y + (reduced ? 0 : Math.sin(clock * 3) * 4);
    ctx.fillStyle = 'rgba(25,35,15,0.2)';
    ctx.beginPath(); ctx.ellipse(powerup.x + 6, powerup.y + 24, 32, 12, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(x - 12, y - 14, 4, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.45, 'rgba(190,225,240,0.6)'); g.addColorStop(1, 'rgba(150,200,230,0.2)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    const a = reduced ? 0 : clock * 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath(); ctx.arc(x, y, r * 0.55, a, a + 2.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r * 0.3, a + 3, a + 4.8); ctx.stroke();
    for (let i = 0; i < 3 && !reduced; i++) {
      const t = (clock * 0.8 + i / 3) % 1, ang = i * 2.1 + clock, d = r + 8 + t * 16;
      ctx.fillStyle = 'rgba(255,255,255,' + (1 - t) + ')';
      ctx.beginPath(); ctx.arc(x + Math.cos(ang) * d, y + Math.sin(ang) * d, 2.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  // The red ring marks exactly where a dive will strike; leave it to escape.
  function drawEagleRing(e) {
    if (e.phase !== 'lock' || mode !== 'play') return;
    const k = Math.min(1, 1 - e.t / (e.lockDur || 0.75));
    // A pale underlay first, so the red ring reads on green grass, snow and haze alike.
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 6;
    ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.arc(e.tx, e.ty, e.radius || dive().radius, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,65,47,' + (0.4 + 0.5 * k) + ')'; ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.arc(e.tx, e.ty, e.radius || dive().radius, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  // The osprey, from above: a pale bird with long narrow wings, dark wingtips and a dark eye stripe,
  // over a soft shadow. It rides a little higher (larger shadow offset) while it hovers.
  function drawOsprey(o) {
    const locking = o.phase === 'lock';
    const k = locking ? Math.min(1, 1 - o.t / (o.lockDur || 0.55)) : 0;
    const sc = (o.radius || OSPREY.radius) / 50 * (o.phase === 'carry' ? 1.05 : 1.15 - k * 0.3);
    drawEagleRing(o);
    const wings = () => {
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.quadraticCurveTo(7, -9, 46, -11); ctx.lineTo(50, -4); ctx.quadraticCurveTo(14, 3, 8, 10);
      ctx.lineTo(10, 26); ctx.lineTo(0, 22); ctx.lineTo(-10, 26); ctx.lineTo(-8, 10);
      ctx.quadraticCurveTo(-14, 3, -50, -4); ctx.lineTo(-46, -11); ctx.quadraticCurveTo(-7, -9, 0, -20);
    };
    const lift = o.phase === 'hover' ? 16 : 6;
    ctx.save();
    ctx.globalAlpha = o.phase === 'carry' ? 1 : 0.62; // see-through while it hovers, so the trout stays visible beneath it
    ctx.translate(o.x + lift * 0.5, o.y + lift); ctx.rotate(o.heading || 0); ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(15,22,12,0.22)'; wings(); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = o.phase === 'carry' ? 1 : 0.62;
    ctx.translate(o.x, o.y); ctx.rotate(o.heading || 0); ctx.scale(sc, sc);
    ctx.fillStyle = '#f4f1ea'; wings(); ctx.fill();
    ctx.fillStyle = '#4a4035'; // dark wingtips and wrist patches
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * 40, -10); ctx.lineTo(s * 50, -4); ctx.lineTo(s * 44, -11); ctx.lineTo(s * 46, -11); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s * 24, -6, 5, 2.4, s * 0.15, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#d9d2c2'; ctx.beginPath(); ctx.arc(0, -13, 6.5, 0, 7); ctx.fill(); // head
    ctx.fillStyle = '#2c241c'; ctx.fillRect(-7, -14.2, 14, 2.6); // the dark stripe through the eye
    ctx.restore();
  }
  // Snow and storms: a white haze beyond `sight` units of the trout, painted over the scene.
  function drawHaze() {
    const s = sky();
    if (!s.haze || mode === 'title') return;
    if (s.dim) { ctx.fillStyle = 'rgba(30,40,55,' + s.dim + ')'; ctx.fillRect(0, 0, W, H); } // a darker sky
    const p = toScreen(fish.x, fish.y), r = s.sight * view.s * (1 - 0.5 * stormWhite()), tint = s.tint || '236,241,245'; // a whiteout closes the sight in
    const g = ctx.createRadialGradient(p.x, p.y, r * 0.45, p.x, p.y, r);
    g.addColorStop(0, 'rgba(' + tint + ',0)'); g.addColorStop(1, 'rgba(' + tint + ',' + Math.min(1, s.haze + 0.05 * stormWhite()) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function worldTransform() {
    ctx.translate(0, view.oy); ctx.scale(view.s, view.s);
    if (flip) { ctx.translate(cam + view.w, 0); ctx.scale(-1, 1); } else ctx.translate(-cam, 0);
  }
  function drawEagle(e) {
    if (e.phase === 'off' || e.phase === 'idle' || e.phase === 'perch') return;
    if (e.kind === 'osprey' || e.kind === 'harrier') { drawOsprey(e); return; }
    if (e.kind === 'great') { drawGreat(e); return; }
    const locking = e.phase === 'lock';
    const k = locking ? Math.min(1, 1 - e.t / (e.lockDur || 0.75)) : 0;
    // Size the silhouette (wingtips at ±60 when unscaled) so the wingtips land exactly on the
    // strike ring at the moment it hits: whatever the wings cover then is what gets caught.
    const fit = (e.radius || dive().radius) / 60;
    const sc = fit * (e.phase === 'carry' ? 1.1 : 1.5 - k * 0.5);
    drawEagleRing(e);
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.heading || 0);
    ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(15,22,12,' + (e.phase === 'wait' ? 0.12 : 0.28 + k * 0.25) + ')';
    // wingspan silhouette, head toward the top
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.quadraticCurveTo(14, -6, 54, -4); ctx.lineTo(60, 4); ctx.lineTo(48, 2); ctx.lineTo(52, 9); ctx.lineTo(38, 5);
    ctx.quadraticCurveTo(14, 8, 9, 14); ctx.lineTo(13, 28); ctx.lineTo(0, 24); ctx.lineTo(-13, 28); ctx.lineTo(-9, 14);
    ctx.quadraticCurveTo(-14, 8, -38, 5); ctx.lineTo(-52, 9); ctx.lineTo(-48, 2); ctx.lineTo(-60, 4); ctx.lineTo(-54, -4);
    ctx.quadraticCurveTo(-14, -6, 0, -22);
    ctx.fill();
    ctx.restore();
  }

  function drawAim() {
    if (!ptr || !canFlop()) return;
    const dx = (ptr.x - ptr.x0) * (flip ? -1 : 1), dy = ptr.y - ptr.y0, dist = Math.hypot(dx, dy);
    if (dist < 14) return;
    const mag = swipeMag(dist) * flopScale(), air = 2 * 360 / GRAV, reach = mag * air;
    const ux = dx / dist, uy = dy / dist;
    ctx.fillStyle = 'rgba(250,249,243,0.85)';
    for (let i = 1; i <= 10; i++) {
      const d = reach * i / 10;
      ctx.beginPath(); ctx.arc(fish.x + ux * d, fish.y + uy * d, 3.2, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(250,249,243,0.9)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(fish.x + ux * reach, fish.y + uy * reach, 10, 0, 7); ctx.stroke();
  }

  // A caption wrapped to the screen: words are measured with the real font and broken into lines that fit
  // inside the canvas width with side padding (and the text shrinks if one word alone would not fit).
  function screenCaption(text, y, size) {
    const maxW = W - 2 * Math.max(24, W * 0.08);
    let s = size, lines;
    for (let tries = 0; tries < 8; tries++) {
      ctx.font = '700 ' + s + 'px Fredoka, "Arial Rounded MT Bold", sans-serif';
      lines = []; let cur = '', tooWide = false;
      for (const word of text.split(' ')) {
        const next = cur ? cur + ' ' + word : word;
        if (ctx.measureText(next).width <= maxW || !cur) { cur = next; if (ctx.measureText(cur).width > maxW) tooWide = true; } else { lines.push(cur); cur = word; }
      }
      lines.push(cur);
      if (!tooWide) break;
      s *= 0.9;
    }
    lines.forEach((ln, i) => screenText(ln, W / 2, y + i * s * 1.3, s));
  }
  function screenText(text, x, y, size, fill = '#faf9f3') {
    ctx.font = '700 ' + size + 'px Fredoka, "Arial Rounded MT Bold", sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = Math.max(3, size / 7); ctx.strokeStyle = '#1f2b22'; ctx.fillStyle = fill;
    ctx.strokeText(text, x, y); ctx.fillText(text, x, y);
  }

  function draw(now) {
    const sec = now / 1000;
    if (mode === 'ending' || mode === 'endcard') { drawEnding(sec); return; }
    ctx.fillStyle = groundColor(); ctx.fillRect(0, 0, W, H);
    ctx.save();
    worldTransform();
    drawGround(sec);
    drawRiver(sec);
    drawBluff();
    for (const a of anglers) drawAngler(a, sec);
    for (const h of holes) drawIceFisher(h, sec);
    if (canoe.active) drawCanoe(sec);
    // Splash rings spreading out and drifting with the current.
    for (const r of ripples) {
      for (const lag of [0, 0.22, 0.44]) {
        const a = r.age - lag;
        if (a <= 0) continue;
        ctx.strokeStyle = 'rgba(235,248,245,' + Math.max(0, 0.7 * (1 - a / 1)) + ')'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, 8 + a * 70, 6 + a * 52, 0, 0, 7); ctx.stroke();
      }
    }
    for (const s of springs) drawSpring(s);
    for (const l of logs) { drawLog(l); if (l.used) drawCracks(l.x + l.w / 2, l.y + l.h / 2, 24); }
    for (const b of boulders) drawBoulder(b);
    drawLureZones();
    drawPowerup();
    if (mode !== 'title') drawFish();
    for (const h of herons) drawHeron(h);
    drawRaccoon();
    drawTrees();
    drawTall(sec);
    drawShadeCanopies();
    drawNest(sec);
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2.5));
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawAim();
    for (const e of eagles) drawEagle(e);
    ctx.restore();

    drawHaze();
    drawHeat(sec);
    drawBossFlash();
    drawDusk();
    if (raccoon && raccoon.active && mode !== 'title') { ctx.save(); worldTransform(); drawRaccoonEyes(sec); ctx.restore(); }
    drawLightning();
    drawRain(); // under the rings, so nothing crosses a strike warning
    drawGust();
    drawStrike();
    // Dive rings go back on top of the haze: the weather never hides a strike.
    if (sky().haze) { ctx.save(); worldTransform(); for (const e of eagles) drawEagleRing(e); ctx.restore(); }
    drawSnowfall();

    // Text stays unmirrored, in screen space.
    const fs = Math.max(0.7, view.s);
    // While the river is off screen, a tag on that edge points to it with the distance in feet.
    if (mode === 'play' && edgeAt(fish.y) < cam) {
      // In winter it points to the nearest ice-fishing hole instead.
      const hole = winter ? holes.reduce((b, h) => (!b || Math.hypot(h.x - fish.x, h.y - fish.y) < Math.hypot(b.x - fish.x, b.y - fish.y) ? h : b), null) : null;
      const away = hole ? Math.hypot(hole.x - fish.x, hole.y - fish.y) : fish.x - edgeAt(fish.y);
      const feet = Math.max(1, Math.round(away / 43)), name = hole ? 'Ice hole' : 'River';
      const closed = boss && !boss.beaten;
      const label = closed ? (flip ? 'River closed ▶' : '◀ River closed') : flip ? name + ' ' + feet + ' ft ▶' : '◀ ' + name + ' ' + feet + ' ft';
      ctx.font = '800 ' + Math.round(15 * fs) + 'px Nunito, system-ui, sans-serif';
      const tw = ctx.measureText(label).width + 22, th = 30 * fs;
      const tx = flip ? W - 12 - tw : 12;
      const ty = Math.max(70, Math.min(H - th - 12, view.oy + fish.y * view.s - th / 2));
      ctx.fillStyle = 'rgba(44,111,116,0.92)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(tx, ty, tw, th, th / 2); else ctx.rect(tx, ty, tw, th);
      ctx.fill();
      ctx.fillStyle = '#faf9f3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, tx + tw / 2, ty + th / 2 + 1);
      ctx.textBaseline = 'alphabetic';
    }
    drawBossTexts(fs);
    if (mode === 'play' && seasonTimer > 0) {
      // Fade in over 0.4 s, hold, fade out over the last 0.5 s, in sugar-maple orange.
      ctx.globalAlpha = Math.max(0, Math.min(1, seasonTimer / 0.5, (SEASON_TIME - seasonTimer) / 0.4));
      screenText(seasonName, W / 2, view.oy + 250 * view.s, (seasonName.length > 9 ? 40 : 64) * fs, season === 'finale' ? (bossLook === 'snow' ? '#d6ecf7' : bossLook === 'storm' ? '#b8c4ff' : '#f0a03a') : season === 'summer' ? '#f2c14e' : season === 'spring' ? '#a4e26c' : winter ? '#d6ecf7' : '#f0a03a');
      ctx.globalAlpha = 1;
    } else if (mode === 'play' && bannerTimer > 0) {
      ctx.globalAlpha = Math.min(1, bannerTimer);
      screenText('Round ' + level, W / 2, view.oy + 240 * view.s, 44 * fs);
      const pl = placeLine(); // a long line (the storm banners) shrinks to fit
      screenText(pl, W / 2, view.oy + 240 * view.s + 34 * fs, 22 * fs * Math.min(1, 32 / pl.length));
      ctx.globalAlpha = 1;
    }
    if (mode === 'play' && hintOn && level === 1) {
      const p = toScreen((shoreAt(fish.y) + fish.x) / 2, fish.y - 70);
      screenText('← Swipe toward the river', p.x, p.y, 22 * fs);
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    // Schedule the next frame first, so one bad frame can't freeze the game.
    requestAnimationFrame(frame);
    // A frame's timestamp can be a little earlier than the time recorded at start-up or on resume;
    // never let the game clock step backward (negative sizes would follow, which canvas rejects).
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000));
    last = now;
    if (mode !== 'paused') update(dt);
    draw(now);
  }
  function boot() {
    resize();
    level = savedRound;
    makeLevel(level); // the bank behind the start card is the round they'll play
    layoutReady = true;
    restartBtn.hidden = savedRound <= 1;
    addEventListener('resize', resize);
    requestAnimationFrame(frame);
    try { $('startBtn').focus({ preventScroll: true }); } catch (e) {}
  }
  boot();
})();
</script>
