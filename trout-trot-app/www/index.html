<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7c9c52">
<style>
  /* App shell: matches the page skeleton the game was designed in. */
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Trout Trot</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* One-screen top-down river bank: world scaled to fit, river down one side, slim HUD on top, centered cards for start / pause / game over. Single autumn-daylight look by design. */
:root {
  --grass: #7c9c52;
  --river: #2c6f74;
  --trout: #e3798c;
  --leaf: #d9822b;
  --ink: #1f2b22;
  --muted: #55634f;
  --card: rgba(250, 249, 243, 0.95);
  --line: rgba(31, 43, 34, 0.15);
  --danger: #c8412f;
  --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--grass);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { touch-action: manipulation; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

.hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(rgba(250, 249, 243, 0.85), rgba(250, 249, 243, 0));
  pointer-events: none;
}
.stat { display: grid; }
.label { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.value { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.meter { display: grid; gap: 4px; min-width: 0; max-width: 260px; justify-self: center; width: 100%; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; }
.meter .row .label { white-space: nowrap; }
.label.power { color: var(--river); }
.bar { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.7); border: 2px solid rgba(31, 43, 34, 0.25); overflow: hidden; }
.fill { height: 100%; width: 100%; background: linear-gradient(90deg, #6fb3ad, var(--river)); border-radius: 999px; }
.meter.low .fill { background: var(--danger); animation: blink 0.5s steps(2) infinite; }
.meter.low .label:first-child { color: var(--danger); }
@keyframes blink { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .meter.low .fill { animation: none; } }
.icon-btn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--line); background: rgba(255, 255, 255, 0.8); color: var(--ink);
  font: 700 14px var(--body); cursor: pointer; display: grid; place-items: center;
}
.icon-btn:focus-visible, .play:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* Cards center when they fit and scroll when the screen is too short (small phones, landscape). */
.overlay {
  position: fixed; inset: 0; display: flex;
  overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: rgba(31, 43, 34, 0.25);
}
.card {
  margin: auto; flex-shrink: 0; box-sizing: border-box; /* padding inside the width, so it fits the screen */
  width: min(370px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center;
  padding: 26px 22px 24px; background: var(--card); border: 2px solid var(--line); border-radius: 24px;
  box-shadow: 0 18px 50px rgba(31, 43, 34, 0.3);
}
.card h1, .card h2 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 0.95; text-wrap: balance; color: var(--ink); }
.card h1 { font-size: 46px; }
.card h1 span { color: var(--trout); }
.card h2 { font-size: 34px; }
.card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 32ch; }
/* Start card: title, the two controls as tiles, and the start button. Nothing else. */
.controls { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.control {
  display: grid; gap: 2px; align-content: start; min-width: 0; text-align: left;
  padding: 10px 12px; border-radius: 14px; background: rgba(44, 111, 116, 0.09);
}
.control b { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.1; color: var(--river); }
.control span { font-size: 13px; line-height: 1.35; color: var(--muted); }
.card .over-round { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--ink); }
.play {
  margin-top: 4px; min-width: 180px; padding: 13px 28px; border: 0; border-radius: 999px;
  background: var(--trout); color: #3a0d16; font: 700 22px var(--display); cursor: pointer;
  box-shadow: 0 5px 0 #b45468;
}
.play:active { transform: translateY(3px); box-shadow: 0 2px 0 #b45468; }
/* Pause menu: jump to any round. */
.goto { width: 100%; display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); text-align: left; }
.goto-row { display: flex; gap: 8px; }
.goto input {
  flex: 1; min-width: 0; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px;
  background: #fff; color: var(--ink); font: 700 18px var(--body); font-variant-numeric: tabular-nums;
  user-select: text; -webkit-user-select: text; touch-action: manipulation;
}
.go-btn {
  padding: 10px 20px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--river); color: #fff; font: 700 18px var(--display);
}
.goto input:focus-visible, .go-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.card .goto-error { color: var(--danger); font-size: 14px; font-weight: 700; }
.text-btn {
  border: 0; background: none; padding: 8px 12px; cursor: pointer;
  font: 700 15px var(--body); color: var(--muted); text-decoration: underline; text-underline-offset: 3px;
}
.text-btn.armed { color: var(--danger); }
.card .version { font-size: 11px; line-height: 1; color: var(--muted); opacity: 0.6; }
.text-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="game" role="img" aria-label="Trout Trot game area: a trout on the bank of a river"></canvas>
<div class="sr-only" id="announcer" aria-live="polite"></div>

<div class="hud" id="hud" hidden>
  <div class="stat">
    <span class="label">Round</span>
    <span class="value" id="roundValue">1</span>
  </div>
  <div class="meter" id="meter">
    <div class="row"><span class="label">Moisture</span><span class="label power" id="powerLabel" hidden>Invisible</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <button class="icon-btn" id="pauseBtn" aria-label="Pause">II</button>
</div>

<div class="overlay" id="startScreen" role="dialog" aria-modal="true" aria-labelledby="startTitle">
  <div class="card">
    <h1 id="startTitle">Trout <span>Trot</span></h1>
    <div class="controls">
      <div class="control"><b>Swipe</b><span>to flop. A longer swipe flops farther.</span></div>
      <div class="control"><b>Tap</b><span>beside the trout for a short hop.</span></div>
    </div>
    <button class="play" id="startBtn">Flop!</button>
    <button class="text-btn" id="restartBtn" hidden>Start over</button>
    <div class="version" id="versionLabel"></div>
  </div>
</div>

<div class="overlay" id="pauseScreen" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
  <div class="card">
    <h2 id="pauseTitle">Paused</h2>
    <button class="play" id="resumeBtn">Resume</button>
    <form class="goto" id="gotoForm" novalidate>
      <label class="label" for="gotoInput">Go to round</label>
      <div class="goto-row">
        <input id="gotoInput" type="number" inputmode="numeric" min="1" step="1" aria-describedby="gotoError">
        <button type="submit" class="go-btn">Go</button>
      </div>
      <p class="goto-error" id="gotoError" role="alert" hidden></p>
    </form>
  </div>
</div>

<div class="overlay" id="overScreen" role="dialog" aria-modal="true" aria-labelledby="overTitle" hidden>
  <div class="card">
    <h2 id="overTitle">Dried out</h2>
    <p class="over-round" id="overRound">Round 1</p>
    <button class="play" id="againBtn">Try again</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const APP_VERSION = '1.1.001'; // shown on the start screen; keep in step with `npm run version:set`
  $('versionLabel').textContent = 'v' + APP_VERSION;
  const ui = {
    hud: $('hud'), round: $('roundValue'), fill: $('fill'), meter: $('meter'), power: $('powerLabel'),
    start: $('startScreen'), pause: $('pauseScreen'), over: $('overScreen'), overTitle: $('overTitle'),
    overRound: $('overRound')
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Screen reader announcements. Clearing first makes a repeated message (another +1) read again.
  const announcer = $('announcer');
  function announce(msg) {
    announcer.textContent = '';
    setTimeout(() => { announcer.textContent = msg; }, 50);
  }

  // Top-down world, 860 tall; the bank widens every round (WW) and the camera scrolls sideways
  // to follow the trout, showing VIEW_W units at a time on a phone. All game logic keeps the
  // river on the left; when `flip` is set, drawing and input are mirrored so it shows on the right.
  const VIEW_W = 600, WH = 860, FR = 12, GRAV = 1500, TOP = 95, BOTTOM = WH - 35;
  let WW = 600, TREES = WW - 52, cam = 0;
  let W = 0, H = 0, view = { s: 1, oy: 0, w: VIEW_W };

  let mode = 'title'; // title | play | paused | saved | dying | over
  let level = 1, moisture = 100, stateTimer = 0, bannerTimer = 0, seasonTimer = 0, hintOn = true, clock = 0, deathBy = 'dry';
  // Rounds keep getting harder up to MAX_ROUND, then stay at that difficulty.
  const MAX_ROUND = 100;
  const SEASON_TIME = 2.4; // seconds a season's title ("Autumn", "Winter") shows before the round banner

  // Seasons. Rounds 1–99 are autumn, with the trees turning as the rounds go on. Rounds 100 on are
  // winter: dead grass, bare trees and a frozen river, with snow building to round 190 and melting by 199.
  // `fall` runs from 0 to 1 across autumn; snowAt() below gives winter's snow. makeLevel sets them per round.
  const WINTER_FROM = 100, WINTER_FULL = 199;
  const clamp01 = v => Math.max(0, Math.min(1, v));
  let winter = false, fall = 0, snow = 0, cover = 0, snowfall = 0, seasonName = '';
  // Winter snow, by round (each 0 to 1):
  //   cover    how much of the ground is white: 10% → 100% over rounds 100–110, 100% through 190,
  //            then melting back to 10% by 199, where it stays.
  //   snow     how deep it is: a dusting through 110, deepening steadily to full depth at 190,
  //            then melting down with the coverage.
  //   snowfall how hard it's snowing: building through 190, tapering to nothing by 199.
  function snowAt(n) {
    if (n < WINTER_FROM) return { cover: 0, depth: 0, falling: 0 };
    const c = Math.min(n, WINTER_FULL);
    const cover = c <= 110 ? 0.1 + 0.9 * (c - WINTER_FROM) / 10 : c <= 190 ? 1 : 1 - 0.9 * (c - 190) / 9;
    const depth = c <= 110 ? 0.1 : c <= 190 ? 0.1 + 0.9 * (c - 110) / 80 : cover;
    const falling = c <= 190 ? 0.2 + 0.8 * (c - WINTER_FROM) / 90 : (WINTER_FULL - c) / 9;
    return { cover, depth, falling };
  }

  // Progress: the round the player is on is saved on the device each time they clear a round,
  // and play always starts from it. There is no score.
  const SAVE_KEY = 'trout-trot-round';
  let savedRound = 1;
  try {
    savedRound = Math.max(1, parseInt(localStorage.getItem(SAVE_KEY) || '1', 10) || 1);
    localStorage.removeItem('flop-home-trout-best'); // the old best-score save, no longer used
  } catch (e) {}
  function saveRound(n) {
    savedRound = n;
    try { localStorage.setItem(SAVE_KEY, String(n)); } catch (e) {}
  }

  const fish = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, angle: Math.PI, cooldown: 0, alpha: 1, lift: 0 };
  let flip = false, river = { base: 185, amp: 0, phase: 0, far: 60 };
  let boulders = [], logs = [], springs = [], leaves = [], pebbles = [], trees = [], parts = [];
  let anglers = [], talus = [], cedars = [], ripples = [], drifts = [], holes = [], cracks = [], flakes = [], place = '';
  let grass = {}; // grass blades, grouped by color so each color draws as one path
  let snowGrain = null; // repeating speckle texture for winter snow, made once per round
  const canoe = { active: false, t: 4, x: 0, y: 0, vy: 0, off: 0, color: '#2f6b4f' };
  let eagles = [], eagleCatcher = null;

  const rnd = (a, b) => a + Math.random() * (b - a);
  // Fisher–Yates: every order equally likely.
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const shoreAt = y => river.base + river.amp * Math.sin(y * 0.011 + river.phase);
  const farAt = y => river.far + 8 * Math.sin(y * 0.017 + river.phase * 1.7);
  const PLACES = ['Trout Run', "Dunning's Spring", 'Twin Springs', 'Phelps Park', 'Palisades Park', 'Ice Cave', 'Malanaphy Springs', 'Siewers Spring', 'Will Baker Park', 'Pulpit Rock'];
  const CANOE_COLORS = ['#2f6b4f', '#b4402f', '#2f5a8a'];
  // Reaching the water. In autumn: anywhere past the near bank. In winter the river is frozen,
  // so only an ice-fishing hole will do; the trout slides across the ice to reach one.
  const holeAt = (x, y) => holes.find(h => Math.hypot(x - h.x, y - h.y) < h.r);
  const inRiver = () => fish.z < 6 && (winter ? !!holeAt(fish.x, fish.y) : fish.x < shoreAt(fish.y) - 4);
  const onIce = () => winter && fish.x < shoreAt(fish.y);
  // Nothing presses the trout until it makes its first flop of the round (swipe, tap or arrow
  // key): moisture stays full and the eagles hold off, so a round starts when the player is ready.
  let troutMoved = false;
  let savedHole = null; // the hole the trout went into, for the end-of-round animation
  // Winter snow makes flopping harder: 4% less distance every 10 rounds from round 100
  // (96% in rounds 100–109 … 60% in 190–199 and after). Cold air dries the trout more slowly by
  // the same factor, so a crossing still costs about the same share of its moisture.
  const flopScale = () => !winter ? 1 : 1 - 0.04 * (Math.floor((Math.min(level, WINTER_FULL) - WINTER_FROM) / 10) + 1);
  const drainRate = () => Math.min(11, 7 + level * 0.4) * flopScale();
  const LEAF_COLORS = ['#d9822b', '#c4502e', '#e8b33c', '#a8442a', '#d99a3a'];

  // ---------- level ----------
  function makeLevel(n) {
    flip = n > 1 && Math.random() < 0.5;
    winter = n >= WINTER_FROM;
    fall = clamp01((n - 1) / (WINTER_FROM - 2));
    ({ cover, depth: snow, falling: snowfall } = snowAt(n));
    // Each round the trout lands 40 units (about 1 ft) farther from the river, up to MAX_ROUND.
    WW = 600 + (Math.min(n, MAX_ROUND) - 1) * 40; TREES = WW - 52;
    river = { base: rnd(178, 192), amp: Math.min(n * 8, 45), phase: rnd(0, 6), far: 60 };
    place = PLACES[(n - 1) % PLACES.length];
    fish.x = rnd(WW - 130, TREES - 45); fish.y = rnd(260, WH - 170);
    fish.z = fish.vx = fish.vy = fish.vz = 0; fish.angle = Math.PI + rnd(-0.6, 0.6);
    fish.cooldown = 0; fish.alpha = 1; fish.lift = 0; fish.landedAt = -Infinity; queuedFlop = null;
    boulders = []; logs = []; springs = []; parts = [];

    const clearOf = (x, y, r) =>
      Math.hypot(x - fish.x, y - fish.y) > r + 70 &&
      boulders.every(b => Math.hypot(x - b.x, y - b.y) > r + b.r + 24) &&
      springs.every(s => Math.hypot(x - s.x, y - s.y) > r + s.r + 20) &&
      logs.every(l => x + r < l.x - 20 || x - r > l.x + l.w + 20 || y + r < l.y - 20 || y - r > l.y + l.h + 20);

    // Limestone boulders block you; fallen logs are low enough to flop over.
    const nb = n === 1 ? 1 : Math.min(1 + n + Math.floor((WW - 600) / 250), 16);
    for (let i = 0, tries = 0; i < nb && tries < 400; tries++) {
      const r = rnd(20, 32), y = rnd(TOP + r, BOTTOM - r), x = rnd(shoreAt(y) + r + 40, TREES - r - 10);
      if (clearOf(x, y, r)) { boulders.push({ x, y, r, seed: Math.random() * 6 }); i++; }
    }
    const randomLog = () => {
      const h = rnd(90, 140), y = rnd(TOP, BOTTOM - h);
      return { x: rnd(shoreAt(y + h / 2) + 50, TREES - 60), y, w: 18, h };
    };
    const logClear = l => clearOf(l.x + l.w / 2, l.y + l.h / 2, l.h / 2);
    const nl = n < 2 ? 0 : Math.min(Math.floor(n / 2) + Math.floor((WW - 600) / 600), 6);
    for (let i = 0, tries = 0; i < nl && tries < 200; tries++) {
      const l = randomLog();
      if (logClear(l)) { logs.push(l); i++; }
    }
    // Herons: one per log, only on logs whose walkway stays well out of reach of where the trout
    // starts. Extra logs are added if there aren't enough suitable ones.
    herons = []; heronCatcher = null;
    const wantHerons = heronCount(n);
    const heronSafe = l => distToLog(l, fish.x, fish.y) > HERON.reach + 60;
    for (let tries = 0; logs.filter(heronSafe).length < wantHerons && tries < 400; tries++) {
      const l = randomLog();
      if (heronSafe(l) && logClear(l)) logs.push(l);
    }
    herons = shuffle(logs.filter(heronSafe)).slice(0, wantHerons).map(makeHeron);
    // More springs on wider banks, since the trip takes longer.
    const ns = n < 2 ? 0 : 1 + Math.floor((WW - 600) / 500);
    for (let i = 0, tries = 0; i < ns && tries < 200; tries++) {
      const r = 78, y = rnd(TOP + r, BOTTOM - r), x = rnd(shoreAt(y) + r + 34, TREES - r - 10);
      if (clearOf(x, y, r)) { springs.push({ x, y, r, water: 35 }); i++; }
    }
    // Invisibility bubble, somewhere between the trout and the river, and always out of every
    // heron's reach, even for a trout touching the edge of the bubble's pickup range.
    powerup.active = false; invisible = 0;
    if (n >= INVIS_FROM) {
      for (let tries = 0; tries < 300; tries++) {
        const y = rnd(TOP + 50, BOTTOM - 50), lo = shoreAt(y) + 60;
        const x = rnd(lo, Math.max(lo + 10, fish.x - 160));
        const outOfReach = herons.every(h => distToLog(h.log, x, y) > HERON.reach + BUBBLE_GRAB + 10);
        if (outOfReach && clearOf(x, y, BUBBLE_R + 8)) { powerup.active = true; powerup.x = x; powerup.y = y; break; }
      }
    }

    // Fallen leaves: a few at the start of autumn, building up through the season; in winter,
    // faded brown ones that disappear under the snow.
    const leafShare = winter ? 1 - cover : 0.15 + 0.85 * fall;
    leaves = Array.from({ length: Math.round(70 * WW / 600 * leafShare) }, () => {
      const y = rnd(-100, WH + 100);
      return { x: rnd(shoreAt(y) + 14, WW + 300), y, a: rnd(0, 6), c: winter ? pickOne(['#7a6448', '#6a553c', '#8a7255']) : pickOne(LEAF_COLORS) };
    });
    // Grass: tufts of 3–6 thin blades across the bank. In autumn more of them turn straw-yellow as
    // the season goes on; in winter they're dead tan, shrinking and thinning until the snow buries them.
    grass = {};
    const GREEN = ['#4a7530', '#3f6a2a', '#5a8a38', '#9cbd5c'], STRAW = ['#c2a654', '#d4b862', '#a88c3e'];
    const DEAD = ['#7a6a44', '#8a7a50', '#6a5a3a'];
    const bladeScale = winter ? 1 - cover * 1.15 : 1;
    const tuftCount = Math.round(WW / 600 * 520 * (winter ? clamp01(1 - cover * 0.9) : 1));
    if (bladeScale > 0.12) {
      for (let i = 0; i < tuftCount; i++) {
        const y = rnd(-60, WH + 60), x = rnd(shoreAt(y) + 12, WW + 300);
        const straw = !winter && Math.random() < fall * 0.7;
        const blades = 3 + Math.floor(Math.random() * 4);
        for (let b = 0; b < blades; b++) {
          const c = pickOne(winter ? DEAD : straw ? STRAW : GREEN);
          (grass[c] = grass[c] || []).push({ x: x + rnd(-3, 3), y: y + rnd(-2, 2), a: rnd(-0.55, 0.55), len: rnd(9, 17) * bladeScale });
        }
      }
    }
    // Sorted by x so drawGrass can find the blades on screen without visiting all of them.
    for (const c in grass) grass[c].sort((p, q) => p.x - q.x);
    // Winter drifts: scattered at 10% coverage, larger and more numerous until they merge.
    drifts = !winter ? [] : Array.from({ length: Math.round(WW / 600 * (14 + 30 * cover)) }, () => {
      const y = rnd(-100, WH + 100), grow = 0.6 + 1.2 * cover;
      return { x: rnd(shoreAt(y) + 10, WW + 300), y, rx: rnd(26, 60) * grow, ry: rnd(16, 34) * grow, a: rnd(0, 3) };
    });
    for (const d of drifts) buildDriftPaths(d);
    snowGrain = winter ? makeSnowGrain() : null;
    pebbles = Array.from({ length: 140 }, () => {
      const y = rnd(-200, WH + 200);
      return { y, dx: rnd(-14, 10), r: rnd(2, 5), c: Math.random() < 0.5 ? '#cfc8b8' : '#a9a293' };
    });
    buildTrees();

    // Winter: ice-fishing holes spread along the frozen river, each with an ice fisher beside it,
    // plus cracks in the ice (stored as a fraction of the way across, so they follow the banks).
    holes = []; cracks = [];
    if (winter) {
      const nh = 4;
      for (let i = 0; i < nh; i++) {
        const y = TOP + 50 + (BOTTOM - TOP - 100) * (i + rnd(0.2, 0.8)) / nh, fx = farAt(y);
        holes.push({ x: fx + (shoreAt(y) - fx) * rnd(0.42, 0.62), y, r: 20, seed: rnd(0, 6), coat: pickOne(['#b4402f', '#2f5a8a', '#3e5a3b', '#d08a2e']) });
      }
      cracks = Array.from({ length: 16 }, () => {
        let lane = rnd(0.05, 0.95), y = rnd(-100, WH + 100);
        return Array.from({ length: 5 }, () => { const p = [lane, y]; lane = clamp01(lane + rnd(-0.15, 0.15)); y += rnd(12, 30); return p; });
      });
    }

    // Fly anglers wading the shallows, spaced well apart. Not in winter, when the river is frozen.
    anglers = [];
    const na = winter ? 0 : n === 1 ? 1 : Math.random() < 0.6 ? 2 : 1;
    for (let i = 0, tries = 0; i < na && tries < 100; tries++) {
      const y = rnd(TOP + 40, BOTTOM - 40);
      if (anglers.every(a => Math.abs(a.y - y) > 220)) {
        anglers.push({ y, x: shoreAt(y) - 30, facing: Math.PI + rnd(-0.35, 0.35), seed: rnd(0, 6) });
        i++;
      }
    }
    talus = Array.from({ length: 90 }, () => {
      const y = rnd(-200, WH + 200);
      return { y, dx: rnd(-6, 8), r: rnd(2, 5), c: Math.random() < 0.5 ? '#d8d0bd' : '#b3a993' };
    });
    cedars = Array.from({ length: 26 }, (_, i) => ({
      y: -120 + i * 42 + rnd(-12, 12), dx: rnd(-34, -12), r: rnd(9, 15),
      // Mostly red cedar; the rest are hardwoods that turn with the season, bare in winter.
      c: Math.random() < 0.6 ? '#3e5a3b' : winter ? '#6b5a49' : shadeHex(pickOne(SUMMER), pickOne(LEAF_COLORS), clamp01(fall * 1.2 + rnd(-0.2, 0.2)))
    }));

    eagles = Array.from({ length: eagleCount(n) }, (_, i) => ({ phase: 'idle', t: rnd(2.5, 4) + i * 2, x: 0, y: 0, vx: 0, vy: 0 }));
    eagleCatcher = null;
    makeTeams();
    weather = winter ? rollWeather() : 'clear';
    moisture = 100; bannerTimer = 1.6;
    troutMoved = false; // the round starts on the first flop
    seasonName = n === 1 ? 'Autumn' : n === WINTER_FROM ? 'Winter' : ''; // each season's first round opens with its name
    seasonTimer = seasonName ? SEASON_TIME : 0;
    cam = camTarget();
    ui.round.textContent = n;
  }

  // ---------- sizing ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const s = Math.min(W / VIEW_W, H / WH);
    view = { s, oy: (H - WH * s) / 2, w: W / s };
    cam = camTarget();
    // A wider window can show deeper woods than were built for this round.
    if (treeLayer && treeReach() > treeLayer.reach + 1) buildTrees();
  }
  // `cam` is the logic x at the river-side edge of the screen. The trout sits about two-thirds
  // of the way across, so more of the way ahead is in view; the river slides in as it gets close.
  function camTarget() {
    if (view.w >= WW + 40) return (WW - view.w) / 2;
    return Math.max(0, Math.min(WW - view.w, fish.x - view.w * 0.68));
  }
  function toWorld(px, py) {
    const vx = px / view.s;
    return { x: flip ? cam + view.w - vx : cam + vx, y: (py - view.oy) / view.s };
  }
  function toScreen(x, y) {
    const vx = flip ? cam + view.w - x : x - cam;
    return { x: vx * view.s, y: view.oy + y * view.s };
  }

  // ---------- sound ----------
  let audio = null;
  function ensureAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audio && audio.state === 'suspended') audio.resume();
  }
  function tone(freq, dur, type = 'sine', vol = 0.12, slide = 0) {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain(), now = audio.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, now + dur);
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g).connect(audio.destination); o.start(now); o.stop(now + dur);
  }
  // Splash in two layers: the spray, then droplets landing back on the water.
  function splashSound() {
    if (!audio) return;
    const now = audio.currentTime, sr = audio.sampleRate;
    const len = Math.floor(sr * 0.7), buf = audio.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    f.type = 'bandpass'; f.Q.value = 0.8;
    f.frequency.setValueAtTime(2600, now); f.frequency.exponentialRampToValueAtTime(450, now + 0.6);
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.7, now + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
    src.buffer = buf; src.connect(f).connect(g).connect(audio.destination); src.start(now);
    for (let i = 0; i < 6; i++) {
      const t = now + 0.15 + Math.random() * 0.5, fq = 900 + Math.random() * 1000;
      const o = audio.createOscillator(), og = audio.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(fq, t); o.frequency.exponentialRampToValueAtTime(fq * 1.6, t + 0.05);
      og.gain.setValueAtTime(0.07, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(og).connect(audio.destination); o.start(t); o.stop(t + 0.07);
    }
  }

  // ---------- flow ----------
  // Start (or retry) from the saved round.
  let layoutReady = false;
  function startGame() {
    ensureAudio();
    level = savedRound; hintOn = true;
    // The first start plays the bank already built behind the start card; retries build a new one.
    if (!layoutReady) makeLevel(level);
    layoutReady = false;
    mode = 'play';
    ui.start.hidden = ui.over.hidden = ui.pause.hidden = true; ui.hud.hidden = false;
    updateHud();
    announce((seasonName ? seasonName + '. ' : '') + 'Round ' + level + ', ' + placeLine() + '.' + (level === 1 ? ' Swipe toward the river.' : ''));
  }
  // Pause works mid-round and during the splash and dying animations; resume returns to that state.
  let pausedFrom = 'play';
  function pauseGame() {
    if (mode !== 'play' && mode !== 'saved' && mode !== 'dying') return;
    pausedFrom = mode; mode = 'paused'; queuedFlop = null; ptr = null;
    gotoInput.value = Math.min(savedRound, MAX_PICK); disarmGoto();
    ui.pause.hidden = false; $('resumeBtn').focus();
  }
  // Pause menu "Go to round": any whole number from 1 to MAX_PICK. Starts that round straight away
  // and saves it as the player's progress. Going back below the saved round takes a second tap, like
  // Start over, so progress isn't lost by accident.
  const MAX_PICK = 400;
  const gotoInput = $('gotoInput'), gotoError = $('gotoError');
  // The limit is written once, here; the box's max and the error text are filled in from it.
  const GOTO_RANGE_TEXT = 'Enter a round from 1 to ' + MAX_PICK + '.';
  gotoInput.max = MAX_PICK; gotoError.textContent = GOTO_RANGE_TEXT;
  let gotoArmed = 0; // the round a first tap on Go is waiting to confirm going back to
  function disarmGoto() { gotoArmed = 0; gotoError.hidden = true; gotoError.textContent = GOTO_RANGE_TEXT; }
  function goToRound(e) {
    e.preventDefault();
    const text = String(gotoInput.value).trim(), n = Number(text);
    if (!/^\d+$/.test(text) || n < 1 || n > MAX_PICK) {
      gotoArmed = 0; gotoError.textContent = GOTO_RANGE_TEXT; gotoError.hidden = false; gotoInput.focus();
      return;
    }
    if (n < savedRound && gotoArmed !== n) {
      gotoArmed = n;
      gotoError.textContent = 'Tap Go again: your progress goes back from round ' + savedRound + ' to ' + n + '.';
      gotoError.hidden = false;
      return;
    }
    disarmGoto(); gotoInput.blur();
    saveRound(n);
    level = n; hintOn = true;
    makeLevel(n);
    mode = 'play'; layoutReady = false;
    ui.pause.hidden = true; ui.hud.hidden = false;
    last = performance.now();
    updateHud();
    announce((seasonName ? seasonName + '. ' : '') + 'Round ' + level + ', ' + placeLine() + '.');
  }
  function resumeGame() { if (mode !== 'paused') return; mode = pausedFrom; ui.pause.hidden = true; last = performance.now(); }
  function reachRiver() {
    mode = 'saved'; stateTimer = 1.4;
    savedHole = winter ? holeAt(fish.x, fish.y) : null;
    saveRound(level + 1);
    for (const e of eagles) e.phase = 'off';
    burst(fish.x, fish.y, 30, '#d6f1ee', 260);
    ripples.push({ x: fish.x, y: fish.y, age: 0 });
    splashSound();
    updateHud();
    announce('Splash!');
  }
  function lose(reason) {
    mode = 'dying'; stateTimer = 1.4; deathBy = reason;
    // Every other eagle stands down, so no shadow or ring is left frozen mid-dive.
    for (const e of eagles) if (e !== eagleCatcher) e.phase = 'off';
    if (reason === 'dry') { moisture = 0; tone(300, 0.6, 'triangle', 0.12, 0.4); }
    else tone(880, 0.5, 'sawtooth', 0.06, 0.5);
    try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
  }
  function showOver() {
    mode = 'over';
    ui.overTitle.textContent = { eagle: 'Snatched by an eagle', heron: 'Speared by a heron' }[deathBy] || 'Dried out';
    ui.overRound.textContent = 'Round ' + level;
    ui.hud.hidden = true; ui.over.hidden = false;
    $('againBtn').focus();
    announce(ui.overTitle.textContent + '. Round ' + level + '.');
  }
  function updateHud() {
    ui.fill.style.width = Math.max(0, moisture) + '%';
    const low = moisture < 25;
    if (low && mode === 'play' && !ui.meter.classList.contains('low')) announce('Moisture low.');
    ui.meter.classList.toggle('low', low);
    // Invisibility countdown beside the moisture label. Only touched when the whole-second count changes.
    const secs = Math.ceil(invisible);
    if (secs !== shownPowerSecs) {
      shownPowerSecs = secs;
      ui.power.hidden = secs <= 0;
      if (secs > 0) ui.power.textContent = 'Invisible ' + secs + 's';
    }
  }
  let shownPowerSecs = -1;

  // ---------- flops ----------
  const canFlop = () => mode === 'play' && fish.z === 0 && fish.vz === 0 && fish.cooldown <= 0;
  // Input buffer: a flop asked for mid-air is remembered and fires the moment the trout lands,
  // instead of being dropped. Presses older than FLOP_BUFFER seconds are discarded.
  const FLOP_BUFFER = 0.5;
  let queuedFlop = null;
  function requestFlop(dx, dy, mag) {
    if (mode !== 'play') return;
    ensureAudio();
    if (canFlop()) { queuedFlop = null; launch(dx, dy, mag); }
    else queuedFlop = { dx, dy, mag, age: 0 };
  }
  function runQueuedFlop(dt) {
    if (!queuedFlop) return;
    queuedFlop.age += dt;
    if (queuedFlop.age > FLOP_BUFFER) { queuedFlop = null; return; }
    if (canFlop()) { const q = queuedFlop; queuedFlop = null; launch(q.dx, q.dy, q.mag); }
  }
  function launch(dx, dy, mag) {
    mag *= flopScale();
    troutMoved = true;
    const d = Math.hypot(dx, dy) || 1;
    fish.vx = dx / d * mag; fish.vy = dy / d * mag; fish.vz = 360; fish.z = 0.01;
    fish.angle = Math.atan2(fish.vy, fish.vx);
    fish.cooldown = 0.15; hintOn = false;
    burst(fish.x, fish.y, 5, '#b9cf8a', 90);
    tone(170 + Math.random() * 40, 0.12, 'sine', 0.18, 0.6);
  }
  function swipeMag(dist) { return Math.max(160, Math.min(480, (dist / view.s) * 3.2)); }

  // ---------- input ----------
  let ptr = null;
  cv.addEventListener('pointerdown', e => {
    if (ptr && ptr.id !== e.pointerId) return; // ignore a second finger until the first lifts
    ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now() };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', e => { if (ptr && e.pointerId === ptr.id) { ptr.x = e.clientX; ptr.y = e.clientY; } });
  cv.addEventListener('pointerup', e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const dx = (e.clientX - ptr.x0) * (flip ? -1 : 1), dy = e.clientY - ptr.y0, dist = Math.hypot(dx, dy);
    const quick = performance.now() - ptr.t0 < 350;
    ptr = null;
    if (dist < 14 && quick) {
      const w = toWorld(e.clientX, e.clientY);
      requestFlop(w.x - fish.x, w.y - fish.y, 150);
    } else if (dist >= 14) {
      requestFlop(dx, dy, swipeMag(dist));
    }
  });
  cv.addEventListener('pointercancel', e => { if (ptr && e.pointerId === ptr.id) ptr = null; });
  addEventListener('keydown', e => {
    // While typing a round number, only Escape still works (it closes the menu); P and the arrow
    // keys belong to the text box.
    const typing = e.target && e.target.tagName === 'INPUT';
    if (e.key === 'Escape' || (e.key === 'p' && !typing)) { mode === 'paused' ? resumeGame() : pauseGame(); return; }
    if (typing) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    const d = dirs[e.key];
    if (!d) return;
    e.preventDefault();
    requestFlop(d[0] * (flip ? -1 : 1), d[1], e.shiftKey ? 150 : 320);
  });
  // Pause whenever the game loses the player's attention: tab hidden, focus moved away
  // (notification shade, incoming call, clicking outside), page put in the background or frozen.
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  addEventListener('blur', pauseGame);
  addEventListener('pagehide', pauseGame);
  document.addEventListener('freeze', pauseGame);
  $('startBtn').addEventListener('click', startGame);
  // Start over: the first tap arms it, a second tap within 4 seconds resets progress to round 1.
  const restartBtn = $('restartBtn');
  let restartArmed = null;
  function disarmRestart() {
    clearTimeout(restartArmed); restartArmed = null;
    restartBtn.textContent = 'Start over'; restartBtn.classList.remove('armed');
  }
  restartBtn.addEventListener('click', () => {
    if (!restartArmed) {
      restartBtn.textContent = 'Tap again to start over at round 1';
      restartBtn.classList.add('armed');
      restartArmed = setTimeout(disarmRestart, 4000);
      return;
    }
    disarmRestart();
    saveRound(1);
    level = 1; makeLevel(1); layoutReady = true;
    restartBtn.hidden = true;
    $('startBtn').focus();
    announce('Progress reset. Starting from round 1.');
  });
  $('againBtn').addEventListener('click', startGame);
  $('resumeBtn').addEventListener('click', resumeGame);
  $('gotoForm').addEventListener('submit', goToRound);
  gotoInput.addEventListener('input', disarmGoto);
  $('pauseBtn').addEventListener('click', () => mode === 'paused' ? resumeGame() : pauseGame());

  // ---------- particles ----------
  function burst(x, y, n, color, spd) {
    const count = reduced ? Math.ceil(n / 3) : n;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, color, r: 2 + Math.random() * 3 });
    }
  }

  // ---------- physics ----------
  function bounce(nx, ny, e) {
    const vn = fish.vx * nx + fish.vy * ny;
    if (vn < 0) { fish.vx -= (1 + e) * vn * nx; fish.vy -= (1 + e) * vn * ny; fish.angle = Math.atan2(fish.vy, fish.vx); }
  }
  function collide() {
    for (const b of boulders) {
      const dx = fish.x - b.x, dy = fish.y - b.y, d = Math.hypot(dx, dy), min = b.r + FR;
      if (d < min && d > 0.001) {
        fish.x = b.x + dx / d * min; fish.y = b.y + dy / d * min;
        bounce(dx / d, dy / d, 0.45);
      }
    }
    if (fish.z < 14) {
      for (const l of logs) {
        const cx = Math.max(l.x, Math.min(fish.x, l.x + l.w)), cy = Math.max(l.y, Math.min(fish.y, l.y + l.h));
        const dx = fish.x - cx, dy = fish.y - cy, d = Math.hypot(dx, dy);
        if (d < FR) {
          let nx, ny;
          if (d > 0.001) { nx = dx / d; ny = dy / d; fish.x = cx + nx * FR; fish.y = cy + ny * FR; }
          else { nx = fish.x < l.x + l.w / 2 ? -1 : 1; ny = 0; fish.x = nx < 0 ? l.x - FR : l.x + l.w + FR; }
          bounce(nx, ny, 0.3);
        }
      }
    }
    if (fish.x > TREES - FR) { fish.x = TREES - FR; bounce(-1, 0, 0.4); }
    // In winter the trout can cross the ice, and bounces off the bluff on the far side.
    if (winter && fish.x < farAt(fish.y) + FR) { fish.x = farAt(fish.y) + FR; bounce(1, 0, 0.4); }
    if (fish.y < TOP) { fish.y = TOP; bounce(0, 1, 0.4); }
    if (fish.y > BOTTOM) { fish.y = BOTTOM; bounce(0, -1, 0.4); }
  }

  // The eagle arrives in round 5. It flies in fast, circles the trout, then dives (EAGLE_DIVE).
  // EAGLE_SKILL = 6 sets its flying speed, strike size and rest between dives; lower it to make
  // the eagle easier.
  const EAGLE_FROM = 5, EAGLE_SKILL = 6;
  // One eagle from round 5. In winter, eagles hunt in pairs: one pair in rounds 100–149, two pairs
  // from 150 on (through the melt and every round after).
  const eagleCount = n => n < EAGLE_FROM ? 0 : n < WINTER_FROM ? 1 : n < 150 ? 2 : 4;
  // From round 10 it flies in and circles 5% faster every 10 rounds, compounding, up to
  // MAX_ROUND: ×1.05 in rounds 10–19, ×1.1025 in 20–29, … ×1.63 at round 100. The dive itself
  // doesn't speed up (see EAGLE_DIVE), nor does the strike size.
  const eagleSpeedUp = () => Math.pow(1.05, Math.max(0, Math.floor((Math.min(level, MAX_ROUND) - 10) / 10) + 1));
  const EAGLE = (k => ({
    speed: 260 + k * 45,
    radius: Math.min(62, 38 + k * 4),
    rest: Math.max(0.8, 3.5 - k * 0.35),
    reachZ: Math.min(48, 22 + k * 4)
  }))(EAGLE_SKILL);
  // The hunt, built so a well-timed flop can always escape a dive. The eagle circles for `circle`
  // seconds, then the red ring appears `lead` of the way toward where the trout is heading; for the
  // next `warn` seconds it drifts after the trout at no more than `steer` units/s, then strikes
  // anything within `radius`. It rests `rest[0]` + up to `rest[1]` seconds before the next hunt.
  // Winter eagles are hungrier: a shorter warning, a faster and further-ahead ring, a wider strike,
  // and less circling and rest. Snow also weakens flops in winter (flopScale, down to ×0.6), so the
  // warning lengthens and the drift slows by that factor, leaving time to land and flop clear.
  const EAGLE_DIVE = {
    autumn: { circle: 2, warn: 0.6, steer: 80, lead: 0.25, radius: EAGLE.radius, rest: [EAGLE.rest, 1.5] },
    winter: { circle: 1.2, warn: 0.45, steer: 130, lead: 0.5, radius: 72, rest: [0.8, 1] }
  };
  const dive = () => (winter ? EAGLE_DIVE.winter : EAGLE_DIVE.autumn);
  const diveWarn = () => dive().warn / flopScale();
  const diveSteer = () => dive().steer * flopScale();

  // ---------- winter weather ----------
  // Each winter round rolls its weather: 75% clear (a few flurries), 12.5% snowing, 12.5% snowstorm.
  // Snow and storms close in a white haze beyond `sight` units of the trout, and make the eagles
  // slower to find it (`circle` extra seconds), less accurate (ring up to `aimError` off) and, in
  // a storm, liable to lose it (`abort` chance per pair dive). Red dive rings show through the haze.
  const SKY = {
    clear: { label: '', sight: 0, haze: 0, circle: 0, aimError: 0, abort: 0 },
    snow: { label: 'Snowing', sight: 260, haze: 0.85, circle: 0.5, aimError: 25, abort: 0 },
    storm: { label: 'Snowstorm', sight: 150, haze: 0.95, circle: 1, aimError: 50, abort: 0.25 }
  };
  let weather = 'clear';
  const sky = () => SKY[weather];
  const rollWeather = () => (Math.random() >= 0.25 ? 'clear' : Math.random() < 0.5 ? 'snow' : 'storm');
  // The round banner's second line: the place, plus the weather when it's snowing.
  const placeLine = () => place + (sky().label ? ' · ' + sky().label : '');

  // The one place predators check whether they can see the trout. The eagle and the heron
  // only ever aim at what this returns, so invisibility hides the trout from both.
  const visibleTrout = () => (invisible > 0 ? null : fish);

  // Before diving, the eagle circles the trout (for dive().circle seconds), spiralling in from 150 to 55 units.
  const EAGLE_CIRCLE = { from: 150, to: 55, spin: 3.2 };
  function eagleAim(lead) {
    // `lead` of the way from the trout to where it's heading: its landing spot mid-flop, or the
    // end of its slide.
    let tLeft = 1 / 7;
    if (fish.z > 0 || fish.vz > 0) tLeft = (fish.vz + Math.sqrt(fish.vz * fish.vz + 2 * GRAV * fish.z)) / GRAV;
    return { x: fish.x + fish.vx * tLeft * lead, y: fish.y + fish.vy * tLeft * lead };
  }
  function moveEagle(e, to, spd, dt) {
    const dx = to.x - e.x, dy = to.y - e.y, d = Math.hypot(dx, dy) || 1;
    const step = Math.min(spd * dt, d);
    e.x += dx / d * step; e.y += dy / d * step;
    return d;
  }
  function eagleLeave(e) {
    e.phase = 'leave'; e.t = 1;
    const a = rnd(0, Math.PI * 2); e.vx = Math.cos(a) * 600; e.vy = Math.sin(a) * 600;
  }
  // On the ground, or landed within the last 0.1 s: a buffered flop relaunches the trout in the
  // same frame it lands, and without the grace a player who keeps a flop queued is never seen
  // landing, so no eagle would ever dive.
  const LANDED_GRACE = 0.1;
  // Off-screen height to fly in from: past the world edge farther from the trout, so the eagle crosses the bank.
  const spawnY = margin => fish.y < WH / 2 ? WH + margin : -margin;
  const troutLanded = () => (fish.z === 0 && fish.vz === 0) || clock - fish.landedAt < LANDED_GRACE;
  // Drop a red ring at `aim` (blurred by the weather) and start the dive.
  // `quiet` skips the alarm and announcement, for the second ring of a pincer that drops with the first.
  function startDive(e, aim, quiet) {
    const err = sky().aimError;
    // If the trout is already mid-hop (a buffered flop relaunched it), the warning starts when it
    // lands, and the ring holds still until then, so the player always gets the full warning
    // from the moment they can next flop.
    const air = fish.z > 0 || fish.vz > 0;
    const tLand = air ? (fish.vz + Math.sqrt(fish.vz * fish.vz + 2 * GRAV * fish.z)) / GRAV : 0;
    e.phase = 'lock'; e.hold = tLand; e.t = e.lockDur = diveWarn() + tLand;
    e.tx = aim.x + rnd(-err, err); e.ty = aim.y + rnd(-err, err);
    if (!quiet) { tone(1200, 0.25, 'square', 0.04, 0.8); announce('Eagle diving!'); }
  }
  function updateEagle(e, dt) {
    if (e.phase === 'off' || mode !== 'play') return;
    e.t -= dt;
    const sk = EAGLE, fast = eagleSpeedUp();
    // When the eagle can't see the trout it flies off, and doesn't return until it can.
    if (!visibleTrout()) {
      if (e.phase === 'track' || e.phase === 'circle' || e.phase === 'lock') eagleLeave(e);
      if (e.phase === 'idle' && e.t <= 0) e.t = 0.5;
    }
    const px = e.x, py = e.y;
    if (e.phase === 'idle' && e.t <= 0 && !e.team) {
      e.phase = 'track';
      e.x = fish.x + rnd(-200, 200); e.y = spawnY(80);
    } else if (e.phase === 'track') {
      // Close in only as far as the circling distance, then start circling from there, so the
      // shadow never passes over the trout before the dive.
      const dx = fish.x - e.x, dy = fish.y - e.y, d = Math.hypot(dx, dy) || 1;
      const step = Math.min(sk.speed * fast * dt, Math.max(0, d - EAGLE_CIRCLE.from));
      e.x += dx / d * step; e.y += dy / d * step;
      if (d - step <= EAGLE_CIRCLE.from + 1) {
        e.phase = 'circle'; e.t = e.circleDur = dive().circle + sky().circle;
        e.ang = Math.atan2(e.y - fish.y, e.x - fish.x);
        e.dir = Math.random() < 0.5 ? -1 : 1;
      }
    } else if (e.phase === 'circle') {
      // Circle the trout, spiralling in from EAGLE_CIRCLE.from to .to, then dive.
      const k = 1 - Math.max(0, e.t) / e.circleDur;
      const r = EAGLE_CIRCLE.from + (EAGLE_CIRCLE.to - EAGLE_CIRCLE.from) * k;
      e.ang += e.dir * EAGLE_CIRCLE.spin * fast * dt;
      const tx = fish.x + Math.cos(e.ang) * r, ty = fish.y + Math.sin(e.ang) * r;
      e.x += (tx - e.x) * Math.min(1, dt * 8);
      e.y += (ty - e.y) * Math.min(1, dt * 8);
      // Dive, but only once the trout is on the ground, so it can always flop away when the ring
      // appears; mid-hop, the eagle keeps circling until it lands.
      // (Paired eagles keep circling at the inner radius until their pair calls the dive.)
      if (!e.team && e.t <= 0 && troutLanded()) startDive(e, eagleAim(dive().lead));
    } else if (e.phase === 'lock') {
      // The ring drifts after the trout, slowly; the eagle's shadow swoops onto the ring.
      const dx = fish.x - e.tx, dy = fish.y - e.ty, d = Math.hypot(dx, dy) || 1;
      const step = e.hold > 0 ? 0 : Math.min(diveSteer() * dt, d);
      if (e.hold > 0) e.hold -= dt;
      e.tx += dx / d * step; e.ty += dy / d * step;
      e.x += (e.tx - e.x) * Math.min(1, dt * 14);
      e.y += (e.ty - e.y) * Math.min(1, dt * 14);
      if (e.t <= 0) {
        if (Math.hypot(fish.x - e.tx, fish.y - e.ty) < dive().radius && fish.z < sk.reachZ) {
          e.x = e.tx; e.y = e.ty; e.phase = 'carry'; eagleCatcher = e; lose('eagle'); return;
        }
        eagleLeave(e);
      }
    } else if (e.phase === 'wait') {
      // A waiting pair circles high and wide, as faint shadows, until it's their turn.
      e.ang += 0.5 * dt;
      const tx = fish.x + Math.cos(e.ang) * 260, ty = fish.y + Math.sin(e.ang) * 260;
      e.x += (tx - e.x) * Math.min(1, dt * 1.5); e.y += (ty - e.y) * Math.min(1, dt * 1.5);
    } else if (e.phase === 'leave') {
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.t <= 0) { e.phase = 'idle'; const [r0, r1] = dive().rest; e.t = r0 + rnd(0, r1); }
    }
    // Turn the silhouette to face where it's flying (its head points up when unrotated).
    const mx = e.x - px, my = e.y - py;
    if (Math.hypot(mx, my) > 0.5 && Math.hypot(mx, my) < 150) {
      e.heading = (e.heading || 0) + angleDiff(Math.atan2(my, mx) + Math.PI / 2, e.heading || 0) * Math.min(1, dt * 10);
    }
  }

  // ---------- eagle pairs (winter) ----------
  // Winter eagles hunt in pairs. A pair flies in, circles the trout on opposite sides, then dives as
  // a team, picking by coin flip:
  //   one-two  one eagle drops its ring; when that dive is over, its partner drops a ring where
  //            the trout has landed, so the trout has to dodge twice;
  //   pincer   both rings drop at once, either side of the trout's path, leaving the way forward
  //            or back open.
  // With two pairs they take turns; the other pair waits high above as faint shadows. Every ring
  // still waits for the trout to be on the ground, so each dive can be escaped.
  let teams = [], activeTeam = 0;
  function makeTeams() {
    teams = []; activeTeam = 0;
    if (eagles.length < 2) return;
    for (let i = 0; i + 1 < eagles.length; i += 2) {
      eagles[i].team = eagles[i + 1].team = true;
      teams.push({ a: eagles[i], b: eagles[i + 1], phase: 'rest', t: rnd(2.5, 4), tactic: '', synced: false });
    }
  }
  const huntingNow = e => e.phase === 'track' || e.phase === 'circle' || e.phase === 'lock';
  function updateTeams(dt) {
    if (!teams.length || mode !== 'play') return;
    teams.forEach((p, i) => {
      if (i === activeTeam) return;
      for (const e of [p.a, p.b]) {
        if (e.phase !== 'idle') continue;
        e.phase = 'wait'; e.ang = rnd(0, Math.PI * 2);
        e.x = fish.x + rnd(-300, 300); e.y = spawnY(120);
      }
    });
    const p = teams[activeTeam], { a, b } = p;
    const nextTeam = () => {
      p.phase = 'rest'; p.synced = false;
      const [r0, r1] = dive().rest; p.t = r0 + rnd(0, r1);
      activeTeam = (activeTeam + 1) % teams.length;
    };
    if (p.phase === 'rest') {
      p.t -= dt;
      if (p.t > 0 || !visibleTrout()) return;
      // Fly in from opposite sides (or swoop down from the waiting circle).
      for (const [e, side] of [[a, -1], [b, 1]]) {
        if (e.phase !== 'wait') { e.x = fish.x + side * rnd(150, 300); e.y = spawnY(80); }
        e.phase = 'track';
      }
      p.phase = 'hunt';
    } else if (p.phase === 'hunt') {
      if (!huntingNow(a) && !huntingNow(b)) { nextTeam(); return; } // they lost the trout
      if (a.phase !== 'circle' || b.phase !== 'circle') return;
      if (!p.synced) { b.ang = a.ang + Math.PI; b.dir = a.dir; b.t = a.t; b.circleDur = a.circleDur; p.synced = true; }
      if (a.t > 0 || !troutLanded()) return;
      if (Math.random() < sky().abort) {
        eagleLeave(a); eagleLeave(b); announce('The eagles lost you in the storm.'); nextTeam(); return;
      }
      const aim = eagleAim(dive().lead);
      p.tactic = Math.random() < 0.5 ? 'pincer' : 'onetwo';
      if (p.tactic === 'pincer') {
        // Across the trout's heading, 0.9 ring-widths each side.
        const h = Math.hypot(fish.vx, fish.vy) > 5 ? Math.atan2(fish.vy, fish.vx) : rnd(0, Math.PI * 2);
        const off = dive().radius * 0.9, ox = -Math.sin(h) * off, oy = Math.cos(h) * off;
        startDive(a, { x: aim.x + ox, y: aim.y + oy });
        startDive(b, { x: aim.x - ox, y: aim.y - oy }, true);
      } else startDive(a, aim);
      p.phase = 'strike';
    } else if (p.phase === 'strike') {
      // One-two: once the first dive is over, the partner strikes where the trout has landed.
      if (p.tactic === 'onetwo' && b.phase === 'circle' && a.phase !== 'lock' && troutLanded() && visibleTrout()) {
        startDive(b, eagleAim(dive().lead));
      }
      if (!huntingNow(a) && !huntingNow(b)) nextTeam();
    }
  }

  // ---------- herons ----------
  // Great blue herons stand on fallen logs, one heron per log: none before round 10, then one
  // more every 10 rounds (1 in rounds 10–19, 2 in 20–29, … 9 in 90–99; none in winter). Each heron walks
  // along its log to keep level with the trout. When the trout comes within reach it draws its
  // neck back (the warning), then spears the spot it aimed at. Herons have the same skill every round.
  const HERON = { speed: 45, reach: 160, hit: 26, cock: 0.45, strike: 0.16, recover: 1.1, rest: 18 };
  // Herons fly south for the winter, so none from WINTER_FROM on.
  const heronCount = n => (n < 10 || n >= WINTER_FROM ? 0 : Math.floor(n / 10));
  let herons = [], heronCatcher = null;
  const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
  const makeHeron = log => ({ log, x: log.x + log.w / 2, y: log.y + log.h / 2, angle: 0, state: 'wade', t: 0, tx: 0, ty: 0, neck: HERON.rest });
  // The stretch of a log a heron can walk along, and how close a point comes to that stretch.
  const logWalk = l => [l.y + 12, l.y + l.h - 12];
  function distToLog(l, x, y) {
    const [a, b] = logWalk(l);
    return Math.hypot(x - (l.x + l.w / 2), y - Math.max(a, Math.min(b, y)));
  }
  function updateHeron(h, dt) {
    if (mode !== 'play') {
      // Round over (splash, or caught by something else): stand down instead of freezing mid-strike.
      // The heron that made a catch holds its neck out through the dying animation instead.
      if (!(mode === 'dying' && deathBy === 'heron' && h === heronCatcher)) {
        h.state = 'wade';
        h.neck += (HERON.rest - h.neck) * Math.min(1, dt * 4);
      }
      return;
    }
    const prey = visibleTrout();
    if (h.state === 'wade') {
      // Walk along the log to stay level with the trout; with no trout in sight, stand still.
      if (prey) {
        const [a, b] = logWalk(h.log);
        const step = Math.max(-HERON.speed * dt, Math.min(HERON.speed * dt, prey.y - h.y));
        h.y = Math.max(a, Math.min(b, h.y + step));
      }
      const d = prey ? Math.hypot(prey.x - h.x, prey.y - h.y) : Infinity;
      const want = d < HERON.reach + 140 ? Math.atan2(prey.y - h.y, prey.x - h.x) : 0;
      h.angle += angleDiff(want, h.angle) * Math.min(1, dt * 4);
      h.neck += (HERON.rest - h.neck) * Math.min(1, dt * 6);
      if (d < HERON.reach && prey.z < 20) {
        h.state = 'cock'; h.t = HERON.cock;
        h.tx = prey.x; h.ty = prey.y; h.angle = want;
        tone(170, 0.3, 'sawtooth', 0.06, 0.7);
        announce('Heron striking!');
      }
    } else if (h.state === 'cock') {
      h.t -= dt;
      h.neck += (6 - h.neck) * Math.min(1, dt * 14);
      if (h.t <= 0) {
        h.state = 'strike'; h.t = HERON.strike;
        tone(950, 0.08, 'square', 0.05, 0.5);
        if (prey && Math.hypot(prey.x - h.tx, prey.y - h.ty) < HERON.hit && prey.z < 25) { heronCatcher = h; lose('heron'); }
      }
    } else if (h.state === 'strike') {
      h.t -= dt;
      h.neck += (heronStrikeNeck(h) - h.neck) * Math.min(1, dt * 30);
      if (h.t <= 0) { h.state = 'recover'; h.t = HERON.recover; }
    } else if (h.state === 'recover') {
      h.t -= dt;
      h.neck += (HERON.rest - h.neck) * Math.min(1, dt * 4);
      if (h.t <= 0) h.state = 'wade';
    }
  }
  const updateHerons = dt => { for (const h of herons) updateHeron(h, dt); };
  // Neck length that puts the bill tip (44 units past the neck) on the spot it aimed at.
  const heronStrikeNeck = h => Math.max(6, Math.hypot(h.tx - h.x, h.ty - h.y) - 44);

  // ---------- invisibility power-up ----------
  // From round 9 a shimmering river-mist bubble sits on the bank between the trout and the river.
  // Flopping into it hides the trout from the eagle and the heron for INVIS_TIME seconds.
  const INVIS_FROM = 9, INVIS_TIME = 6;
  const BUBBLE_R = 36, BUBBLE_GRAB = BUBBLE_R + 10; // drawn radius; trout picks it up within BUBBLE_GRAB
  let invisible = 0;
  const powerup = { active: false, x: 0, y: 0 };
  function updatePowerup(dt) {
    if (invisible > 0) {
      invisible = Math.max(0, invisible - dt);
      if (invisible === 0) { announce('Visible again.'); tone(520, 0.2, 'triangle', 0.06, 0.6); }
    }
    if (powerup.active && fish.z < 30 && Math.hypot(fish.x - powerup.x, fish.y - powerup.y) < BUBBLE_GRAB) {
      powerup.active = false; invisible = INVIS_TIME;
      burst(powerup.x, powerup.y, 24, '#e6f4ff', 180);
      [660, 880, 1175].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'sine', 0.08), i * 70));
      announce('Invisible for ' + INVIS_TIME + ' seconds.');
    }
  }

  // Falling snow in winter, in screen space. The weather sets how much falls: a storm and snowing
  // use fixed counts, and a clear round gets a few flurries that follow snowAt()'s snowfall
  // (heavier toward round 190, none by 199). With reduced motion the flakes hold still.
  function updateSnowfall(dt) {
    // Clear rounds get a few flurries; snowing fills the air; a storm drives it sideways.
    const base = !winter ? 0 : weather === 'storm' ? 420 : weather === 'snow' ? 220 : 40 * snowfall;
    const want = Math.min(480, Math.round(base * (W * H) / (412 * 915)));
    const storm = weather === 'storm';
    while (flakes.length < want) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(1, 2.8), vy: rnd(30, 70), ph: rnd(0, 6) });
    if (flakes.length > want) flakes.length = want;
    if (reduced) return;
    for (const f of flakes) {
      f.y += f.vy * (storm ? 2.2 : 1) * dt; f.x += (Math.sin(clock * 0.8 + f.ph) * 14 + (storm ? 260 : 0)) * dt;
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      if (f.x < 0) f.x += W; else if (f.x > W) f.x -= W;
    }
  }
  function drawSnowfall() {
    if (!flakes.length) return;
    if (weather === 'storm') { // wind-driven streaks
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath();
      for (const f of flakes) { ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - 11, f.y - 5); }
      ctx.stroke();
      return;
    }
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    for (const f of flakes) { ctx.moveTo(f.x + f.r, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); }
    ctx.fill();
  }

  function updateCanoe(dt) {
    if (winter) { canoe.active = false; return; } // no paddling on a frozen river
    if (!canoe.active) {
      canoe.t -= dt;
      if (canoe.t <= 0) {
        canoe.active = true; canoe.y = -90; canoe.off = rnd(-10, 10); canoe.vy = rnd(40, 55);
        canoe.color = CANOE_COLORS[Math.floor(Math.random() * CANOE_COLORS.length)];
      }
      return;
    }
    canoe.y += canoe.vy * dt;
    canoe.x = (farAt(canoe.y) + shoreAt(canoe.y)) / 2 + canoe.off;
    if (canoe.y > WH + 100) { canoe.active = false; canoe.t = rnd(9, 15); }
  }

  function update(dt) {
    clock += dt;
    // Banners only count down in play, so a bank built behind the start card still shows them.
    if (mode === 'play') {
      if (seasonTimer > 0) seasonTimer -= dt;
      else if (bannerTimer > 0) bannerTimer -= dt;
    }
    updateCanoe(dt);
    cam += (camTarget() - cam) * Math.min(1, dt * 5);

    if (mode === 'play') {
      fish.cooldown -= dt;
      fish.x += fish.vx * dt; fish.y += fish.vy * dt;
      if (fish.z > 0 || fish.vz > 0) {
        fish.vz -= GRAV * dt; fish.z += fish.vz * dt;
        if (fish.z <= 0) {
          fish.z = 0; fish.vz = 0; fish.landedAt = clock;
          burst(fish.x, fish.y, 6, '#b9cf8a', 110);
          tone(120, 0.08, 'sine', 0.12);
        }
      } else {
        const k = Math.max(0, 1 - (onIce() ? 1.8 : 7) * dt); // the trout slides much farther on ice
        fish.vx *= k; fish.vy *= k;
        if (Math.hypot(fish.vx, fish.vy) < 4) fish.vx = fish.vy = 0;
      }
      collide();
      runQueuedFlop(dt);

      if (troutMoved) moisture -= drainRate() * dt;
      for (const s of springs) {
        if (fish.z === 0 && s.water > 0 && Math.hypot(fish.x - s.x, fish.y - s.y) < s.r + 4) {
          const take = Math.min(s.water, 45 * dt, 100 - moisture);
          s.water -= take; moisture += take;
          if (!reduced && Math.random() < 0.3) burst(fish.x, fish.y, 1, '#d6f1ee', 80);
        }
      }
      updatePowerup(dt);
      if (troutMoved) { for (const e of eagles) updateEagle(e, dt); updateTeams(dt); }
      updateHerons(dt);
      if (mode === 'play') {
        if (inRiver()) reachRiver();
        else if (moisture <= 0) lose('dry');
      }
      updateHud();
    } else if (mode === 'saved') {
      if (savedHole) {
        // Slip down into the ice hole.
        fish.z = 0; fish.vx = fish.vy = 0;
        fish.x += (savedHole.x - fish.x) * Math.min(1, dt * 8);
        fish.y += (savedHole.y - fish.y) * Math.min(1, dt * 8);
      } else {
        // Swim off downstream.
        const target = (farAt(fish.y) + shoreAt(fish.y)) / 2;
        fish.z = Math.max(0, fish.z - 300 * dt);
        fish.x += (target - fish.x) * Math.min(1, dt * 2);
        fish.y += 160 * dt;
        fish.angle += (Math.PI / 2 - fish.angle) * Math.min(1, dt * 4);
      }
      updateHerons(dt);
      fish.alpha = Math.max(0, stateTimer / 1.4);
      stateTimer -= dt;
      if (stateTimer <= 0) {
        level++; makeLevel(level); mode = 'play'; updateHud();
        announce((seasonName ? seasonName + '. ' : '') + 'Round ' + level + ', ' + placeLine() + '.');
      }
    } else if (mode === 'dying') {
      updateHerons(dt);
      if (deathBy === 'eagle' && eagleCatcher) { fish.lift += dt * 1.5; eagleCatcher.y -= 260 * dt; fish.y -= 260 * dt; }
      if (deathBy === 'heron' && heronCatcher) {
        // Held up in the heron's bill.
        const h = heronCatcher;
        h.neck = heronStrikeNeck(h);
        const reach = 44 + h.neck;
        fish.x += (h.x + Math.cos(h.angle) * reach - fish.x) * Math.min(1, dt * 10);
        fish.y += (h.y + Math.sin(h.angle) * reach - fish.y) * Math.min(1, dt * 10);
        fish.lift = Math.min(0.3, fish.lift + dt);
      }
      stateTimer -= dt;
      if (stateTimer <= 0) showOver();
    }

    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const r of ripples) { r.age += dt; r.y += (winter ? 0 : 50) * dt; } // still water in an ice hole
    updateSnowfall(dt);
    ripples = ripples.filter(r => r.age < 1.4);
  }

  // ---------- draw ----------
  const hex = c => c.match(/\w\w/g).map(h => parseInt(h, 16));
  function mix(c1, c2, k) {
    const a = hex(c1), b = hex(c2);
    return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',') + ')';
  }

  // Autumn grass, or winter's dead brown grass.
  const groundColor = () => (winter ? '#a2946a' : '#7c9c52');
  const onScreen = (x, pad) => x > cam - pad && x < cam + view.w + pad;
  const snowColor = a => 'rgba(246,249,251,' + a + ')';
  const SNOW = snowColor(0.92);
  function drawGround(sec) {
    ctx.fillStyle = groundColor(); ctx.fillRect(-2000, -2000, WW + 4000, WH + 4000);
    // mown-grass stripes (autumn only)
    if (!winter) {
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      for (let y = -200; y < WH + 200; y += 60) ctx.fillRect(-2000, y, WW + 4000, 30);
    }
    drawGrass(sec);
    for (const l of leaves) {
      if (!onScreen(l.x, 20)) continue; // only the leaves on screen
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.a);
      ctx.fillStyle = l.c; ctx.beginPath(); ctx.ellipse(0, 0, 6, 3.5, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    if (winter && cover > 0) drawGroundSnow(sec);
  }

  // A 96-unit tile of fine snow grain (white and blue-grey specks), denser as coverage grows.
  // Made once per round and repeated across the ground, so the texture costs one fill per frame.
  function makeSnowGrain() {
    const c = document.createElement('canvas');
    c.width = c.height = 96;
    const g = c.getContext('2d');
    const specks = Math.round(60 + 220 * cover);
    for (let i = 0; i < specks; i++) {
      g.fillStyle = Math.random() < 0.35 ? 'rgba(170,190,212,0.7)' : 'rgba(255,255,255,0.85)';
      g.fillRect(Math.random() * 96, Math.random() * 96, 1.5, 1.5);
    }
    return ctx.createPattern(c, 'repeat');
  }

  // Winter ground snow: a white blanket that's absent at 10% coverage and solid at 100%; crisp,
  // rounded drifts with a blue-grey shadow, white body and bright crest (shadows and crests grow
  // with depth, so full-cover snow still shows its ridges); fine grain; and a few twinkling glints.
  // A drift's rounded outline: 12 wobbly points joined by smooth curves, offset by (dx, dy).
  function blobPath(d, grow, dx, dy) {
    const N = 12, pts = [];
    for (let k = 0; k < N; k++) {
      const a = k / N * Math.PI * 2;
      const wob = 1 + 0.12 * Math.sin(a * 3 + d.a * 7) + 0.05 * Math.sin(a * 5 + d.x);
      const px = Math.cos(a) * d.rx * grow * wob, py = Math.sin(a) * d.ry * grow * wob;
      pts.push([d.x + px * Math.cos(d.a) - py * Math.sin(d.a) + dx, d.y + px * Math.sin(d.a) + py * Math.cos(d.a) + dy]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const path = new Path2D();
    let m = mid(pts[N - 1], pts[0]); path.moveTo(m[0], m[1]);
    for (let k = 0; k < N; k++) { m = mid(pts[k], pts[(k + 1) % N]); path.quadraticCurveTo(pts[k][0], pts[k][1], m[0], m[1]); }
    path.closePath();
    return path;
  }
  // Each drift's three outlines are built once per round (snow depth is fixed within a round).
  function buildDriftPaths(d) {
    const lift = 2 + 5 * snow;
    d.shadow = blobPath(d, 1, lift, lift * 1.2);
    d.body = blobPath(d, 1, 0, 0);
    d.crest = blobPath(d, 0.6 + 0.1 * snow, -lift * 0.5, -lift * 0.6);
  }
  const shownDrifts = []; // reused each frame
  function drawGroundSnow(sec) {
    const blanket = Math.pow(clamp01((cover - 0.1) / 0.9), 1.5);
    if (blanket > 0) { ctx.fillStyle = 'rgba(242,246,250,' + blanket + ')'; ctx.fillRect(-2000, -2000, WW + 4000, WH + 4000); }
    shownDrifts.length = 0;
    for (const d of drifts) if (onScreen(d.x, d.rx * 1.3 + 20)) shownDrifts.push(d);
    ctx.fillStyle = 'rgba(160,184,206,' + (0.55 + 0.35 * snow) + ')';
    for (const d of shownDrifts) ctx.fill(d.shadow);
    ctx.fillStyle = '#f2f6fa';
    for (const d of shownDrifts) ctx.fill(d.body);
    ctx.fillStyle = '#ffffff';
    for (const d of shownDrifts) ctx.fill(d.crest);
    if (snowGrain) {
      ctx.globalAlpha = 0.35 + 0.5 * cover;
      ctx.fillStyle = snowGrain; ctx.fillRect(cam - 40, -40, view.w + 80, WH + 80);
      ctx.globalAlpha = 1;
    }
    // Glints: a few fixed spots per 60-unit cell that twinkle (steady with reduced motion).
    for (let gx = Math.floor((cam - 20) / 60) * 60; gx < cam + view.w + 20; gx += 60) {
      for (let gy = -60; gy < WH + 60; gy += 60) {
        const h = Math.abs(Math.sin(gx * 12.9898 + gy * 78.233) * 43758.5453) % 1;
        if (h > 0.35 * cover) continue;
        const x = gx + (h * 997) % 60, y = gy + (h * 577) % 60;
        ctx.fillStyle = 'rgba(255,255,255,' + (reduced ? 0.8 : 0.3 + 0.7 * Math.abs(Math.sin(sec * 2.5 + h * 300))) + ')';
        ctx.fillRect(x - 2.5, y - 0.6, 5, 1.2); ctx.fillRect(x - 0.6, y - 2.5, 1.2, 5);
      }
    }
  }

  // Grass blades leaning toward the top of the screen, tips swaying in the wind. Gusts roll across
  // the bank as a wave, so neighboring tufts bend together. Still under reduced motion.
  function drawGrass(sec) {
    const t = reduced ? 0 : sec;
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const c in grass) {
      ctx.strokeStyle = c;
      ctx.beginPath();
      const blades = grass[c];
      // The blades are sorted by x: skip to the first one on screen and stop at the last.
      let lo = 0, hi = blades.length;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (blades[mid].x > cam - 20) hi = mid; else lo = mid + 1; }
      for (let i = lo; i < blades.length; i++) {
        const g = blades[i];
        if (g.x >= cam + view.w + 20) break;
        const gust = reduced ? 0 : Math.sin(g.x * 0.012 - t * 1.8 + g.y * 0.004) * 0.45 + Math.sin(t * 0.7 + g.x * 0.03) * 0.15;
        const base = -Math.PI / 2 + g.a, tip = base + gust * (g.len / 12);
        const mx = g.x + Math.cos(base) * g.len * 0.5, my = g.y + Math.sin(base) * g.len * 0.5;
        ctx.moveTo(g.x, g.y);
        ctx.quadraticCurveTo(mx, my, g.x + Math.cos(tip) * g.len, g.y + Math.sin(tip) * g.len);
      }
      ctx.stroke();
    }
  }

  function drawRiver(sec) {
    if (winter) { drawIce(sec); return; }
    ctx.beginPath();
    ctx.moveTo(farAt(-400), -400);
    for (let y = -400; y <= WH + 400; y += 10) ctx.lineTo(farAt(y), y);
    for (let y = WH + 400; y >= -400; y -= 10) ctx.lineTo(shoreAt(y), y);
    ctx.closePath();
    const g = ctx.createLinearGradient(river.far, 0, river.base + 30, 0);
    g.addColorStop(0, '#1d555b'); g.addColorStop(0.5, '#25666b'); g.addColorStop(1, '#3a8a86');
    ctx.fillStyle = g; ctx.fill();
    // shallow riffle edge and gravel bar
    ctx.save();
    ctx.beginPath();
    for (let y = -400; y <= WH + 400; y += 10) ctx.lineTo(shoreAt(y) - 6, y);
    ctx.strokeStyle = 'rgba(160,210,200,0.55)'; ctx.lineWidth = 16; ctx.stroke();
    ctx.restore();
    for (const p of pebbles) {
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(shoreAt(p.y) + p.dx, p.y, p.r, 0, 7); ctx.fill();
    }
    const t = reduced ? 0 : sec;
    const laneX = (y, lane) => { const fx = farAt(y); return fx + (shoreAt(y) - fx) * lane; };
    ctx.lineCap = 'round';

    // Current: long, gently wavy flow lines that follow the banks and fade at both ends.
    // Mid-channel water moves faster than the water near the banks.
    for (let i = 0; i < 12; i++) {
      const lane = (i + 0.5) / 12, mid = 1 - Math.abs(lane - 0.5) * 2;
      const speed = 35 + mid * 55, len = 110 + (i * 37) % 80, period = WH + 400;
      for (let rep = 0; rep < 2; rep++) {
        const y0 = ((i * 211 + rep * period / 2 + t * speed) % period) - 200;
        ctx.beginPath();
        for (let s = 0; s <= 14; s++) {
          const y = y0 + s / 14 * len;
          const x = laneX(y, lane) + Math.sin(y * 0.04 + i * 1.3 + t * 0.8) * 4;
          s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        const g = ctx.createLinearGradient(0, y0, 0, y0 + len), a = 0.14 + mid * 0.12;
        g.addColorStop(0, 'rgba(225,242,238,0)'); g.addColorStop(0.5, 'rgba(225,242,238,' + a + ')'); g.addColorStop(1, 'rgba(225,242,238,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 2.2; ctx.stroke();
      }
    }

    // Surface glints: small crescents, curved upstream, that shimmer as they ride the current.
    for (let i = 0; i < 28; i++) {
      const lane = 0.08 + ((i * 0.618) % 1) * 0.84;
      const y = ((i * 89 + t * (40 + (i % 4) * 12)) % (WH + 200)) - 100;
      const shimmer = 0.5 + 0.5 * Math.sin(sec * 3 + i * 1.7);
      ctx.strokeStyle = 'rgba(255,255,255,' + 0.4 * shimmer + ')'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(laneX(y, lane), y, 4 + (i % 3) * 2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    }

    // Foam line where the current runs along the near bank, sliding downstream.
    ctx.save();
    ctx.beginPath();
    for (let y = -400; y <= WH + 400; y += 10) ctx.lineTo(shoreAt(y) - 13 + Math.sin(y * 0.09 + t * 2) * 2, y);
    ctx.setLineDash([14, 10, 4, 12]); ctx.lineDashOffset = -t * 45;
    ctx.strokeStyle = 'rgba(245,252,250,0.55)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();

    // Fallen leaves floating downstream, turning slowly.
    for (let i = 0; i < 7; i++) {
      const lane = 0.15 + ((i * 0.37) % 1) * 0.7;
      const y = ((i * 173 + t * (38 + (i % 3) * 10)) % (WH + 240)) - 120;
      ctx.save();
      ctx.translate(laneX(y, lane) + Math.sin(t * 0.9 + i) * 6, y);
      ctx.rotate(i + t * 0.6 * (i % 2 ? 1 : -1));
      ctx.fillStyle = LEAF_COLORS[i % LEAF_COLORS.length];
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 3.5, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
  }

  // Frozen river: snow-dusted ice with cracks, and ice-fishing holes, the only way back in.
  function drawIce(sec) {
    const icePath = () => {
      ctx.beginPath();
      ctx.moveTo(farAt(-400), -400);
      for (let y = -400; y <= WH + 400; y += 10) ctx.lineTo(farAt(y), y);
      for (let y = WH + 400; y >= -400; y -= 10) ctx.lineTo(shoreAt(y), y);
      ctx.closePath();
    };
    icePath();
    const g = ctx.createLinearGradient(river.far, 0, river.base + 30, 0);
    g.addColorStop(0, '#b5cfd9'); g.addColorStop(1, '#dbe9ef');
    ctx.fillStyle = g; ctx.fill();
    if (cover > 0) { icePath(); ctx.fillStyle = snowColor(0.7 * cover); ctx.fill(); }
    // Cracks, stored as a fraction of the way across the ice so they follow the banks.
    ctx.strokeStyle = 'rgba(110,150,170,0.5)'; ctx.lineWidth = 1.2;
    for (const c of cracks) {
      ctx.beginPath();
      c.forEach(([lane, y], i) => { const fx = farAt(y), x = fx + (shoreAt(y) - fx) * lane; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
    }
    for (const p of pebbles) {
      ctx.fillStyle = shadeHex(p.c, '#f4f7fa', 0.3 + 0.6 * cover);
      ctx.beginPath(); ctx.arc(shoreAt(p.y) + p.dx, p.y, p.r, 0, 7); ctx.fill();
    }
    for (const h of holes) {
      ctx.fillStyle = '#eef5f8';
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r + 6, h.r + 4, 0, 0, 7); ctx.fill();
      const w = ctx.createRadialGradient(h.x - 4, h.y - 4, 2, h.x, h.y, h.r);
      w.addColorStop(0, '#2a6a72'); w.addColorStop(1, '#0f3640');
      ctx.fillStyle = w; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.85, 0, 0, 7); ctx.fill();
      if (!reduced) {
        const k = (sec * 0.6 + h.seed) % 1;
        ctx.strokeStyle = 'rgba(220,240,245,' + 0.5 * (1 - k) + ')'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r * k, h.r * 0.85 * k, 0, 0, 7); ctx.stroke();
      }
    }
  }

  // Ice fisher from above: seated on an overturned bucket in a parka and knit hat, jigging a
  // short rod into the hole, with a tip-up flag on the other side.
  function drawIceFisher(h, sec) {
    const bx = h.x - 32, by = h.y + 4, fx = h.x + 28, fy = h.y - 12;
    const wave = reduced ? 0 : Math.sin(sec * 4 + h.seed) * 2;
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fx, fy + 8); ctx.lineTo(fx, fy - 8); ctx.stroke();
    ctx.fillStyle = '#e8622c';
    ctx.beginPath(); ctx.moveTo(fx, fy - 8); ctx.lineTo(fx + 12, fy - 5 + wave); ctx.lineTo(fx, fy - 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(40,60,70,0.22)'; ctx.beginPath(); ctx.ellipse(bx + 4, by + 5, 15, 12, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#d9dde0'; ctx.beginPath(); ctx.arc(bx, by, 11, 0, 7); ctx.fill();
    ctx.fillStyle = h.coat; ctx.beginPath(); ctx.ellipse(bx, by, 10, 12, 0, 0, 7); ctx.fill();
    const jig = reduced ? 0 : Math.sin(sec * 2.2 + h.seed) * 1.5;
    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx + 7, by - 2); ctx.lineTo(h.x - 12, h.y - 4 + jig); ctx.stroke();
    ctx.strokeStyle = 'rgba(240,240,240,0.9)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(h.x - 12, h.y - 4 + jig); ctx.lineTo(h.x - 4, h.y); ctx.stroke();
    ctx.fillStyle = '#e8c040'; ctx.beginPath(); ctx.arc(bx, by, 6.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#f7f7f2'; ctx.beginPath(); ctx.arc(bx - 2, by - 2, 2.5, 0, 7); ctx.fill();
  }

  // Limestone bluff across the river: ledges step back from the water, cedars cling to the rim.
  // In winter the ledges whiten as snow builds up.
  function drawBluff() {
    const edge = off => { ctx.beginPath(); for (let y = -400; y <= WH + 400; y += 10) ctx.lineTo(farAt(y) + off, y); };
    const snowy = c => (winter ? shadeHex(c, '#eef2f4', 0.2 + 0.65 * cover) : c);
    ctx.beginPath(); ctx.moveTo(-2000, -400);
    for (let y = -400; y <= WH + 400; y += 10) ctx.lineTo(farAt(y), y);
    ctx.lineTo(-2000, WH + 400); ctx.closePath();
    ctx.fillStyle = snowy('#b9b09b'); ctx.fill();
    const bands = [['#d6cdb8', 10, -6], ['#a59b86', 4, -14], ['#cbc2ac', 9, -22], ['#9a907b', 3, -31], ['#c4bba5', 8, -40]];
    for (const [c, w, off] of bands) { edge(off); ctx.strokeStyle = snowy(c); ctx.lineWidth = w; ctx.stroke(); }
    edge(9); ctx.strokeStyle = 'rgba(10,30,30,0.22)'; ctx.lineWidth = 14; ctx.stroke();
    for (const t of talus) { ctx.fillStyle = t.c; ctx.beginPath(); ctx.arc(farAt(t.y) + t.dx, t.y, t.r, 0, 7); ctx.fill(); }
    ctx.strokeStyle = 'rgba(90,80,65,0.45)'; ctx.lineWidth = 1.5;
    for (let y = -380; y < WH + 400; y += 47) {
      const x = farAt(y);
      ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x - 18, y + 6); ctx.lineTo(x - 30, y + 3); ctx.stroke();
    }
    for (const c of cedars) {
      const x = farAt(c.y) + c.dx - 30;
      ctx.fillStyle = 'rgba(30,40,20,0.3)'; ctx.beginPath(); ctx.arc(x + 5, c.y + 6, c.r, 0, 7); ctx.fill();
      ctx.fillStyle = c.c; ctx.beginPath(); ctx.arc(x, c.y, c.r, 0, 7); ctx.fill();
      if (winter && snow > 0.05) { ctx.fillStyle = SNOW; ctx.beginPath(); ctx.arc(x - c.r * 0.25, c.y - c.r * 0.25, c.r * (0.3 + 0.45 * snow), 0, 7); ctx.fill(); }
    }
  }

  // Fly angler in waders, seen from above: wide-brim hat, vest, rod and a chartreuse fly line.
  function drawAngler(a, sec) {
    ctx.save();
    ctx.translate(a.x, a.y);
    if (!reduced) {
      for (const k of [0, 0.5]) {
        const r = (sec * 0.5 + k + a.seed) % 1;
        ctx.strokeStyle = 'rgba(230,245,240,' + 0.5 * (1 - r) + ')'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, 13 + r * 16, 0, 7); ctx.stroke();
      }
    }
    ctx.rotate(a.facing);
    const sw = reduced ? 0 : Math.sin(sec * 1.6 + a.seed);
    const rodA = 0.35 * sw, tx = 8 + Math.cos(rodA) * 34, ty = 8 + Math.sin(rodA) * 34;
    ctx.strokeStyle = '#e4dc5c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + 26, ty - 22 * Math.cos(sec * 1.6 + a.seed), tx + 46 + 10 * sw, ty + 18 * Math.sin(sec * 0.8 + a.seed));
    ctx.stroke();
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = 'rgba(15,40,40,0.25)'; ctx.beginPath(); ctx.ellipse(3, 3, 11, 16, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#55603f'; ctx.beginPath(); ctx.ellipse(0, 0, 10, 15, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#b59f6a'; ctx.beginPath(); ctx.ellipse(-1, 0, 7, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#55603f'; ctx.beginPath(); ctx.ellipse(5, 9, 5, 3, 0.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#cdb985'; ctx.beginPath(); ctx.arc(1, 0, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#a8925c'; ctx.beginPath(); ctx.arc(1, 0, 5, 0, 7); ctx.fill();
    ctx.restore();
  }

  // Canoe drifting downstream with two paddlers in orange life jackets.
  function drawCanoe(sec) {
    const c = canoe;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(Math.PI / 2 + 0.08 * Math.sin(sec * 0.7));
    if (!reduced) {
      ctx.strokeStyle = 'rgba(230,245,240,0.45)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-36, -4); ctx.lineTo(-62, -16); ctx.moveTo(-36, 4); ctx.lineTo(-62, 16); ctx.stroke();
    }
    const hull = k => {
      ctx.beginPath(); ctx.moveTo(38 * k, 0);
      ctx.bezierCurveTo(20 * k, -12 * k, -20 * k, -12 * k, -38 * k, 0);
      ctx.bezierCurveTo(-20 * k, 12 * k, 20 * k, 12 * k, 38 * k, 0);
    };
    ctx.fillStyle = 'rgba(10,30,30,0.25)'; ctx.save(); ctx.translate(4, 5); hull(1); ctx.fill(); ctx.restore();
    hull(1); ctx.fillStyle = c.color; ctx.fill();
    hull(0.8); ctx.fillStyle = '#d9c49a'; ctx.fill();
    ctx.strokeStyle = '#a88a5c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(4, -8); ctx.lineTo(4, 8); ctx.moveTo(-6, -8); ctx.lineTo(-6, 8); ctx.stroke();
    const stroke = reduced ? 0 : Math.sin(sec * 2.4);
    for (const [px, side] of [[18, 1], [-20, -1]]) {
      const pa = side * stroke;
      ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px - 6 + pa * 8, side * 18); ctx.stroke();
      ctx.fillStyle = '#6b4a2b'; ctx.beginPath(); ctx.ellipse(px - 6 + pa * 8, side * 20, 5, 2.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#e0a32e'; ctx.beginPath(); ctx.arc(px, 0, 6.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#6b4a2b'; ctx.beginPath(); ctx.arc(px + 1, 0, 3.8, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawSpring(s) {
    const k = Math.max(0, s.water / 35);
    ctx.fillStyle = '#a69c86';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 5, 0, 7); ctx.fill();
