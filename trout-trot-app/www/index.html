    ctx.fillStyle = 'rgba(80,165,170,' + (0.3 + 0.6 * k) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.45 + 0.55 * k), 0, 7); ctx.fill();
    if (k > 0 && !reduced) {
      const ring = (clock * 0.8) % 1;
      ctx.strokeStyle = 'rgba(255,255,255,' + 0.5 * (1 - ring) + ')'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * k * ring, 0, 7); ctx.stroke();
    }
    // Decorah's springs stay about 48°F all year, so in winter they stay open and steam.
    if (winter && k > 0) {
      for (let i = 0; i < 3; i++) {
        const t = reduced ? 0.4 : (clock * 0.35 + i / 3) % 1;
        ctx.fillStyle = 'rgba(255,255,255,' + 0.3 * (1 - t) + ')';
        ctx.beginPath(); ctx.arc(s.x + (reduced ? 0 : Math.sin(clock + i * 2) * 8), s.y - t * s.r * 0.8, s.r * (0.2 + 0.3 * t), 0, 7); ctx.fill();
      }
    }
  }

  function drawLog(l) {
    ctx.fillStyle = 'rgba(30,40,20,0.25)'; ctx.fillRect(l.x + 5, l.y + 6, l.w, l.h);
    ctx.fillStyle = '#7a5434'; ctx.fillRect(l.x, l.y, l.w, l.h);
    ctx.strokeStyle = '#5c3d24'; ctx.lineWidth = 2;
    for (let y = l.y + 12; y < l.y + l.h - 6; y += 16) { ctx.beginPath(); ctx.moveTo(l.x + 3, y); ctx.lineTo(l.x + l.w - 4, y + 5); ctx.stroke(); }
    ctx.fillStyle = '#c99b66';
    ctx.beginPath(); ctx.ellipse(l.x + l.w / 2, l.y, l.w / 2, 5, 0, 0, 7); ctx.fill();
    if (winter && snow > 0.02) { // snow along the top of the log, widening as it builds
      ctx.fillStyle = SNOW;
      ctx.fillRect(l.x + 2, l.y + 3, Math.max(3, (l.w - 4) * Math.min(1, 0.25 + snow)), l.h - 6);
    }
  }

  function drawBoulder(b) {
    ctx.fillStyle = 'rgba(30,40,20,0.3)'; ctx.beginPath(); ctx.arc(b.x + 5, b.y + 6, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#cdc6b6'; ctx.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2, rr = b.r * (0.86 + 0.14 * Math.sin(a * 3 + b.seed));
      i ? ctx.lineTo(b.x + Math.cos(a) * rr, b.y + Math.sin(a) * rr) : ctx.moveTo(b.x + Math.cos(a) * rr, b.y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    // limestone bedding lines
    ctx.strokeStyle = 'rgba(120,110,95,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(b.x - b.r * 0.6, b.y - b.r * 0.1); ctx.lineTo(b.x + b.r * 0.5, b.y - b.r * 0.25);
    ctx.moveTo(b.x - b.r * 0.4, b.y + b.r * 0.35); ctx.lineTo(b.x + b.r * 0.6, b.y + b.r * 0.2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.25, 0, 7); ctx.fill();
    if (winter && snow > 0.02) { // snow cap, growing over the winter
      ctx.fillStyle = SNOW;
      ctx.beginPath(); ctx.ellipse(b.x - b.r * 0.15, b.y - b.r * 0.2, b.r * (0.4 + 0.45 * snow), b.r * (0.3 + 0.4 * snow), -0.5, 0, 7); ctx.fill();
    }
  }

  // ---------- forest ----------
  // Northeast Iowa hardwoods plus a few evergreens. Through autumn (rounds 1–99) each species turns
  // from summer green to its fall color on its own schedule, as a fraction of the season: ash and
  // hickory go yellow first, then sugar maples orange, red maples red, and the oaks russet last.
  // Clumps within a tree turn a little unevenly. In winter the hardwoods are bare.
  const SUMMER = ['#5f7f3a', '#6e8c42', '#4f6d33', '#7b9446'];
  const SPECIES = [
    { w: 2, pal: ['#e8c040', '#d9a92c', '#f2d460', '#c99a28'], turn: [0, 0.45] },   // ash, hickory, basswood
    { w: 3, pal: ['#e0782c', '#f0a03a', '#d55f22', '#e88a2e'], turn: [0.15, 0.6] }, // sugar maple
    { w: 3, pal: ['#c4372b', '#d8532f', '#e0743a', '#a8282a'], turn: [0.3, 0.75] }, // red maple
    { w: 2, pal: ['#8e4a28', '#a65a2e', '#7a3f22', '#b5713a'], turn: [0.55, 1] },   // bur and red oak
    { w: 1, pal: ['#2f4a33', '#3b5a3c', '#29402c'], evergreen: true }              // white pine, red cedar
  ];
  const SPECIES_TOTAL = SPECIES.reduce((s, sp) => s + sp.w, 0);
  const pickOne = a => a[Math.floor(Math.random() * a.length)];
  function pickSpecies() {
    let r = Math.random() * SPECIES_TOTAL;
    for (const sp of SPECIES) { r -= sp.w; if (r <= 0) return sp; }
    return SPECIES[0];
  }
  function shadeHex(c1, c2, k) {
    const a = hex(c1), b = hex(c2);
    return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * k).toString(16).padStart(2, '0')).join('');
  }
  function makeTree(x, y, r, dim) {
    const sp = pickSpecies();
    // How far this tree has turned this round: 0 = summer green, 1 = full fall color.
    const turned = sp.evergreen ? 0 : clamp01((fall - sp.turn[0]) / (sp.turn[1] - sp.turn[0]));
    const clump = () => sp.evergreen ? pickOne(sp.pal)
      : shadeHex(pickOne(SUMMER), pickOne(sp.pal), clamp01(turned * 1.2 + rnd(-0.2, 0.2)));
    const lobes = [{ dx: 0, dy: 0, r: r * 0.62, c: clump() }];
    const n = 6 + Math.floor(r / 10);
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + rnd(-0.3, 0.3), d = r * rnd(0.35, 0.6);
      lobes.push({ dx: Math.cos(a) * d, dy: Math.sin(a) * d, r: r * rnd(0.32, 0.5), c: clump() });
    }
    return { x, y, r, dim, lobes, bare: winter && !sp.evergreen };
  }
  // A leafless hardwood from above: limbs radiating from the trunk and forking toward the tips.
  // Snow settles along the limbs, on more of them as winter goes on.
  function paintBareTree(g, t) {
    const bark = t.dim ? shadeHex('#5b4a3b', '#1f2b22', t.dim) : '#5b4a3b';
    g.lineCap = 'round';
    const branch = (x, y, a, len, w, depth) => {
      const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len;
      g.strokeStyle = bark; g.lineWidth = w;
      g.beginPath(); g.moveTo(x, y); g.lineTo(ex, ey); g.stroke();
      if (snow > 0 && Math.random() < 0.2 + snow * 0.8) {
        g.strokeStyle = SNOW; g.lineWidth = Math.max(1, w * 0.55);
        g.beginPath(); g.moveTo(x - 0.8, y - 0.8); g.lineTo(ex - 0.8, ey - 0.8); g.stroke();
      }
      if (depth > 0) for (const s of [-1, 1]) branch(ex, ey, a + s * rnd(0.3, 0.6), len * rnd(0.5, 0.7), w * 0.6, depth - 1);
    };
    const limbs = 6 + Math.floor(t.r / 9);
    for (let i = 0; i < limbs; i++) {
      branch(t.x, t.y, i / limbs * Math.PI * 2 + rnd(-0.25, 0.25), t.r * rnd(0.4, 0.55), Math.max(1.5, t.r / 12), 2);
    }
    g.fillStyle = bark; g.beginPath(); g.arc(t.x, t.y, Math.max(2.5, t.r / 9), 0, Math.PI * 2); g.fill();
  }
  function paintShadow(g, t) {
    const off = t.r * 0.32;
    g.fillStyle = 'rgba(20,30,15,0.28)';
    g.beginPath();
    for (const l of t.lobes) {
      const cx = t.x + l.dx + off, cy = t.y + l.dy + off * 1.15;
      g.moveTo(cx + l.r, cy); g.arc(cx, cy, l.r, 0, Math.PI * 2);
    }
    g.fill();
  }
  function paintTree(g, t) {
    // Clumps in shade (lower right) first, sunlit ones (upper left) on top.
    const lobes = [...t.lobes].sort((a, b) => (b.dx + b.dy) - (a.dx + a.dy));
    for (const l of lobes) {
      const cx = t.x + l.dx, cy = t.y + l.dy;
      const base = t.dim ? shadeHex(l.c, '#1f2b22', t.dim) : l.c;
      const grd = g.createRadialGradient(cx - l.r * 0.35, cy - l.r * 0.4, l.r * 0.1, cx, cy, l.r);
      grd.addColorStop(0, shadeHex(base, '#ffffff', 0.22));
      grd.addColorStop(0.55, base);
      grd.addColorStop(1, shadeHex(base, '#000000', 0.35));
      g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, l.r, 0, Math.PI * 2); g.fill();
    }
    // Speckled leaf texture.
    const n = Math.round(t.r * 0.8);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * t.r * 0.8;
      g.fillStyle = Math.random() < 0.5 ? 'rgba(255,240,200,0.18)' : 'rgba(30,20,10,0.18)';
      g.beginPath(); g.arc(t.x + Math.cos(a) * d, t.y + Math.sin(a) * d, rnd(1, 2.6), 0, Math.PI * 2); g.fill();
    }
    // Winter: snow caps on the evergreens' clumps, more of them as the snow builds.
    if (snow > 0) {
      g.fillStyle = SNOW;
      for (const l of t.lobes) {
        if (Math.random() > 0.2 + snow * 0.8) continue;
        g.beginPath();
        g.ellipse(t.x + l.dx - l.r * 0.2, t.y + l.dy - l.r * 0.25, l.r * (0.35 + 0.4 * snow), l.r * (0.25 + 0.3 * snow), -0.4, 0, Math.PI * 2);
        g.fill();
      }
    }
  }
  // The forest is drawn once per round into its own canvas, then copied each frame.
  // It's only painted as deep into the woods as the camera can show: on a phone the view never
  // goes past the bank's edge, so only the first two rows are built, which keeps the
  // round-start cost low on slower devices. Wide screens get all four rows.
  let treeLayer = null;
  function treeReach() {
    const right = view.w >= WW + 40 ? (WW + view.w) / 2 : WW;
    return Math.min(620, Math.max(0, right - TREES) + 70);
  }
  function buildTrees() {
    const reach = treeReach();
    const x0 = TREES - 70, x1 = TREES + reach, y0 = -160, y1 = WH + 160, k = 1.5;
    const c = document.createElement('canvas');
    c.width = Math.ceil((x1 - x0) * k); c.height = Math.ceil((y1 - y0) * k);
    const g = c.getContext('2d');
    g.scale(k, k); g.translate(-x0, -y0);
    const floor = g.createLinearGradient(TREES - 20, 0, TREES + 90, 0);
    const shade = winter ? '70,72,80' : '60,80,40'; // cool shade on snow, green shade on grass
    floor.addColorStop(0, 'rgba(' + shade + ',0)'); floor.addColorStop(1, 'rgba(' + shade + ',' + (winter ? 0.35 : 0.6) + ')');
    g.fillStyle = floor; g.fillRect(TREES - 20, y0, x1 - TREES + 20, y1 - y0);
    // Rows from deep in the woods out to the bank edge: farther rows are smaller and darker.
    const rows = [
      { from: 330, to: 620, rmin: 24, rmax: 40, dim: 0.38 },
      { from: 190, to: 330, rmin: 28, rmax: 48, dim: 0.24 },
      { from: 80, to: 190, rmin: 32, rmax: 56, dim: 0.11 },
      { from: 0, to: 80, rmin: 22, rmax: 62, dim: 0 }
    ];
    for (const row of rows) {
      if (row.from >= reach) continue;
      const list = [];
      for (let cx = row.from; cx < row.to; cx += 85) {
        for (let y = y0 + rnd(0, 30); y < y1; ) {
          const r = rnd(row.rmin, row.rmax);
          const x = TREES + Math.max(r * 0.6, cx + rnd(0, Math.min(85, row.to - cx)));
          list.push(makeTree(x, y + rnd(-10, 10), r, row.dim));
          y += r * rnd(0.9, 1.4);
        }
      }
      list.sort((a, b) => a.y - b.y);
      for (const t of list) if (!t.bare) paintShadow(g, t);
      for (const t of list) (t.bare ? paintBareTree : paintTree)(g, t);
    }
    treeLayer = { canvas: c, x: x0, y: y0, w: x1 - x0, h: y1 - y0, reach };
  }
  function drawTrees() {
    if (treeLayer) ctx.drawImage(treeLayer.canvas, treeLayer.x, treeLayer.y, treeLayer.w, treeLayer.h);
  }

  // Rainbow trout seen from above: olive spotted back, pink stripe, silver sides, forked tail.
  const SPOTS = [[0.22, -0.3], [0.3, 0.25], [0.38, -0.1], [0.46, 0.35], [0.52, -0.35], [0.6, 0.1], [0.68, -0.2], [0.74, 0.3], [0.8, -0.05], [0.86, 0.2]];
  function drawTrout(dry, dead) {
    const L = 50;
    const onGround = fish.z === 0 && mode === 'play';
    const wig = reduced ? 0 : onGround ? Math.sin(clock * (11 + (100 - moisture) * 0.08)) * (0.5 + (100 - moisture) * 0.008) : fish.z > 0 ? 0.6 : Math.sin(clock * 6) * 0.4;
    const bend = dead ? 0.8 : wig;
    const spine = [], N = 10;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      spine.push({ x: L / 2 - t * L, y: bend * t * t * 12, w: 9.5 * Math.sin(Math.PI * Math.min(1, 0.14 + t * 0.92)) + 0.6 });
    }
    const body = (scale, color) => {
      ctx.fillStyle = color; ctx.beginPath();
      spine.forEach((p, i) => i ? ctx.lineTo(p.x, p.y - p.w * scale) : ctx.moveTo(p.x, p.y - p.w * scale));
      for (let i = spine.length - 1; i >= 0; i--) ctx.lineTo(spine[i].x, spine[i].y + spine[i].w * scale);
      ctx.closePath(); ctx.fill();
    };
    const tail = spine[N];
    const silver = mix('dcdcd2', 'c8b89a', dry), pink = mix('e3798c', 'c2a183', dry), olive = mix('6b7a3a', '8f8467', dry);
    ctx.fillStyle = olive;
    ctx.beginPath();
    ctx.moveTo(tail.x + 2, tail.y);
    ctx.lineTo(tail.x - 13, tail.y - 10 + bend * 3); ctx.lineTo(tail.x - 8, tail.y + bend * 4); ctx.lineTo(tail.x - 13, tail.y + 10 + bend * 3);
    ctx.closePath(); ctx.fill();
    // pectoral fins
    ctx.fillStyle = mix('e9b2a0', 'c8b89a', dry);
    const pf = spine[3];
    ctx.beginPath(); ctx.ellipse(pf.x - 2, pf.y - pf.w - 2, 6, 2.5, -0.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(pf.x - 2, pf.y + pf.w + 2, 6, 2.5, 0.6, 0, 7); ctx.fill();
    body(1, silver);
    body(0.78, pink);
    body(0.48, olive);
    ctx.fillStyle = 'rgba(20,25,15,0.85)';
    for (const [t, off] of SPOTS) {
      const i = Math.min(N, Math.round(t * N)), p = spine[i];
      ctx.beginPath(); ctx.arc(L / 2 - t * L, p.y + off * p.w, 1.3, 0, 7); ctx.fill();
    }
    const head = spine[1];
    for (const sgn of [-1, 1]) {
      const ex = head.x - 1, ey = head.y + sgn * (head.w - 1);
      ctx.fillStyle = '#f1efe6'; ctx.beginPath(); ctx.arc(ex, ey, 2.6, 0, 7); ctx.fill();
      if (dead) {
        ctx.strokeStyle = '#1f2b22'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(ex - 1.8, ey - 1.8); ctx.lineTo(ex + 1.8, ey + 1.8); ctx.moveTo(ex + 1.8, ey - 1.8); ctx.lineTo(ex - 1.8, ey + 1.8); ctx.stroke();
      } else { ctx.fillStyle = '#1f2b22'; ctx.beginPath(); ctx.arc(ex + 0.4, ey, 1.4, 0, 7); ctx.fill(); }
    }
  }

  function drawFish() {
    const dry = 1 - Math.max(0, moisture) / 100;
    const dead = mode === 'dying' || mode === 'over';
    const z = fish.z + fish.lift * 120;
    ctx.save();
    // Invisible: see-through. In the last 1.5 seconds it flickers as a warning, or with
    // reduced motion turned on, steps up to a steady, less see-through look instead.
    const ending = invisible > 0 && invisible < 1.5;
    const ghost = invisible <= 0 ? 1 : !ending ? 0.3 : reduced ? 0.55 : Math.floor(clock * 8) % 2 ? 0.75 : 0.3;
    ctx.globalAlpha = fish.alpha * ghost;
    // shadow on the ground
    ctx.fillStyle = 'rgba(25,35,15,' + (0.3 - Math.min(0.2, z / 300)) + ')';
    // Clamp: once the eagle lifts the trout high, these radii would go negative, which canvas rejects.
    ctx.beginPath(); ctx.ellipse(fish.x + 3, fish.y + 4, Math.max(2, 24 - z / 10), Math.max(1, 10 - z / 25), fish.angle, 0, 7); ctx.fill();
    ctx.translate(fish.x, fish.y - z * 0.45);
    const sc = 1 + z / 160;
    ctx.scale(sc, sc);
    ctx.rotate(fish.angle);
    drawTrout(dry, dead);
    ctx.restore();
    if (mode === 'play' && moisture < 40 && !reduced) {
      const k = (clock * 1.5) % 1;
      ctx.fillStyle = 'rgba(150,215,225,' + (1 - k) + ')';
      ctx.beginPath(); ctx.arc(fish.x + 14, fish.y - 18 + k * 12, 3, 0, 7); ctx.fill();
    }
  }

  // Great blue heron from above: grey-blue body and folded wings, pale neck, white head with a
  // black crest plume, and a long yellow bill. A dashed ring shows its reach as the trout nears;
  // it turns red, with a small ring on the aimed spot, while the heron is about to strike.
  function drawHeron(h) {
    const near = Math.hypot(fish.x - h.x, fish.y - h.y);
    const cocked = h.state === 'cock' && mode === 'play';
    ctx.save();
    ctx.translate(h.x, h.y);
    if (mode === 'play' && visibleTrout() && (cocked || near < HERON.reach + 90)) {
      const k = cocked ? 1 : Math.min(1, 1 - (near - HERON.reach) / 90);
      ctx.strokeStyle = cocked ? 'rgba(200,65,47,0.85)' : 'rgba(250,249,243,' + 0.55 * k + ')';
      ctx.lineWidth = 2.5; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.arc(0, 0, HERON.reach, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = 'rgba(25,35,15,0.25)';
    ctx.beginPath(); ctx.ellipse(7, 9, 26, 14, h.angle, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(h.angle);
    const hx = 14 + h.neck;
    ctx.fillStyle = '#5d6e82';
    ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-37, -6); ctx.lineTo(-37, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7f91a5';
    ctx.beginPath(); ctx.ellipse(-4, 0, 24, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#62748a';
    ctx.beginPath(); ctx.ellipse(-8, -6, 19, 7, -0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-8, 6, 19, 7, 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#a9b6c4'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.quadraticCurveTo(14 + h.neck * 0.5, cocked ? 7 : 3, hx, 0); ctx.stroke();
    ctx.fillStyle = '#e2a43a';
    ctx.beginPath(); ctx.moveTo(hx + 4, -2.6); ctx.lineTo(hx + 30, 0); ctx.lineTo(hx + 4, 2.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f1f3f5';
    ctx.beginPath(); ctx.ellipse(hx, 0, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1f2b22'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx - 1, -2.5); ctx.lineTo(hx - 15, -5); ctx.stroke();
    ctx.fillStyle = '#e8c040';
    ctx.beginPath(); ctx.arc(hx + 2, -2.6, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (cocked) {
      ctx.strokeStyle = 'rgba(200,65,47,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(h.tx, h.ty, HERON.hit, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Invisibility bubble: a bobbing, shimmering ball of river mist with sparkles circling it.
  function drawPowerup() {
    if (!powerup.active) return;
    const r = BUBBLE_R, x = powerup.x, y = powerup.y + (reduced ? 0 : Math.sin(clock * 3) * 4);
    ctx.fillStyle = 'rgba(25,35,15,0.2)';
    ctx.beginPath(); ctx.ellipse(powerup.x + 6, powerup.y + 24, 32, 12, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(x - 12, y - 14, 4, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.45, 'rgba(190,225,240,0.6)'); g.addColorStop(1, 'rgba(150,200,230,0.2)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    const a = reduced ? 0 : clock * 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath(); ctx.arc(x, y, r * 0.55, a, a + 2.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r * 0.3, a + 3, a + 4.8); ctx.stroke();
    for (let i = 0; i < 3 && !reduced; i++) {
      const t = (clock * 0.8 + i / 3) % 1, ang = i * 2.1 + clock, d = r + 8 + t * 16;
      ctx.fillStyle = 'rgba(255,255,255,' + (1 - t) + ')';
      ctx.beginPath(); ctx.arc(x + Math.cos(ang) * d, y + Math.sin(ang) * d, 2.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  // The red ring marks exactly where a dive will strike; leave it to escape.
  function drawEagleRing(e) {
    if (e.phase !== 'lock' || mode !== 'play') return;
    const k = Math.min(1, 1 - e.t / (e.lockDur || 0.75));
    ctx.strokeStyle = 'rgba(200,65,47,' + (0.4 + 0.5 * k) + ')'; ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.arc(e.tx, e.ty, dive().radius, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  // Snow and storms: a white haze beyond `sight` units of the trout, painted over the scene.
  function drawHaze() {
    const s = sky();
    if (!s.haze || mode === 'title') return;
    const p = toScreen(fish.x, fish.y), r = s.sight * view.s;
    const g = ctx.createRadialGradient(p.x, p.y, r * 0.45, p.x, p.y, r);
    g.addColorStop(0, 'rgba(236,241,245,0)'); g.addColorStop(1, 'rgba(236,241,245,' + s.haze + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function worldTransform() {
    ctx.translate(0, view.oy); ctx.scale(view.s, view.s);
    if (flip) { ctx.translate(cam + view.w, 0); ctx.scale(-1, 1); } else ctx.translate(-cam, 0);
  }
  function drawEagle(e) {
    if (e.phase === 'off' || e.phase === 'idle') return;
    const locking = e.phase === 'lock';
    const k = locking ? Math.min(1, 1 - e.t / (e.lockDur || 0.75)) : 0;
    // Size the silhouette (wingtips at ±60 when unscaled) so the wingtips land exactly on the
    // strike ring at the moment it hits: whatever the wings cover then is what gets caught.
    const fit = dive().radius / 60;
    const sc = fit * (e.phase === 'carry' ? 1.1 : 1.5 - k * 0.5);
    drawEagleRing(e);
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.heading || 0);
    ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(15,22,12,' + (e.phase === 'wait' ? 0.12 : 0.28 + k * 0.25) + ')';
    // wingspan silhouette, head toward the top
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.quadraticCurveTo(14, -6, 54, -4); ctx.lineTo(60, 4); ctx.lineTo(48, 2); ctx.lineTo(52, 9); ctx.lineTo(38, 5);
    ctx.quadraticCurveTo(14, 8, 9, 14); ctx.lineTo(13, 28); ctx.lineTo(0, 24); ctx.lineTo(-13, 28); ctx.lineTo(-9, 14);
    ctx.quadraticCurveTo(-14, 8, -38, 5); ctx.lineTo(-52, 9); ctx.lineTo(-48, 2); ctx.lineTo(-60, 4); ctx.lineTo(-54, -4);
    ctx.quadraticCurveTo(-14, -6, 0, -22);
    ctx.fill();
    ctx.restore();
  }

  function drawAim() {
    if (!ptr || !canFlop()) return;
    const dx = (ptr.x - ptr.x0) * (flip ? -1 : 1), dy = ptr.y - ptr.y0, dist = Math.hypot(dx, dy);
    if (dist < 14) return;
    const mag = swipeMag(dist) * flopScale(), air = 2 * 360 / GRAV, reach = mag * air;
    const ux = dx / dist, uy = dy / dist;
    ctx.fillStyle = 'rgba(250,249,243,0.85)';
    for (let i = 1; i <= 10; i++) {
      const d = reach * i / 10;
      ctx.beginPath(); ctx.arc(fish.x + ux * d, fish.y + uy * d, 3.2, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(250,249,243,0.9)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(fish.x + ux * reach, fish.y + uy * reach, 10, 0, 7); ctx.stroke();
  }

  function screenText(text, x, y, size, fill = '#faf9f3') {
    ctx.font = '700 ' + size + 'px Fredoka, "Arial Rounded MT Bold", sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = Math.max(3, size / 7); ctx.strokeStyle = '#1f2b22'; ctx.fillStyle = fill;
    ctx.strokeText(text, x, y); ctx.fillText(text, x, y);
  }

  function draw(now) {
    const sec = now / 1000;
    ctx.fillStyle = groundColor(); ctx.fillRect(0, 0, W, H);
    ctx.save();
    worldTransform();
    drawGround(sec);
    drawRiver(sec);
    drawBluff();
    for (const a of anglers) drawAngler(a, sec);
    for (const h of holes) drawIceFisher(h, sec);
    if (canoe.active) drawCanoe(sec);
    // Splash rings spreading out and drifting with the current.
    for (const r of ripples) {
      for (const lag of [0, 0.22, 0.44]) {
        const a = r.age - lag;
        if (a <= 0) continue;
        ctx.strokeStyle = 'rgba(235,248,245,' + Math.max(0, 0.7 * (1 - a / 1)) + ')'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, 8 + a * 70, 6 + a * 52, 0, 0, 7); ctx.stroke();
      }
    }
    for (const s of springs) drawSpring(s);
    for (const l of logs) drawLog(l);
    for (const b of boulders) drawBoulder(b);
    drawPowerup();
    if (mode !== 'title') drawFish();
    for (const h of herons) drawHeron(h);
    drawTrees();
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2.5));
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawAim();
    for (const e of eagles) drawEagle(e);
    ctx.restore();

    drawHaze();
    // Dive rings go back on top of the haze: the weather never hides a strike.
    if (sky().haze) { ctx.save(); worldTransform(); for (const e of eagles) drawEagleRing(e); ctx.restore(); }
    drawSnowfall();

    // Text stays unmirrored, in screen space.
    const fs = Math.max(0.7, view.s);
    // While the river is off screen, a tag on that edge points to it with the distance in feet.
    if (mode === 'play' && shoreAt(fish.y) < cam) {
      // In winter it points to the nearest ice-fishing hole instead.
      const hole = winter ? holes.reduce((b, h) => (!b || Math.hypot(h.x - fish.x, h.y - fish.y) < Math.hypot(b.x - fish.x, b.y - fish.y) ? h : b), null) : null;
      const away = hole ? Math.hypot(hole.x - fish.x, hole.y - fish.y) : fish.x - shoreAt(fish.y);
      const feet = Math.max(1, Math.round(away / 43)), name = hole ? 'Ice hole' : 'River';
      const label = flip ? name + ' ' + feet + ' ft ▶' : '◀ ' + name + ' ' + feet + ' ft';
      ctx.font = '800 ' + Math.round(15 * fs) + 'px Nunito, system-ui, sans-serif';
      const tw = ctx.measureText(label).width + 22, th = 30 * fs;
      const tx = flip ? W - 12 - tw : 12;
      const ty = Math.max(70, Math.min(H - th - 12, view.oy + fish.y * view.s - th / 2));
      ctx.fillStyle = 'rgba(44,111,116,0.92)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(tx, ty, tw, th, th / 2); else ctx.rect(tx, ty, tw, th);
      ctx.fill();
      ctx.fillStyle = '#faf9f3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, tx + tw / 2, ty + th / 2 + 1);
      ctx.textBaseline = 'alphabetic';
    }
    if (mode === 'play' && seasonTimer > 0) {
      // Fade in over 0.4 s, hold, fade out over the last 0.5 s, in sugar-maple orange.
      ctx.globalAlpha = Math.max(0, Math.min(1, seasonTimer / 0.5, (SEASON_TIME - seasonTimer) / 0.4));
      screenText(seasonName, W / 2, view.oy + 250 * view.s, 64 * fs, winter ? '#d6ecf7' : '#f0a03a');
      ctx.globalAlpha = 1;
    } else if (mode === 'play' && bannerTimer > 0) {
      ctx.globalAlpha = Math.min(1, bannerTimer);
      screenText('Round ' + level, W / 2, view.oy + 240 * view.s, 44 * fs);
      screenText(placeLine(), W / 2, view.oy + 240 * view.s + 34 * fs, 22 * fs);
      ctx.globalAlpha = 1;
    }
    if (mode === 'play' && hintOn && level === 1) {
      const p = toScreen((shoreAt(fish.y) + fish.x) / 2, fish.y - 70);
      screenText('← Swipe toward the river', p.x, p.y, 22 * fs);
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    // Schedule the next frame first, so one bad frame can't freeze the game.
    requestAnimationFrame(frame);
    // A frame's timestamp can be a little earlier than the time recorded at start-up or on resume;
    // never let the game clock step backward (negative sizes would follow, which canvas rejects).
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000));
    last = now;
    if (mode !== 'paused') update(dt);
    draw(now);
  }
  function boot() {
    resize();
    level = savedRound;
    makeLevel(level); // the bank behind the start card is the round they'll play
    layoutReady = true;
    restartBtn.hidden = savedRound <= 1;
    addEventListener('resize', resize);
    requestAnimationFrame(frame);
    try { $('startBtn').focus({ preventScroll: true }); } catch (e) {}
  }
  boot();
})();
</script>

</body>
</html>
